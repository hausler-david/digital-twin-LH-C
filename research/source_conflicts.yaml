  - PROTON_BETA_STAR_MULHC
  - PROTON_BUNCH_LENGTH_RMS_SYN
  - MACHINE_PEAK_LUMINOSITY_NUCL_PB
  - MACHINE_PEAK_LUMINOSITY_NUCL_XE
  - MACHINE_PEAK_LUMINOSITY_NUCL_O
  - MACHINE_PEAK_LUMINOSITY_NUCL_NE
  competing_values:
  - value: naive formula, geometric factor H = 1, no decay averaging
    unit: dimensionless
    source_id: SRC_ARXIV_2610_35154
    scenario: LHMUC-DIS2026-1TEV
    context: 'Table 1 (p.4) gives 2.1e34 with f = 4 MHz, N_mu = 0.07e11, N_p = 22e11, sigma_x,y = 4.8 um and no beta*, bunch
      length or emittance. AUDIT COMPUTATION: f N_mu N_p/(4 pi sigma^2) = 2.13e34 cm^-2 s^-1, i.e. the printed value is reproduced
      with H = 1 and no decay factor (tests/scientific, P1). The source does not state its formula; the model is inferred
      from the reproduction.'
  - value: 'AloHEP: pinch effect, particle decay, hourglass effect included'
    unit: dimensionless
    source_id: SRC_ARXIV_2506_15445
    scenario: MULHC-PTEP2026-ERL-BOOSTER
    context: 'p.11: ''AloHEP [60–62] ... accounts for significant luminosity-altering effects such as the pinch effect, particle
      decay, hourglass effect etc.'' and p.12 ''luminosity values for two options were calculated within the AloHEP software,
      with beam size matched accordingly''. Parameter MACHINE_LUMINOSITY_CODE_MULHC.'
  - value: 0.63
    unit: dimensionless
    source_id: SRC_ARXIV_2506_15445
    scenario: null
    context: 'p.11: ''the average number of muons present in the ring throughout this 2000-turn circulation period is determined
      to be approximately 0.63 times the initial injected number of muons'' (1 - 1/e over one lab lifetime). AUDIT COMPUTATION:
      naive L for the ERL option = 4e6 x 3.0e10 x 2.2e11 / (4 pi (4.3e-4 cm)^2) = 1.14e34; x 0.63 = 7.16e33 = printed 7.2e33
      to 1%; μTRISTAN option 1.40e34 x 0.63 = 8.83e33 = printed 8.8e33. Parameter MACHINE_MU_AVERAGE_POPULATION_FRACTION_MULHC.'
  - value: 0.64
    unit: dimensionless
    source_id: SRC_WS1681458_DAGLI_NUCLEUS
    scenario: null
    context: 'p.8 side box: ''≈ 0.64 N0 time-averaged bunch population between 50 Hz refills''. Same decay-averaging idea
      as the μLHC 0.63, now tied to a 50 Hz refill (20 ms period ≈ one lab lifetime). Parameter MACHINE_MU_TIME_AVERAGED_POPULATION_FRACTION_NUCL.'
  - value: 'audit decomposition (corrected): naive 1.14e34 (ERL) / 1.40e34 (muTRISTAN); x decay average 0.632 = 7.18e33 /
      8.86e33, matching the printed 7.2e33 / 8.8e33 to <2%; no residual factor'
    unit: dimensionless
    source_id: SRC_ARXIV_2506_15445
    scenario: MULHC-PTEP2026-ERL-BOOSTER
    context: 'Audit computation (tests/scientific/test_analytical_checks.py::test_mulhc_table3_luminosity_reproduced_by_naive_formula_times_decay_average).
      The first version of this entry, handed to the registry author during the build, contained a factor-10 slip (naive 1.14e35
      from N_p = 2.2e12 instead of the Table 2 value 22e10 = 2.2e11) and a spurious ''residual factor ~5''; the registry author
      did not reproduce it and the lead corrected the test and this entry on 2026-10-28. What remains open: the hourglass
      factor computed for the stated optics (beta*_y,mu = 0.7 cm, beta*_p = 7 cm, mu bunch 2 mm, proton bunch length assumed
      7.5 cm = PROTON_BUNCH_LENGTH_RMS_SYN, not sourced) is ~0.53, yet the published values show no such reduction; either
      AloHEP used a shorter proton bunch, relaxed/matched muon optics (sigma 4.3 um for both beams implies beta*_mu ~4.4 cm,
      cf. MACHINE_MU_BETA_STAR_MATCHED_IMPLIED_MULHC), or no hourglass term. Not determinable from the sources; requires AloHEP
      input decks (missing_evidence).'
  possible_cause: 'The two primary documents use different luminosity models and neither states its formula: the DIS2026 example
    table is reproduced exactly by the geometric formula with H = 1 and no decay averaging, whereas the μLHC values are reproduced
    by the same formula times the authors'' 0.63 decay-average factor. If AloHEP also applied a hourglass reduction for a
    ~7.5 cm proton bunch against beta* = 7 cm (H ~0.7-0.8 by the registry author''s estimate), the printed 8.8e33 / 7.2e33
    would have to contain a compensating effect (e.g. a different decay treatment, the ''beam size matched'' step, or a pinch
    enhancement) that is not documented. The lead''s ''residual factor ~5'' is traced to a factor-10 arithmetic slip (1.14e34
    for 1.14e34), not to the sources.'
  selected_treatment: 'Open. Every luminosity in the registry carries, in its notes, the model with which it was reproduced
    (DIS2026: H = 1, no decay; μLHC: naive x 0.63). The project''s own luminosity tool (lhmuc/analytical.py) must expose H,
    the decay-average factor and the beam-beam treatment as explicit, separately reported factors, default H = 1 flagged as
    an assumption, and must never silently apply a hourglass factor to a source value. The hourglass factor for the μLHC optics
    is treated as a scan variable (proton bunch length 7.5-9 cm, an external HL-LHC-type assumption requiring an assumption
    record) until the AloHEP inputs are known.'
  effect_on_simulations: A factor 0.6-1.0 (hourglass) times 0.25-1.0 (decay/duty averaging) on every luminosity-driven output.
    Rate and pile-up estimates for the detector must be done at the in-train peak (H = 1, fresh bunch) and the physics-reach
    estimates at the average; mixing the two silently is the main risk this conflict guards against.
  required_future_evidence: AloHEP run cards or JSON inputs for the μLHC Table 3 (github.com/yefetu/alohep 'save' directory,
    not yet inspected), including the proton bunch length used; the IPAC'21 WEPAB278 description of the hourglass and decay
    treatment (SRC_JACOW_IPAC2021_WEPAB278, blocked); the White Paper's luminosity formula and its definition of 'average'.
  status: open
  date_added: '2026-10-28'
