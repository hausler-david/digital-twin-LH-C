  competing_values:
  - value: 80
    unit: bunches
    source_id: SRC_ARXIV_2610_35154
    scenario: LHMUC-DIS2026-1TEV
    context: 'p.4: ''The μ+ train stored in the main ring in this case contains 80 bunches separated by 250 ns, and the repetition
      rate is 12.5 Hz.'' AUDIT OBSERVATION: 80 x 250 ns = 20 us exceeds the ~10 us revolution period of a 3 km ring, while
      the Table 1 collision rate of 4 MHz corresponds to 40 bunches per 10 us turn; the source does not reconcile this. Parameter
      MACHINE_MU_BUNCHES_DIS2026.'
  - value: 40
    unit: bunches
    source_id: SRC_ARXIV_2506_15445
    scenario: null
    context: μLHC Table 1 (p.12) 'Number of bunches per ring | 40'; p.10 'The μTRISTAN production scheme inherently generates
      a train of 40 bunches [51]'; p.11 bunch spacing 250 ns in the 3 km ring. Inherited from μTRISTAN. Parameters MACHINE_MU_BUNCHES_PER_RING_MULHC,
      SOURCE_MU_BUNCH_TRAIN_LENGTH_MULHC.
  - value: 40
    unit: bunches
    source_id: SRC_WS1681458_DAGLI_NUCLEUS
    scenario: null
    context: p.8 Table 1 of the draft 'Bunches per ring 40'; p.5 '40 bunches of 4.5 × 10^10 µ+ (7.2 nC)'; p.15 '40 bunches'.
      Parameters MACHINE_MU_BUNCHES_NUCL, SOURCE_LINAC_BUNCHES_NUCL.
  possible_cause: The DIS2026 example doubles the bunch train relative to the μTRISTAN/μLHC chain (80 vs 40) as part of a
    different source scenario (μ+ yield at 5% of μTRISTAN, 4 MW driver, 12.5 Hz). Either two 40-bunch trains are merged per
    80 ms cycle, or the 80 bunches are stored in the 6 km (2 TeV) ring, or 'main ring of about 3 km' and '250 ns' are approximate.
    The source gives no statement that resolves the 20 us train vs 10 us revolution mismatch.
  selected_treatment: 'Separate scenarios: 80 bunches in LHMUC-DIS2026-1TEV (with MACHINE_MU_TRAIN_DURATION_DIS2026 = 20 us
    recorded as derived and the inconsistency flagged in its notes), 40 bunches in the MULHC-PTEP2026-* and LHMUC-NUCL-* scenarios.
    The number of bunches is never averaged; fill-pattern models for the DIS2026 scenario must declare which of the three
    readings above they implement and label it as an assumption.'
  effect_on_simulations: Fill pattern, collision rate time structure, detector duty cycle and the peak-to-average luminosity
    ratio all depend on it; the DIS2026 scenario cannot be simulated at the bunch-train level until the reading is fixed,
    so any such run must carry the assumption record.
  required_future_evidence: White Paper main-ring fill pattern (bunches, spacing, circumference, injection scheme) or a statement
    from the HELP4CERN group; the F. Zimmermann workshop contribution on SPS/LHC modifications (ref. [24] of arXiv:2610.35154).
  status: resolved_as_scenarios
  date_added: '2026-10-28'
