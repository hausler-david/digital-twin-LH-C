  possible_cause: 'The two primary documents use different luminosity models and neither states its formula: the DIS2026 example
    table is reproduced exactly by the geometric formula with H = 1 and no decay averaging, whereas the μLHC values are reproduced
    by the same formula times the authors'' 0.63 decay-average factor. If AloHEP also applied a hourglass reduction for a
    ~7.5 cm proton bunch against beta* = 7 cm (H ~0.7-0.8 by the registry author''s estimate), the printed 8.8e33 / 7.2e33
    would have to contain a compensating effect (e.g. a different decay treatment, the ''beam size matched'' step, or a pinch
    enhancement) that is not documented. The lead''s ''residual factor ~5'' is traced to a factor-10 arithmetic slip (1.14e34
    for 1.14e34), not to the sources. Update 2026-10-29: (a) the MuIC paper is the only uploaded μp source that states its
    luminosity formula (H_hg = 1 ''for simplicity'', max(σ) convention); (b) the AloHEP paper (Dağlı & Karaca 2026) now documents
    the code: hourglass and pinch are simulated and verified to ~1 %, muon decay is applied analytically with an unwritten
    functional form, and the internal L_nom uses the equal-beam max(σ) approximation; its 0.254 μ+μ− benchmark is a two-beam
    decay average, whereas μp needs a one-beam average, so a decay factor validated on μ+μ− cannot be assumed correct for
    μp; (c) the μLHC input decks are not in the public repository, so the question why 8.8e33/7.2e33 show no hourglass reduction
    stays unanswered; (d) Zimmermann''s merging rule means that the higher proton populations assumed by DIS2026 (22e11) and
    implied by the Forthomme slide (≈ 7.0e11) come with longer bunches and/or larger energy spread, which H = 1 ignores; (e)
    the LHeC reference luminosity (André 2022 Table 4) is itself not reproducible from its paper.'
  selected_treatment: 'Decided 2026-10-29 (status changed from ''open'' to ''propagated_as_uncertainty''; the question why
    the μLHC values show no hourglass reduction is not settled and is carried as an uncertainty): Every luminosity in the
    registry carries, in its notes, the model with which it was reproduced (DIS2026: H = 1, no decay; μLHC: naive x 0.63).
    The project''s own luminosity tool (lhmuc/analytical.py) must expose H, the decay-average factor and the beam-beam treatment
    as explicit, separately reported factors, default H = 1 flagged as an assumption, and must never silently apply a hourglass
    factor to a source value. The hourglass factor for the μLHC optics is treated as a scan variable (proton bunch length
    7.5-9 cm, an external HL-LHC-type assumption requiring an assumption record) until the AloHEP inputs are known. Added
    2026-10-29: (i) no source luminosity is re-derived with another model or averaged; each keeps the model with which it
    was reproduced (DIS2026: H = 1, no decay; μLHC: naive × 0.63; MuIC: H = 1 stated, max(σ) convention; Forthomme: 1e34 with
    N_p implied only under H = 1; André 2022: not reproducible, band 0.65–0.85 with HL-LHC protons); (ii) the luminosity tool
    also reports the L_nom → L_geo factor for unequal beams; (iii) the muon-decay factor for μp is the one-beam store average
    computed by the project, never a μ+μ− (two-beam) factor or an unverified AloHEP default: an AloHEP run for LHμC either
    has its decay implementation checked for one decaying beam first, or runs with decay disabled and the one-beam factor
    applied separately and reported; (iv) when a scenario assumes a proton population above HL-LHC, the hourglass scan must
    also cover the longer proton bunches implied by Zimmermann''s rule, through the band of PROTON_BUNCH_LENGTH_RMS_SYN (ASM_PROTON_BUNCH_LENGTH_RMS:
    uniform 5–12 cm as written on 2026-10-28, widened on 2026-10-29 to log-uniform 5–100 cm for proton populations of 3–10
    times HL-LHC; the 7.5–9 cm of the text above is superseded — the record governs), which must state that it does so; lhmuc.analytical.hourglass_factor
    under-reports H above σ_z,p ≈ 0.13 m with a 2 mm muon bunch (ASM_PROTON_BUNCH_LENGTH_RMS notes) and may be used for such
    a scan only once fixed or bounded by a registered test (band text updated by the registry-stage verifier, 2026-10-29).
    Fixed 2026-10-29: hourglass_factor now integrates the collision time analytically and evaluates a 1-D integral; it matches
    the closed form for equal optics at all bunch lengths up to 1 m (tests/scientific/test_analytical_checks.py::test_hourglass_factor_matches_closed_form_for_equal_optics)
    and gives H = 0.269 / 0.122 / 0.064 at 0.2 / 0.5 / 1 m for the muLHC-like optics (::test_hourglass_factor_long_proton_bunches_mulhc_like_optics).'
  effect_on_simulations: 'A factor 0.6-1.0 (hourglass) times 0.25-1.0 (decay/duty averaging) on every luminosity-driven output.
    Rate and pile-up estimates for the detector must be done at the in-train peak (H = 1, fresh bunch) and the physics-reach
    estimates at the average; mixing the two silently is the main risk this conflict guards against. Update 2026-10-29: the
    one- vs two-beam decay convention alone changes a store-averaged luminosity by 0.632/0.432 = 1.46 at T = γτ; the max(σ)
    convention understates an unequal-beam luminosity (factor 1.70 for the MuIC LHmuC spot sizes, audit computation).'
  required_future_evidence: 'AloHEP run cards or JSON inputs for the μLHC Table 3 (github.com/yefetu/alohep ''save'' directory,
    not yet inspected), including the proton bunch length used; the IPAC''21 WEPAB278 description of the hourglass and decay
    treatment (SRC_JACOW_IPAC2021_WEPAB278, blocked); the White Paper''s luminosity formula and its definition of ''average''.
    Update 2026-10-29: the AloHEP method is now documented (SRC_ARXIV_2610_09839) and the public v2.0 repository was inspected
    (SRC_URL_GITHUB_TOBBETUYEF_ALOHEP): it holds no μLHC/LHμC deck, so the decks behind 8.8e33/7.2e33 must come from the authors
    or the PTEP erratum (ME_043); the functional form of AloHEP''s analytic decay factor for one decaying beam (code reading
    in an isolated environment, or an author statement); the LHμC proton bunch length and population (HELP4CERN; Zimmermann''s
    options give no LHμC number); the proton parameters behind André 2022 Table 4 (LHeC CDR / 2020 update, ME_046).'
