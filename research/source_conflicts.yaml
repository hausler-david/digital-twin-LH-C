    km). Update 2026-10-29: the Topp-Mugglestone deck (ref. [22] of DIS2026) gives the DIS2026 vFFAG stage as a single arc
    pair 70 → 500 GeV (perhaps 1 TeV) with order-10 turns, from a preliminary analytic study; MuCol M17 documents the analogous
