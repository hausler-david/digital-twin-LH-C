    ~700 µs) without stating the injection energy. None gives an LHμC booster lattice, and the ''about 9 km'' remains unexplained.'
  selected_treatment: 'Separate scenarios: LHMUC-DIS2026-* (vFFAG scheme, 9 km, 1 GeV injection, survival unknown -> null),
