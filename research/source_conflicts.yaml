  possible_cause: 'Four different quantities are being compared under one word. (1) The DIS2026 2.1e34 is a peak value for
    the in-train 4 MHz collision rate and is reproduced by the naive formula L = f N_mu N_p / (4 pi sigma^2) with no hourglass
    or decay factor (see CONF_LUMI_MODEL_ASSUMPTIONS); it also uses ten times the proton bunch population (22e11 vs 2.2e11)
    and twice the muon bunches per train (80 vs 40) of the μLHC set, while the μ+ bunch population is 4-5 times smaller (0.07e11
    vs 3.0-3.7e10). (2) The μLHC 8.8e33 / 7.2e33 are AloHEP outputs that include muon decay over the 2000-turn store (the
    paper''s own 0.63 average-population factor reproduces them from the naive formula to 1%). (3) The ''>1e33'' statements
    are lower bounds, and the ICHEP/ADM listings belong to an earlier 500 GeV / 3.74 TeV design iteration (CONF_LHMUC_DESIGN_VERSIONS).
    (4) The pre-erratum μLHC values were lower by the acknowledged factors 2 and 4 because the booster survival had been underestimated
    (CONF_MUON_SURVIVAL_RATES_ERRATUM). The DIS2026 ''average close to 1e34'' cannot be reproduced from the Table 1 numbers
    with the registry author''s simple duty-cycle estimate (AUDIT COMPUTATION: a 20.8 ms lab lifetime and an 80 ms refill
    period give a decay-averaged factor tau/T (1 - exp(-T/tau)) = 0.25, i.e. 5.4e33 from 2.1e34); the source does not state
    its averaging prescription, so this remains unexplained. Update 2026-10-29: (5) the Kraków Forthomme slide gives a third
    LHμC set (40 × 1e10 μ+, 300 ns, 4.3 µm → 1e34 ''peak'') whose proton population is not stated (implied ≈ 7.0e11 under
    H = 1, i.e. between the μLHC 2.2e11 and the DIS2026 22e11); (6) the MuIC ''LHmuC'' 2.8e33 belongs to a different machine
    (name collision) and is computed with H = 1 and the max(σ) convention; (7) Cheung & Wang''s 1e33 is an assumed round number
    for a μ−p physics study.'
  selected_treatment: 'Separate scenarios, never a merged number: LHMUC-DIS2026-1TEV carries 2.1e34 (peak) and 1e34 (average,
    confidence medium) as two distinct parameters; MULHC-PTEP2026-MUTRISTAN-BOOSTER carries 8.8e33 and MULHC-PTEP2026-ERL-BOOSTER
    carries 7.2e33 (post-erratum). The implied pre-erratum values are recorded only here, not as parameters. The ''>1e33''
    listings are recorded as bounds (MACHINE_LUMINOSITY_LOWER_BOUND_CLAIM_MULHC) and as snippet leads; none of them may be
    used as a design value. No scenario may quote a luminosity without stating peak vs average and the decay/hourglass treatment
    used. Update 2026-10-29: LHMUC-WS2026-FORTHOMME carries 1e34 as its own scenario value (peak definition unknown; confidence
    capped at medium as unrefereed slides); MUIC-ACOSTA2022-LHMUC 2.8e33 and CHEUNG2021-MUP1-MUMINUS-P 1e33 are comparators
    only (different concept; assumed value for μ−p physics) and are never assigned to an LHμC scenario. Rescaling Cheung &
    Wang''s physics reach to an LHμC scenario must state both luminosities and the μ− → μ+ change (charged-current rates differ).'
  effect_on_simulations: 'Any event-yield or physics-reach calculation differs by a factor 2-3 (2.1e34 vs 7.2e33 peak) and
    by a further factor up to 4 depending on peak-vs-average interpretation; integrated luminosities per year (88 / 72 fb^-1
    in the μLHC Table 4 vs the ''close to 1e34 average'' of DIS2026, which would correspond to ~100 fb^-1 per 1e7 s) must
    be propagated per scenario. Luminosity-driven requirements (pile-up, detector rates, beam-beam tune shift) must be evaluated
    per scenario and labelled with the scenario id. Update 2026-10-29: the Forthomme set adds a third LHμC luminosity (1e34)
    whose proton side is undefined; physics reach quoted from Cheung & Wang inherits an assumed 1e33 (0.1 ab^-1) for μ−p.'
  required_future_evidence: '(a) The HELP4CERN White Paper parameter table with its luminosity formula and averaging prescription;
    (b) the PTEP erratum text (DOI not found; academic.oup.com blocked) to confirm that arXiv v2 Tables 1, 3, 4, 6 are the
    corrected ones; (c) an AloHEP re-run with the Table 1-3 inputs to confirm which effects (decay, hourglass, beam-beam)
    are included in 8.8e33 / 7.2e33; (d) the ICHEP 2026 / ADM slides to date the 500 GeV / >1e33 set. Update 2026-10-29: (e)
    the definition of ''peak'' on Forthomme''s slide 17 and the proton bunch population and number behind its 1e34 (the slide
    says only ''may consider higher proton bunches population than HL-LHC''s'').'
