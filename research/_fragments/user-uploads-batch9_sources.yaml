- source_id: SRC_IMCC2026_GIOVE_RF_SYSTEM
  title: RF System (INFN thin-window RF cavities for the muon ionisation-cooling channel)
  authors_or_org: Dario Giove (INFN)
  source_type: workshop_talk
  category: ANALOGOUS_TECHNOLOGY
  publication_date: 22–25 Jun 2026
  version: slides, IMCC and MuCol Annual Meeting 2026, CERN
  url: null
  doi: null
  arxiv_id: null
  access_date: '2026-10-28'
  access: uploaded
  relevance: 'Engineering status of the high-gradient normal-conducting RF cavities for the IMCC ionisation-cooling channel,
    relevant to LHμC only through the hybrid-source option (SRC_WS1681458_ROGERS_HYBRID_SOURCE, which reuses IMCC rectilinear
    cooling stages with RF in solenoid fields); not used by the baseline laser-ionisation chain. Content: SRF excluded by
    the solenoid fields; 704 MHz at 30 MV/m ''depending on at which cooling stages''; beam diameter up to 12 cm; cavities
    up to 16 cm diameter with 50–200 µm Be or Al windows; INFN 704 MHz cell geometry (L_acc 187.8 mm, R_v 164.7 mm, W_R 60
    mm, a 8 mm, b 24 mm, C_R 10 mm); 3-cell structure coupling slots (R_Ain 85 mm, R_Aext 113.5 mm, θ_A 15 mm, fillet 4 mm);
    window parametric study t_foil 50/100/150/200 µm, R_w 60/80 mm, E0 22.5/40 MV/m with flat, step and curved-step foils;
    Be vs Al properties (1850 vs 2710 kg/m³, 202.6 vs 237.5 W/m/K, 302.2 vs 70.9 GPa, 525.4 vs 114.8 MPa); LBNL 2001 heritage
    (127 µm IF-1 Be foils, 160 mm diameter); supply chain — only Materion, ULBA and IBC supply beryllium, Materion minimum
    order 12000 $, beryllium machining safety limits at INFN, so aluminium alloys 6061-T6 / 6082-T6 proposed for the demonstrator,
    no commercial 150–250 µm sheets found; mechanical design with COMEB from September 2025; design criterion lowest mechanical
    resonance ≫ 5 Hz power-pulse frequency, with resonance ''still possible'' and transient analysis or tests needed; 3-cell
    final mechanical design (OFHC copper, CF160 flanges, six cooling circuits, replaceable foils). No RF power test, achieved
    gradient or breakdown-in-field measurement is shown.'
  parameters_extracted: []
  unresolved_questions:
  - No measured gradient, breakdown rate or breakdown-in-magnetic-field result is shown; the breakdown data restated by Rogers
    (Cu 24.4 → 12.9 MV/m at 0 → 3 T; Be 41.1 → >49.8 MV/m) favour beryllium, while this talk proposes aluminium windows for
    the demonstrator because of beryllium supply and safety constraints — no uploaded source gives aluminium breakdown performance
