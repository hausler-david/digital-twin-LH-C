    to the published erratum. Snippet: ''the authors thank Krzysztof Piotrzkowski for pointing out the inconsistency in antimuon
    survival rates, and that as a result the luminosity value increased by approximately 2 times for the μTRISTAN-based option
    and 4 times for the LHeC-based option''; arXiv v2 comment: ''some calculation errors in Figures 3 and 7 ... muon survival
    rates had been underestimated as a result of simulation errors ... Figures 3 and 7, Tables 1, 3, 4 and 6 are replaced
    by correct ones''. NOTE: this id already exists in research/source_registry.yaml as an uploaded, fully read PDF (v2) and
    is RELATED_MACHINE by the lead''s decision; this fragment entry only records the web-reconnaissance view (snippets, blocked
    fetch) and the queries that surfaced it. The 7.2 nC / 4.5e10 per-injected-bunch figure is flagged in the journal as ''quoted
    via ResearchGate copy''.'
