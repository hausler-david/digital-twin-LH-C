  - Stopping efficiency 44.3 % (p. 3, 435 µm degrader) vs 0.467 in Table I (p. 6).
  - 'Extraction: 1.5e3 of 2.0e3 generated thermal muons reach the MCP (0.75), while the transmission is stated as (58.6 ±
    0.9) % ''including 13% of decay-loss, 85% of the mesh transmission efficiency and the 90% of MCP aperture ratio'' (p.
    6); the three named factors multiply to 0.666; Table I splits 0.586 as 0.651 × 0.90. How 0.75, 0.586 and 0.666 relate
    is not explained.'
  - 'The 52 % formation fraction, T = 322 K, D = 870 cm² s^-1 and the best sample (23.2 mg cm^-3, 8.8 mm) are all cited to
