  relevance: 'First complete description of AloHEP, the luminosity code behind the μLHC PTEP 2026 luminosity figures (the paper
    cites the μLHC paper as its ref. [7] and the Kaya–Ketenoglu–Sultansoy–Zimmermann muon–hadron luminosity paper as ref. [6]):
    slice-based particle-in-cell (cloud-in-cell deposition, direct Green''s-function potential solve, finite-difference forces,
    bicubic interpolation, Euler integration); hourglass effect, crossing angle, beam–beam pinch/disruption, beamstrahlung
    (preliminary) and particle decay toggled independently; outputs L_eff, L_nom, disruption D_x,y (single-pass) or tune shifts
    ξ_x,y (stored beams); JSON parameter database; GUI Launcher and HeadlessLauncher. Verification: analytic geometric luminosity
    recovered to 0.1 % on a 100^3 grid (~10 % deficit at 10^3, ~1 % at 30^3); flat-beam hourglass factor Eq. (22) reproduced to
    ~1 % for A = σ_z/β*_y ≲ 1.5; Piwinski crossing-angle factor to ~1 %; HERA / EIC unequal-beam hourglass L_eff/L_geo 0.977 /
    0.912 (hourglass only; analytic 0.980 / 0.916) and 0.991 / 0.974 with pinch (Tables 5–6); 10 TeV μ+μ− (IMCC parameters)
    decay factor 0.252 vs analytic 0.254 — the muon-decay factor is applied ANALYTICALLY, not simulated. Footnote p. 33: the
    internal L_nom uses N1 N2 f_c / [4π max(σ_x1,σ_x2) max(σ_y1,σ_y2)], which underestimates the geometric luminosity for unequal
    beams. Runtime ~12 s per crossing at 30^3 with 5e4 macroparticles on one core. Candidate M2 tool for reproducing the μLHC
    7.2e33 / 8.8e33 cm^-2 s^-1 values and settling CONF_LUMI_MODEL_ASSUMPTIONS.'
  parameters_extracted: []
  unresolved_questions:
  - The paper does not contain the μLHC input deck; which effects (hourglass, pinch, decay) were enabled for the PTEP 2026 figures
