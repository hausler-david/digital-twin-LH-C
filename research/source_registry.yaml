  relevance: 'Options to provide ~1 % of today''s LHC bunch number with much higher population: barrier buckets (AGS, SPS),
    superbunch collider parameters (LHC Project Report 627 Table 1: single superbunch 75 m rms, σ_δ 5.8e-4, 1.0 A, 9e34),
    Damerau–Garoby long bunches (16 → 1 merge, 1.5 MV 40–80 MHz, 4–5 m flat bunches), CERN-2005-006 Table 3; conclusion σ_δ
    σ_z ≈ 2 n_b,0 σ_δ,0 σ_z,0 — higher population comes with longer bunches and/or larger energy spread. Bears on the DIS2026
    22e11 p/bunch assumption and the luminosity/hourglass model.'
