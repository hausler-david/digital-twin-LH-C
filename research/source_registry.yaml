  access: uploaded
  relevance: 'J-PARC Hadron Experimental Facility B-line ''µ20'' mode: tertiary muons from backward π decay in a ~7 m drift
    (v23-h24), downstream optics scaled to 60-85 % of the upstream momentum; p_μ ≈ (m_μ²/m_π²) p_π ≈ 0.57 p_π (p. 6). T106
    measurements at 3/5/10 GeV/c upstream: Table 1 hadrons 0.2/0.6/1.4 M/spill (π:p 0.66:0.34, 0.60:0.40, 0.39:0.61); Table
    2 muons 0.42-17.0 k/spill; Table 3 purities 53.2-98.3 %; headline 1.7e3 µ/spill at 3 GeV/c (5 GeV/c × 60 %) with purity
    98.0 ± 0.6 % (97.9 ± 0.9 % with the empirical 3 GeV/c hadron template) and σ ≈ 15 mm (pp. 1, 11, 16-19). 30 GeV slow extraction,
    2 s spill per 4.24 s cycle; secondaries from the beam loss (several hundred W) at a Lambertson septum; a planned 15 kW-loss
    target should raise the µ20 rate by more than two orders of magnitude (>1e5/spill, p. 17). Context only for LHμC: a conventional
    GeV/c tertiary muon beam for radiography; it backs no LHμC parameter.'
  parameters_extracted: []
  unresolved_questions:
