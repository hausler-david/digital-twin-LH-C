  relevance: 'Official MuCol/IMCC analytic vFFA design behind the Kraków vFFA deck and MR7 Table F.5: scaling law B(z) = B0
    e^{mz}, FODO closed-orbit geometry (Table 2.1, eqs 2.1–2.8) and Hamiltonian (eq. 2.9); Table 2.2 Stage 1 vFFA r0 = 953
    m, θF = 0.01033 rad, Nc = 790, βF = 0.001564 rad, βD = 0.001180 rad, γF = 0.252 rad, m = 31.94 /m and Stage 4 vFFA r0
    = 5570 m, θF = 0.00786 rad, Nc = 1000, βF = 0.001790, βD = 0.001166, γF = −0.492 rad, m = 12.13 /m; Table 2.3 vs RCS1/RCS4:
    5990 / 35000 m, 0.06→0.3 / 1.5→5 TeV, ramp rate 0 vs 4200 / 565 T/s, excursion 0.048 / 0.12 m, on-orbit peak 6.93 / 13.59
    T (good-field 12.52 / 29.04 T, 25 µm emittance), drift 1.18 / 1.03 m, tunes (0.382, 0.079) / (0.460, 0.057); design limits
    8.3 T (LHC dipole) and 1 m minimum drift; kicker example 0.2 T × 1 m at 300 GeV → 0.1 mm; decoupled straights need γ =
    90° and zero net bend; dispersion D_z = 1/m; dispersion suppressor D2 = (D1 + D3)/2 with 180° phase advance; optics notebooks
    in gitlab.cern.ch/acc-models/acc-models-mc (high_energy_complex/vFFAx/vFFAx.ipynb). Analytic lattices only: the report
    states they must still be verified by numerical simulation and that high m-values make the field grow rapidly off orbit.'
