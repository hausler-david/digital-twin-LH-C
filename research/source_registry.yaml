    ≈ 5–6 % at 1 TeV; 6 m tungsten nozzle gives ≈ 10 % peak energy loss and 0.72 mrad multiple scattering at 1 TeV, dominating
    the Q² resolution (σ ≈ 33 % at Q² = 20 GeV², η = 6); CSC strawman geometry; Bhabha luminosity rates (μ+μ− case, analogue
    only).
