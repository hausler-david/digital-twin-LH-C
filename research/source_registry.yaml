  title: Simulation Study of Laser Ionization of Muonium by 1S-2S Excitation for the Muon g - 2/EDM Experiment at J-PARC
  authors_or_org: Ce Zhang, H. Hara, T. Hiraki, Y. Ikedo, Y. Imai, K. Ishida, S. Kamal, N. Kawamura, A. Koda, Y. Mao, T. Masuda,
    T. Mibe, Y. Miyake, Y. Miyamoto, Y. Oishi, M. Otani, P. Strasser, K. Shimomura, K. Suzuki, S. Uetake, T. Yamazaki, S.
    Yamamoto, K. Yoshimura, M. Yoshida (Peking, Okayama, KEK, RIKEN, UBC)
  source_type: conference_proceeding
  category: CONFERENCE_PROCEEDING
  publication_date: '2021'
  version: JPS Conf. Proc. 33, 011125 (2021); Proc. 3rd J-PARC Symposium (J-PARC2019); received 10 Jan 2020
  url: https://doi.org/10.7566/JPSCP.33.011125
  doi: 10.7566/JPSCP.33.011125
  arxiv_id: null
  access_date: '2026-10-29'
  access: uploaded
  relevance: 'Simulated yield chain of the J-PARC MLF S-line (S2) demonstration of muonium laser ionisation by 1S-2S two-photon
    excitation (244 nm) plus 355 nm ionisation — the 244 nm alternative to the 122 nm Lyman-α scheme. Table I (p. 6): S-line
    transport to S2 0.00717 → 2.4e6 s^-1; surface-muon stopping 0.467 → 1.1e6; Mu formation 0.52 → 5.8e5; Mu vacuum yield
    0.082 → 4.8e4; laser ionisation 3.9e-7 → 0.0186; slow-beamline transmission 0.651 → 0.0121; MCP 0.90 → 0.0109 s^-1 (''about
    0.011/s''). Inputs: G4Beamline S-line model validated on relative S1 rates (S1 measured 1.9e5 at 500 kW; the S2 estimate
    rests on ''the comparison with the measurement at S1''); 100 µm Kapton window, 435 µm Al degrader, 78 × 78 × 6 mm aerogel,
    mean stopping time ~350 ns (p. 3); 3-D random-walk diffusion with T = 322 K, D = 870 cm² s^-1 (p. 3-4); laser region 2
    × 40 × 2 mm³ centred 3 mm from the surface, optimum delay 0.8 µs (p. 4); 1S→2S probability 8.8e-7 × 2S→ionisation ~44
    % = 3.9e-7 per vacuum Mu including spatial and temporal overlap, ''preliminary'', optical Bloch equations (p. 4); SOA
    lens 20 kV, ED 5 kV, muSRsim extraction (p. 5-6). Earliest archived 244 nm ionisation estimate: 3.9e-7 vs ~1e-6 (Zhang
    2026 Kraków deck, 1.5 mJ) and 7e-6-6e-5 (Aritome et al. 2024, 0.5-1.3 mJ) — CONF_LASER_IONISATION_EFFICIENCY.'
