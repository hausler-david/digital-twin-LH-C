  relevance: 'Earlier LHC-based μp collider proposal of the AloHEP group (precursor of μLHC, SRC_ARXIV_2506_15445): a muon
    collider tangential to the HL-LHC or HE-LHC (Fig. 1). Inputs: Table 1 HL-LHC/HE-LHC (√s 14/27 TeV, N_p 2.2e11, 2760/2808
    bunches, σ_z 90 mm, ε_N 2.5 µm, β* 0.15/0.45 m, σ 7.1/9 µm, 5e34/16e34); Table 2 ERL60-upgraded protons (N_p 2.2/2.5e11,
    ε_N 2/2.5 µm, β* 7/10 cm, σ 4.45/4.17 µm); Table 3 muon collider [Delahaye et al., arXiv:1901.06150] (√s 1.5/3/6 TeV,
    2.5/4.5/6 km, N_μ 2e12, σ_z 1/0.5/0.2 cm, ε_N 25 µm, β* 1/0.5/0.25 cm, σ 5.9/2.95/1.48 µm, 15/12/6 Hz, 2 IPs, L_μμ 1.25/4.4/12e34).
    Eq. (6) L_μp = (N_p/N_μ)(σ_μ/max[σ_p,σ_μ])² L_μμ gives Table 4 (HL-LHC: √s 4.58/6.48/9.16 TeV for E_μ 0.75/1.5/3 TeV;
    L 0.95/0.84/0.57e33 nominal, 1.4/2.1/1.5e33 upgraded) and Table 5 (HE-LHC: √s 6.36/9/12.7 TeV; 0.59/0.52/0.36e33 and 1.6/2.8/1.9e33).
    Table 6 matched-beam tune shifts (eqs. 9-10): ξ_p 0.098/0.12/0.098/0.098, ξ_μ 0.0096/0.0096/0.0096/0.011, with the statement
    (p. 5) that ''ξp values should be reduced by an order … resulting in corresponding decrease of luminosity''. Table 7 x_min
    at Q² = 1 and 25 GeV². All 12 luminosities and 8 tune shifts reproduce from the printed equations (tests/scientific/test_batch10_documents.py).'
