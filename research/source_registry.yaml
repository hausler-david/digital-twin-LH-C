  relevance: 'Design chain that μTRISTAN and the LHμC ultra-cold source extrapolate from: 3 GeV, 1 MW RCS, 2 cm graphite target,
    double pulse (100 ns FWHM, 600 ns apart, 25 Hz); H-line ~1e8 surface μ+/s at 1 MW, 27 MeV/c, Δp/p 5 % RMS, focus σ 31
    × 14 mm; silica-aerogel muonium target with Mu formation probability 0.52 and thermal-muonium efficiency 3.4e-3 per surface
    muon (= 0.52 × 2.1e4/3.23e6, laser region 50 × 200 × 5 mm^3 at 1 mm from the aerogel, optimum ~1.0 µs); ionisation by
    122 nm (80 GHz, 100 µJ) + 355 nm (440 mJ) 1 ns lasers, 73 % ionisation efficiency CALCULATED from transition rates; thermal
    muons 25 meV / 2.3 keV/c; linac Soa 5.6 keV → RFQ 0.34 MeV (324 MHz, 3.2 m) → IH-DTL 4.5 MeV (1.4 m, 16 cells, Q0 1.03e4,
    320 kW, 58 MΩ/m) → DAW 40 MeV (1296 MHz, 5.6 MV/m, 16.3 m, 4.5 MW) → DLS 212 MeV (~20 MV/m, 10 m); 300 MeV/c with Δp/p
    0.04 % RMS, Table 2 transmissions 87/95/100/100/100 % and decay losses 17/19/1/4/1 %, ε_n 0.33 / 0.21 π mm mrad at exit;
    10 ns pulse of three microbunches at 25 Hz; 50 % polarisation; 3.0 T storage field; Table 4 overall efficiency 1.3e-5
    detected e+ per initial surface muon (H-line 0.16, Mu emission 0.0034, laser 0.73, mesh 0.78, initial acceleration 0.72,
    …); 5.2e12 stored muons and 5.7e11 reconstructed e+ in 2.2e7 s.'
