  relevance: 'ORIGIN OF THE 0.52 MUONIUM-FORMATION FRACTION used by the J-PARC g-2/EDM design (SRC_ARXIV_1901_03047), μTRISTAN,
    the Kraków Zhang deck and Aritome et al. 2024 (their ref. [21]): MuSR on hydrophobic Chiba silica aerogels gives a muonium
    formation fraction of 0.52 ± 0.01 ''in the three aerogel samples'' (p. 3), vs silica powder 0.64 ± 0.03 [Kiefl 1979] and
    porous silica 0.21 ± 0.01; MuSR relaxation ~0.05 µs^-1 in 0.6 mT. TRIUMF M15 vacuum-emission imaging with four aerogels
    (29, 47, 97, 178 mg cm^-3; 6.9, 4.8, 2.2, 2.0 mm; 30 × 40 mm^2 targets; 22.9-24.5 MeV/c subsurface muons; ~half stopping):
    Table 1 vacuum yield in 10 < z < 40 mm per 1000 muon stops 2.74 ± 0.11 +0.10/-0.13, 2.81, 3.13, 1.60 and mean free paths
    0.226, 0.118, 0.035, 0.0050 µm (small-chemical-potential model, 25 meV); density scaling α ≈ -1.5; Table 2 BET surface
    areas 550-914 m^2/g and grain radii 2.5-1.5 nm; total vacuum yield 4.8e-3 per incident muon at 23 MeV/c, 2 % RMS, scaled
    by eq. (1) to 9.6e-4 for J-PARC 28 MeV/c, 5 % RMS; emission probability falls to e^-1 at 30 µm from the surface; ~100
    µm surface structure proposed to raise the yield (the later laser-ablation work).'
