  relevance: 'Phenomenology benchmark for a μ−p collider (NOTE: negative muons; LHμC collides μ+): ''μp-1'' E_p 7 TeV × E_μ
    1 TeV, √s 5.3 TeV, L 1e33 cm^-2 s^-1 assumed, 0.1 ab^-1 (1e7 s/yr × 10 yr) — the same beam energies as LHμC-DIS2026 1
    TeV; ''μp-2'' 50 × 3 TeV, √s 24.5 TeV, 1e34, 1 ab^-1. Table II VBF Higgs cross sections (pb): WW 0.978 / 5.103 (LHeC 0.110,
    FCC-he 0.577, LHC-14 4.233 total), ZZ 0.216 / 1.263; Table III h→bb cut flow (ε_pr 0.98/0.91, σ(pμ−→jν Z) 4.67/25.1 pb,
    ε_Zbb 0.99/0.97, ε_sig 0.21/0.17, ε_bgd 0.022/0.018, Δσ/σ 0.97 %/0.15 %, Δg_hbb/g_hbb 0.69 %/0.50 % using FCC-ee 0.4 %
    and 0.9 % inputs); RPV-SUSY λ''_21k limits down to 0.02 (0.01) for m_dR ~ O(TeV); muon g-2 tensor operator C_T^μc: Table
    IV σ_bgd 120 / 30 pb, signal 1.29e-2 / 3.15e-1 pb (normalised to (Λ²/100 TeV² C_T)^-2), |Δa_μ| limits 1.13e-8 / 9.10e-10.
    Tool chain MadGraph5 3.0.2, patched Pythia 6.428, FastJet 3.3.2, Delphes 3.4.2 with an LHeC card including the beam asymmetry,
    b-tag 75 %, p_T > 5 GeV, |η| < 5.5.'
