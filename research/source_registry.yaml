  access_date: '2026-10-28'
  access: uploaded
  relevance: Muonium diffusion model fitted to TRIUMF data (T = 322 K, D = 870 cm²/s), single-layer vacuum emission ≈ 8 %,
    J-PARC H-line efficiency chain (1.8e6 μ+/s → stopping 0.467 → Mu formation 0.52 → vacuum yield 0.082 → laser ionisation
    ~1e-6 with a 244 nm spectroscopy laser; g-2 targets up to 8.24e5/s with 122 nm, 100 µJ), 2022 ionisation test (0.126 Hz
    vs RAL-1999 0.0027 Hz), multi-layer target design (vacuum yield 8 → 18 %, optimum layer interval ≈ 7 mm), μTRISTAN efficiency
    budget 14 % = 0.52 × 0.60 × 0.60 × 0.73 and the new hot-tungsten μTRISTAN variant.
