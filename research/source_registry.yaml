  doi: null
  arxiv_id: '2605.25580'
  access_date: '2026-10-28'
  access: uploaded
  relevance: 'First quantitative (PHITS, JAM hadronic model with a HARP-fitted angle-dependent scale factor f(θ) = 1.54 −
    0.33 θ/rad, ~10 % systematic) evaluation of the μTRISTAN hybrid target: liquid-lithium pion-production target inside multilayer
    tungsten wire layers (hot W at 2000 K, D = 2e-3 cm^2/s, diffusion length ℓ_diff ≈ 0.7 µm, ~95 % of emitted muonium from
    within 3 ℓ_diff), ~10 % of the surface-stopped muons in vacuum at the optimal laser time, η_REMPI = 0.73; ultraslow-muon
    yield before extraction saturates at ≈1e-3 per p–Li nuclear collision (5 mm gap) and is 6e-4 for the representative set
    (L_x 3 m, L_z+ 10 m, L_z− 1 m, gap 10 mm, layer 0.1 mm, L_y ≈ 5 m), assuming unit muon-to-muonium conversion; stopped-muon
    rms extents 10.9 m (z>0), 1.3 m (z<0), 2.7 m (x); N_p = 2e15 s^-1 for a 1 MW, 3 GeV beam. Also restates the present-scheme
    limits: π+ stopping within 0.2 mm of the target surface 1e-5 per proton, aerogel muonium emission efficiency 1.3 % including
    52 % formation, ~30 % laser overlap, second-stage cooling efficiency ~25 % in the idealised limit.'
