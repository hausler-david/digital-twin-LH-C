  relevance: 'Laser-ablated silica-aerogel muonium emitter — the target technology of the J-PARC g-2/EDM ultra-slow-muon source
    and of μTRISTAN. Fabrication (p. 3): femtosecond laser 800 nm, 230 fs, 0.6 mJ/pulse, 1 kHz, 30 µm spot, 800 pulses (0.8
    s) per hole; 29 mg cm^-3, 7 mm aerogel; 270 µm holes 4.5-5.0 mm deep on a 300/400/500 µm triangular pitch over 30 × 30
    mm²; measured mass loss only 5-10 % of that expected from the hole geometry. Measurement (pp. 4-5): TRIUMF M15 subsurface
    muons, ~1e4 s^-1, ~23.0 MeV/c, Δp/p 5 % FWHM, ~50 % stopping, 8 mT vertical field, ~2 mm RMS vertex resolution. Table
    1, Mu yield in vacuum regions 1-3 (10-40 mm) per 1e3 muon stops: flat 3.72 ± 0.11; flat (Bakule 2013, SRC_ARXIV_1306_3810)
    2.74 ± 0.11; ablated pitch 500/400/300 µm 16.0 ± 0.2 / 20.9 ± 0.7 / 30.5 ± 0.3 (statistical; systematic ≈ 4 % ablated,
    ≈ 1 % flat) — 30.5/3.72 = 8.2, ''at least eight times''; the 300 µm yield is 3 % of muons decaying in target + vacuum.
    J-PARC projection (pp. 5-6): 28 MeV/c, 5 % RMS; 0.01 Mu per incident muon (near-surface assumption of Bakule 2013); ultra-slow
    muon rate 0.2e6 s^-1, ''five times smaller than the design intensity'' (1e6 s^-1, p. 2); 0.4 ppm g-2 in 1e7 s at 50 %
    polarisation. Gives NO muonium formation fraction.'
