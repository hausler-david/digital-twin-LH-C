lhmuc_recasting:
  original_initial_state_transfers_directly: false
  candidate_mu_p_channels:
    - process: "mu+ q -> N(bar) q' (charged-current t-channel W exchange; e.g. mu+ d -> N(bar) u, mu+ u(bar) -> N(bar) d(bar))"
      status: proposed_unverified
      notes: "N produced on the mu+ line through the W-mu-N vertex, rate proportional to |U_muN|^2. For a DIRAC N the state produced from a mu+ is the anti-HNL (lepton number conserved), so the lepton-number assignment and the N vs. N-bar decay pattern must be checked against the paper's Lagrangian. Charge: mu+(+1) + d(-1/3) -> N(0) + u(+2/3): balanced. Colour: quark line unchanged. Dominant mixing-driven channel at an ep/mu-p machine by analogy with e p -> N X studies; not yet diagram-verified or computed here."
    - process: "mu+ q -> mu+ q Z* -> mu+ q N nu(bar)_mu (neutral-current Z radiation with Z -> N nu via mixing)"
      status: proposed_unverified
      notes: "A single N cannot be produced from the charged mu+ line by neutral-current exchange alone (the mu+ stays a mu+); it can only appear through a Z*/H* decaying to N + light neutrino, which again requires |U_muN| (Z-N-nu vertex). Electroweak 2->4 topology, expected to be subdominant to the charged-current channel; to be checked: lepton-number and mixing structure of the Z-N-nu coupling in the radiative model, and whether the extra scalars open additional neutral channels."
    - process: "mu+ q -> nu(bar)_mu H q' , H -> N nu (W-boson fusion Higgs production followed by Higgs-mediated HNL production)"
      status: proposed_unverified
      notes: "Analogue of the paper's Higgs-mediated channel. Requires (a) that the mediator is the 125 GeV Higgs rather than an extra scalar of the radiative model, (b) that H -> N nu is kinematically open (needs m_N < m_H; the unconfirmed paraphrased mass range 103-119 GeV would allow it only marginally, with small phase space), (c) the H-N-nu coupling of the radiative model, which is unknown. If the mediator is a heavier new scalar, its mu+ p production mode must be derived separately. Also candidate: Z-fusion mu+ q -> mu+ H q with the same decay."
    - process: "mu+ gamma -> N(bar) W+ with gamma from the proton (equivalent photon approximation / photoproduction)"
      status: proposed_unverified
      notes: "Photon-initiated analogue of the e gamma -> N W channel known from ep collider HNL studies; relevant because the original study itself used the equivalent photon approximation for photon-initiated processes. Rate proportional to |U_muN|^2. Charge: mu+(+1)+gamma(0) -> N(0)+W+(+1): balanced. Elastic vs. inelastic photon flux from the proton must be treated by the generator, not assumed."
  missing_for_implementation:
    - "The paper itself (arXiv:2610.28252 full text; abstract page not even read): fetch pending, arxiv.org blocked."
    - "The Lagrangian / field content of the radiative neutrino-mass model (possibly in companion paper arXiv:2609.08808, unread)."
    - "The benchmark table: six HNL masses, |U_muN|^2 per point, widths, and the Higgs/scalar-sector parameters."
    - "N decay channels and branching ratios (needed to define the mu+ p final states)."
    - "A UFO model for the radiative model (none confirmed); HeavyN Dirac variant is only a partial stand-in without the scalar sector."
    - "The original cut-flow, backgrounds and classifier definition (for any apples-to-apples recast)."
    - "An LHμC machine scenario to recast onto (e.g. LHMUC-DIS2026-1TEV from parameters/machine/scenarios.yaml once written by the parameter agents; the DIS2026 example set quotes 'Center-of-mass energy, √s [TeV] 5.3' in SRC_ARXIV_2610_35154 Table 1 p.4), plus proton PDF choice and photon-flux treatment for the mu+ p initial state."
    - "Verification of charge, colour and lepton-number conservation of every candidate channel at diagram level, then generator-level cross sections (tools, not the LLM)."
  notes: "The original mu+ mu- initial state does not transfer to mu+ p. In mu+ p the muon is a single beam lepton of fixed charge (+1): s-channel annihilation is absent and all N production proceeds via t-channel W/Z/H exchange or photoproduction against a quark or photon from the proton. All four candidate channels are LLM-proposed and carry status proposed_unverified; none has been checked with a diagram tool or generator. Kinematically the LHμC example set exceeds the original 3 TeV (√s = 5.3 TeV quoted above), but the partonic √s for mu+ q is a fraction of this, so reach cannot be inferred by scaling and must be computed."

