lhmuc_recasting:
  original_initial_state_transfers_directly: false
  candidate_mu_p_channels:
    - process: "mu+ p -> mu+ A q X  (neutral-current associated production: mu+ q -> mu+ q A with A radiated off the quark line via its Yukawa coupling; t-channel gamma*/Z exchange)"
      status: proposed_unverified
      notes: "Tree-level in a 2HDM once A couples to light/heavy quarks; the rate is Yukawa-suppressed and depends strongly on the 2HDM type and tan β (down-type enhancement in type II at large tan β would favour b and s initial states, whose PDFs are small). Charge: mu+ q -> mu+ q A conserves charge and colour trivially. Cross section not computed; needs the model UFO, the 2HDM type and the LHμC beam energies as scenario inputs."
    - process: "mu+ p -> nu_mu-bar A q' X  (charged-current associated production: mu+ q -> nu_mu-bar q' A, e.g. mu+ b -> nu_mu-bar t A with A radiated off the top or bottom line)"
      status: proposed_unverified
      notes: "Charge check for mu+ b -> nu_mu-bar t A: (+1) + (-1/3) = +2/3 on the left; 0 + (+2/3) + 0 = +2/3 on the right — consistent; colour flows along the quark line. Requires a b quark from the proton sea (small PDF) for the top-Yukawa-enhanced variant; the light-quark variant mu+ d -> nu_mu-bar u A is Yukawa-suppressed. Diagram set and cross section unverified."
    - process: "Z Z -> A and Z gamma* -> A fusion (vector-boson-fusion-like, mu+ q -> mu+ q A through two neutral bosons meeting at an A vertex)"
      status: proposed_unverified
      notes: "A CP-odd scalar has no tree-level A V V coupling in a CP-conserving 2HDM, so this fusion channel vanishes at tree level and is at best loop-induced (the same kind of loop that generates A -> Z Z gamma). It must be checked explicitly against the model's Feynman rules before being kept; expected to be negligible relative to the Yukawa-mediated channels."
    - process: "gamma gamma -> A  (two-photon production: quasi-real photon from the muon and from the proton, elastic or inelastic; loop-induced A gamma gamma vertex)"
      status: proposed_unverified
      notes: "Loop-induced (fermion and charged-Higgs loops). The LHμC two-photon framework presented in the Khanpour workshop deck (SRC_WS1681458_KHANPOUR_GAMMAGAMMA, equivalent-photon approximation on p.9-11) would supply the photon fluxes; no number is taken from it here. Needs the effective A gamma gamma coupling of the actual benchmark points, which the snippets do not give."
    - process: "b b-bar -> A  (b-bbar fusion, the dominant A production mode at hadron colliders for large tan β)"
      status: rejected
      notes: "Not available in mu+ p collisions: the muon beam carries no (anti)quark, so there is no s-channel b b-bar annihilation initial state. Recorded so the omission is documented."
    - process: "g g -> A  (gluon fusion through quark loops)"
      status: rejected
      notes: "Requires two gluons; only one beam is a hadron. Not available in mu+ p collisions."
  missing_for_implementation:
    - "Full text of arXiv:2610.17801 (fetch pending; arxiv.org blocked in this session): 2HDM Yukawa type, VLQ representations and charges, Lagrangian and parameter definitions, benchmark-point values (m_A, m_H, m_H±, tan β, alignment angle, m_VLQ, mixings), partial widths and BRs per benchmark for unpolarized and polarized Z, and any statement on released code or form factors."
    - "A combined 2HDM+VLQ model implementation (FeynRules/UFO) — none found publicly; only separate 2HDM (2HDM_NLO, 2HDM_FR, Pseudoscalar_2HDMI) and generic VLQ (VLQ_UFO) models exist (search snippets only, fetch blocked, licences unseen)."
    - "A loop-capable implementation of the A -> Z Z gamma amplitude: MadGraph5_aMC@NLO loop-induced mode with an NLO-ready UFO (R2 and UV counterterms), or an effective A Z Z gamma vertex fitted to the paper's one-loop form factors, or an independent one-loop computation (FeynArts/FormCalc/LoopTools) to reproduce the published widths before any use."
    - "A production mechanism for A in mu+ p collisions: the paper supplies none. The candidate channels above are proposed_unverified; charge/colour checks, diagram verification and cross-section computation with the actual model at LHμC beam energies are all outstanding."
    - "Parameter ids of the LHμC machine scenario to use (muon and proton beam energies, sqrt_s, integrated luminosity per year) — to be referenced from parameters/machine once the recast is set up; no number is written here."
    - "Final-state reconstruction requirements for A -> Z Z gamma in the LHμC detector concept: isolated photon identification and energy resolution, two Z candidates (Z -> l+ l- for a clean four-lepton + photon signature, or Z -> q q-bar for rate), Z-mass windows, A invariant-mass reconstruction from (Z Z gamma), and acceptance for the boosted, forward-going hadronic final state of an asymmetric mu+ p collider. The LHμC detector concept (SRC_ARXIV_2610_35154 §4 p.5) has not been consulted for this record."
    - "Signal-rate feasibility arithmetic: expected yield = σ(mu+ p -> A X) × L_int × BR(A -> Z Z gamma) × BR(Z decays) × acceptance. With BR(A -> Z Z gamma) at the snippet level 1e-5 to 1e-4, a measurable yield requires an A production cross section and integrated luminosity that are both unknown; the yield cannot be estimated until σ(A) is computed."
    - "Standard-Model backgrounds for a Z Z gamma (+ jet, + muon) final state in mu+ p collisions (continuum Z Z gamma production, Z gamma + jets with a fake Z, Z Z + jets with a fake or radiated photon): none evaluated."
    - "Validation reference: no collider result exists in the original study to reproduce; the only closure test available is reproducing the published partial widths at the benchmark points (requires the full text)."
  notes: "The original study is a decay-width calculation; it contains no production cross section, no event selection and no collider parameters, so nothing transfers directly to the LHμC. Its own collider remark ('future multi-TeV muon colliders', search snippet, unverified) refers to mu+ mu- machines, where A could be produced in s-channel or associated production; in mu+ p the production must be derived from scratch. The two 'rejected' entries document hadron-collider modes that are structurally absent in mu+ p. Until a production channel reaches at least 'cross_section_computed', this benchmark cannot be ranked against the others and no P-level above P0 may be attached to any recast (docs/validation_plan.md)."

