# Theory proposal record — Benchmark C (charged-current di-Higgs, anomalous Higgs couplings at mu+ p), Phase 0 evidence audit.
# Schema: schemas/proposal.schema.json. Written 2026-10-28 by Claude (Phase 0 audit); not human-reviewed.
#
# EVIDENCE STATUS: the source is the UPLOADED 24-page slide deck SRC_WS_LEBOHO_KUMAR_DIHIGGS (category PRIMARY_LHMUC,
# research/source_registry.yaml), read in full (per-page text + PDF pages 7, 8 and 15 inspected as images). Every number
# below is quoted verbatim from the deck with its page number ("p.N"). The deck cites two documents that were NOT read in
# this session (arxiv.org and the FeynRules wiki are blocked): Kumar et al., PLB 764 (2017) (the FCC-he e-p predecessor study)
# and the FeynRules HEL model. Every statement about those two that goes beyond what the slides themselves print comes from
# the research agents' search-snippet fragments (research/_fragments/theory-benchmarks_sources.yaml) and is marked
# "(search snippet, unverified)"; snippet-only evidence may not back reported_lhmuc and is capped at confidence medium.
# Parameter records with full provenance for this deck live in parameters/physics_programme/lhmuc_dihiggs_benchmark.yaml,
# parameters/detector/lhmuc_dihiggs_analysis_assumptions.yaml and parameters/machine/scenarios_dihiggs.yaml (owned by the
# parameter agents); this record cross-references them and does not duplicate their provenance blocks.
