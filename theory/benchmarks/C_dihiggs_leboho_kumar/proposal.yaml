notes: >-
  Source read in full: 24 slides (p.18 'Thank you', p.19 'Backup' divider carry no content). All numbers in this record are
  verbatim from SRC_WS_LEBOHO_KUMAR_DIHIGGS with page numbers; the p.8 and p.15 tables and the p.7 plot were checked
  against the PDF images. Internal consistency checks (arithmetic only, no physics): 2*sqrt(0.5*7000) = 3.742 TeV and
  2*sqrt(1000*7000) = 5.292 TeV reproduce the quoted √s; 166.7 × 0.7^4 = 40.02 reproduces the 'Initial' signal yield;
  22.27/sqrt(22.27+5.19) = 4.25 reproduces the final significance; (0.01)^2 (0.7)^2 = 4.9e-5 reproduces the mistag weight.
  Minor presentational discrepancies preserved: 167 events (p.8) vs 166.7 (p.12); B = 5.19 (p.12) vs 5.18 (p.22) vs
  '≈ 5.2' (p.14-15); S = 22.27 (p.12) vs 22.3 (p.14, p.22). The deck is dated 24 September 2026 (p.1) and is believed to be
  the material of the Kraków workshop contribution 'Status of Di-Higgs at LHμC' (ref. [15] of arXiv:2610.35154) — relation
  inferred by the source registry, not verified. Non-uploaded documents mentioned: Kumar et al. PLB 764 (2017) 247
  (arXiv:1509.04016, CC BY — search snippet, unverified) and the FeynRules HEL model (search snippet, unverified); the
  SAIP 2026 deck SRC_URL_SAIP2026_653_NKADIMENG_DIHIGGS also names 'effdihiggs-v2' (search snippet, unverified). No
  parameter value in this record is new: the authoritative provenance blocks are the PHYS_DIHIGGS_*, DET_DIHIGGS_* and
  MACHINE_*_DIHIGGS* records written by the parameter agents.
