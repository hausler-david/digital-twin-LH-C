model_implementation:
  available: yes_private
  type: "UFO (MadGraph5_aMC model 'effdihiggs-v2', named on p.6); no FeynRules source or process cards shown"
  url: null
  licence: null
  notes: >-
    The UFO 'effdihiggs-v2' is named on the slides but no download location, licence or version hash is given, and the
    research agents' searches found no public hosting (research/_fragments/theory-benchmarks_sources.yaml: ''effdihiggs' /
    'HELv2' UFO: no public hosting location found (not on FeynRules wiki, GitHub, or Zenodo in results)' — search snippet,
    unverified). It must be requested from the authors (M. Kumar / Wits). PARTIAL PUBLIC STAND-IN: the FeynRules HEL model
    (Alloul, Fuks, Sanz; https://cp3.irmp.ucl.ac.be/projects/feynrules/wiki/HEL; fragment SRC_URL_FEYNRULES_HEL,
    access blocked; 'The UFO model file generated by FeynRules has all the new parameters set to 0.1.' — search snippet,
    unverified) implements a dimension-six Higgs effective Lagrangian whose operator basis is NOT the p.21 basis
    (g^(1,2)_hhh, g^(1,2)_hWW, g~_hWW, g^(1,2)_hhWW, g~_hhWW); any mapping between the two parametrisations would have to
    be derived and documented before HEL could reproduce the slides. The adjacent FeynRules HEFT_DH model (fragment
    SRC_URL_FEYNRULES_HEFT_DH, snippet-level) is a second candidate stand-in, also unmapped. Process cards, run cards
    (generation cuts, scales), the CTEQ6L1 LHAPDF identifier and the parameter-card values of the scan are not provided.

lhmuc_recasting:
  original_initial_state_transfers_directly: true
  candidate_mu_p_channels:
    - process: "μ+ p → h h j ν̄μ, h → b b̄ (CC W-fusion di-Higgs) at the original Configuration A, E_mu = 500 GeV on 7 TeV p, sqrt(s) = 3.74 TeV — scenario LHMUC-DIHIGGS-500GEV"
      status: proposed_unverified
      notes: "This is the original study's own channel and configuration; the slides report σ_SM = 0.167 fb and the full cut-flow. Status is proposed_unverified from the project's point of view because nothing has been reproduced here (no UFO, no generator run). Reproduction target: σ_SM ≈ 0.17 fb, 40.02 → 22.27 signal events through the cut-flow, S/√(S+B) = 4.25. Same beam energies as LHMUC-WP-OPT1-500GEV (Khanpour p.4) but with 1 ab^-1 assumed instead of that option's 250 fb^-1 (see scenarios_dihiggs.yaml notes)."
    - process: "μ+ p → h h j ν̄μ, h → b b̄ at the DIS2026 baseline, E_mu = 1 TeV on 7 TeV p, sqrt(s) = 5.3 TeV — scenario LHMUC-DIS2026-1TEV (same energies as LHMUC-DIHIGGS-1TEV)"
      status: proposed_unverified
      notes: "The slides give only the inclusive scan and σ_SM ≈ 0.33 fb at 5.29 TeV (p.7); no cut-flow, background yields or limits at this energy. The DIS2026 example set (SRC_ARXIV_2610_35154 Table 1 p.4: 'Center-of-mass energy, √s [TeV] 5.3') supplies the machine luminosity, so an integrated-luminosity assumption consistent with that set (rather than the slides' flat 1 ab^-1) must be documented before projecting. The cut-flow efficiencies at 500 GeV cannot be assumed to hold at 1 TeV (harder forward-jet spectrum, p.4: 'more phase space and a harder spectrum'); they must be recomputed."
    - process: "μ+ p → h h j ν̄μ, h → b b̄ at the 2 TeV muon option, E_mu = 2 TeV on 7 TeV p, sqrt(s) = 7.5 TeV — scenario LHMUC-DIS2026-2TEV"
      status: proposed_unverified
      notes: "Not studied on the slides at all. √s = 7.5 TeV from SRC_ARXIV_2610_35154 p.2 ('an option of the 2 TeV muon beam is also considered, resulting in a yet higher √s_μp = 7.5 TeV'; MACHINE_SQRT_S_2TEV_DIS2026). The p.7 remark 'Doubling Eµ roughly doubles the rate across the scan' refers to 500 GeV → 1 TeV and must not be extrapolated to 2 TeV without a generator run. No luminosity table exists for the 2 TeV option in the DIS2026 paper."
    - process: "μ+ p → μ+ h h j (neutral-current Z-fusion di-Higgs), h → b b̄ — LLM-proposed complement, NOT in the original study"
      status: proposed_unverified
      notes: "Listed only because the p.21 Lagrangian modifies hWW/hhWW but not hZZ/hhZZ, so the NC channel would probe g^(1,2)_hhh alone with a tagged μ+ instead of E_T^miss. Expected to be smaller than the CC channel (by analogy with e p studies; not computed). Requires checking whether 'effdihiggs-v2' contains any anomalous Z couplings. Charge: μ+(+1) + q → μ+(+1) + q' + h h: balanced; colour: quark line unchanged."
  missing_for_implementation:
    - "The UFO model 'effdihiggs-v2' itself (not public; request from the authors), with its version, checksum and licence."
    - "Operator-basis mapping if the public FeynRules HEL (or HEFT_DH) is used as a stand-in; neither is the p.21 basis."
    - "MadGraph process definitions, run card (generation-level cuts, renormalisation/factorisation scales, PDF identifier for CTEQ6L1) and the parameter cards of the 13-point g^(1)_hhh scan and of the g^(1)_hWW / g^(1)_hhWW variations used for the p.15 limits."
    - "Detector simulation beyond parton level: no parton shower, hadronisation, jet clustering, b-tagging model beyond flat 70%/1% weights, or detector response (only 12% jet-energy smearing). The LHμC detector concept (nozzle, acceptance at |η| < 5 for b quarks) is not connected to the analysis."
    - "Definition of Z_A and of the 5% systematic in the limit setting (p.15); whether the systematic is on background only or on signal too."
    - "Resolution of the b-pairing description: 'minimising the distance to mh = 125 GeV' (p.9) versus 'Truth-based b-pairing (each b to its parent Higgs, no mass bias)' (p.17)."
    - "Cut-flow, background yields and limits at the 1 TeV configuration (only σ_SM ≈ 0.33 fb is given) and anything at 2 TeV."
    - "The Δφ(E_T^miss, J) shape analysis and the neural-network classifier announced as ongoing (p.11, p.17); results for g^(2)_hhh, g^(2)_hWW, g~_hWW, g^(2)_hhWW, g~_hhWW."
    - "The predecessor paper Kumar et al. PLB 764 (2017) 247 (arXiv:1509.04016; search snippet, unverified) for the e−p cut-flow 'Table 2' cited on p.4 — fetch blocked in this session."
    - "An integrated-luminosity assumption for each LHμC scenario consistent with the machine records (the slides assume a flat 1 ab^-1 and project 10 ab^-1 without stating a running time)."
  notes: >-
    The schema description of original_initial_state_transfers_directly says 'Always false for μ+μ- or pp originals';
    this benchmark is the exception the field allows for: the original study is itself a μ+ p study with the LHμC beam
    energies (E_mu = 500 GeV / 1 TeV on E_p = 7 TeV), so the signal and background processes transfer without re-deriving
    the initial state, and the value is set to true. What does NOT transfer automatically: the integrated luminosity
    (assumed, not taken from a machine design), the detector model (parton level only) and the cut-flow efficiencies at
    other beam energies. All four candidate channels carry proposed_unverified because no diagram check or generator run
    has been performed in this project.

