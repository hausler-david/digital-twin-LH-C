    validation_level: P0
    notes: "P0: the only arithmetic available (0.04 = 21.2e12 / 500e12; 1.741 mm = 0.6 ns MeV; 0.02 = 0.04 x 0.5) is audit arithmetic recorded in the parameter notes, not yet pinned in tests/scientific. The cooling-system and target flux uncertainties (~30 % each) are the author's own guesses, explicitly not official IMCC numbers. low_energy_cooling_efficiency, wall_plug_power and hts_radiation_tolerance are listed both as roles (pointing to explicit-unknown records with value null) and in unknown_roles; cost carries an order-of-magnitude value (~O(500) MCHF, stored as a dimensionless number of MCHF) and is therefore a role only (removed from unknown_roles by the G2_SOURCE verifier, 2026-10-29). The IMCC performance table reproduced on p.14 is written for the μ− line (column 'Estimated μ−/bunch'); the hybrid concept applies it to μ+. Everything downstream of stage A4 (deceleration, low-energy cooling, extraction) is undesigned per the deck."

  - scenario_id: JPARC-MUSE-S2-2024
    label: "J-PARC MUSE S2 area, March-April 2024: first RF acceleration of ultra-slow μ+ to 100 keV (Aritome et al.)"
    description: "Measurement conditions of arXiv:2410.11367v2 / PRL 134, 245001 (2025): 3 GeV RCS at 25 Hz, 940 kW on the MLF target, 9.5e4 surface μ+ per pulse on a both-sides laser-ablated silica aerogel target (78 mm diameter, 8 mm, 23.6 mg/cm^3, 250 μm holes at 300 μm pitch) behind a 420 μm Al degrader; muonium ionised by a 244 nm 1S-2S spectroscopy laser (0.5-1.3 mJ, 57 ns, simulated ionisation efficiency 7e-6 - 6e-5); Soa-lens extraction at 5.7 keV ((4.0 ± 0.4)e-3 μ+ per pulse), prototype J-PARC RFQ at 324.03 MHz / 2.6 kW to 100 keV (2e-3 μ+ per pulse, acceleration efficiency ≥ 50 %); measured normalised rms emittances 0.85 (H) and 0.32 (V) π mm mrad against simulated 0.27 / 0.154. The demonstrated end-to-end yield is 2.1e-8 μ+ per surface muon. Analogous technology for the LHμC ultra-cold source; the laser was not designed for ionisation."
    machine: JPARC_MUSE
    design_version: "Aritome et al., arXiv:2410.11367v2 (18 Jun 2025), as published; experiment March-April 2024, user program 2011MS06"
    status: reported
    primary_source_ids: [SRC_ARXIV_2410_11367]
    parameters:
