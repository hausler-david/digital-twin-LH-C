# Source-side scenarios added by the 2026-10-28 addendum (group G2_SOURCE). Schema: schemas/machine.schema.json.
# No numbers here: every role references a parameter record in parameters/source/*.yaml; unknown_roles lists what the sources
# do not give. LHMUC-SOURCE-HYBRID-IMCC describes the hybrid source CONCEPT of C. Rogers' Kraków deck (not a beam parameter set);
# JPARC-MUSE-S2-2024 describes the measurement conditions of the first RF acceleration of ultra-slow mu+ (Aritome et al. 2024/2025).
# Verified 2026-10-29 by the G2_SOURCE adversarial verifier (research/_fragments/verify_G2_SOURCE.md).
scenarios:
  - scenario_id: LHMUC-SOURCE-HYBRID-IMCC
    label: "LHμC hybrid ultra-cold μ+ source concept: IMCC capture + rectilinear stage-A cooling + deceleration + low-energy cooling (Rogers, Kraków 2026)"
    description: "Concept proposed for the LHμC by C. Rogers (STFC/IMCC) at the HELP4CERN workshop 'Ultra-cold muons for the LHC' (24-26 Sept 2026): MW-class protons on an IMCC-type graphite target with an all-HTS capture solenoid, solenoid chicane and proton absorber, Neuffer buncher/phase rotator, rectilinear ionisation cooling stopped at the end of stage A4 (IMCC design of Zhu et al. PRAB 28 (2025) 041003: eps_T 1.239 mm, eps_L 1.741 mm = 0.6 ns MeV, 219 MeV/c), then an undesigned deceleration/phase rotation targeting 1 MeV energy spread and 1 ns bunches at ~50 % efficiency, feeding a low-energy (laser-ionisation or frictional) cooling stage. Author's estimate: 0.04 μ+ per 5 GeV proton to the end of stage A. The IMCC numbers are analogous technology; the hybrid-specific statements are concept-level. No ultra-cold yield, repetition rate, bunch structure or final emittance is given for the LHμC."
    machine: LHMUC
    design_version: "Rogers, 'Hybrid Source of Ultra Cold Muons', Kraków workshop slides (SRC_WS1681458_ROGERS_HYBRID_SOURCE), 24 Sept 2026; IMCC values from Zhu et al. PRAB 28 (2025) 041003 and the IMCC performance table reproduced on p.14"
    status: partially_reported
    primary_source_ids: [SRC_WS1681458_ROGERS_HYBRID_SOURCE]
    parameters:
      source_concept: SOURCE_HYBRID_CONCEPT_WS2026_ROGERS
      proton_driver_energy: SOURCE_HYBRID_PROTON_DRIVER_ENERGY_WS2026_ROGERS
      target_beam_power_min: SOURCE_HYBRID_TARGET_BEAM_POWER_MIN_WS2026_ROGERS
