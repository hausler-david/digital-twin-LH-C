  description: 'Set-up ''μp-2'' of arXiv:2101.10476v2 (Table I, Sec. II), ''supposed to be an upgrade of µp − 1'': a 3 TeV μ− beam on
    a 50 TeV proton beam (''in agreement with the … FCC''), √s 24.5 TeV, an ASSUMED ''slightly optimistic'' peak luminosity of 1e34
    cm^-2 s^-1, 1e7 s/year for 10 years giving 1 ab^-1. Same physics studies as μp-1. Not a machine design: no beam, optics, IR, source
    or detector parameters are given. The beam is μ−; LHμC collides μ+, and no LHμC scenario has these energies.'
  machine: OTHER
