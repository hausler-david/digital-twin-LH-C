  - main_ring_circumference
  - main_ring_dipole_field
  - proton_ring_design
  - muon_source_scheme
  - muon_cooling
  - muon_acceleration_chain
  - muon_lifetime_lab
  - average_luminosity
  - wall_plug_power
  - cost
  geometry_fidelity: G0
  validation_level: P1
  notes: 'P1: √s and L_int reproduced by tests/scientific/test_batch9_documents.py::test_cheung2021_table1_centre_of_mass_energies and
    ::test_cheung2021_integrated_luminosity_from_assumed_peak; the physics roles carry their own levels (P1 for Δσ/σ (band), Δg_hbb/g_hbb
    and the Higgs yield; P0 for the Table IV cells, whose audit reproduction is not a registered test). integrated_luminosity_per_year
    is an analytical_estimate computed in this extraction (P0: the cited test asserts only the 10-year product). Every unknown
    role is absent from the paper, not zero. The detector is an LHeC Delphes card (detector_simulation_proxy); there is no μp detector
    design (detector_design is unknown). The μp-1 energies equal those of LHMUC-DIS2026-1TEV (MACHINE_MU_BEAM_ENERGY_DIS2026,
    PROTON_BEAM_ENERGY_DIS2026), LHMUC-WP-BASELINE-1TEV and LHMUC-DIHIGGS-1TEV, but the charge differs from all three (μ− here, μ+
    there), and the luminosity basis differs from LHMUC-DIS2026-1TEV (an assumed order-of-magnitude value here; an example parameter
    set with beam parameters there, itself not a final specification).'
- scenario_id: CHEUNG2021-MUP2-MUMINUS-P
  label: 'Cheung & Wang 2021 ''μp-2'': 3 TeV μ− on 50 TeV protons (√s 24.5 TeV, assumed 1e34 cm^-2 s^-1, 1 ab^-1), μ−p phenomenology
