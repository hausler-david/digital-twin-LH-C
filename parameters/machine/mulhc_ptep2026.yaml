    derivation: null
    applicability:
      category: design_variant
      scenario: MULHC-PTEP2026-MUTRISTAN-BOOSTER
      explanation: Value reported by Akturk et al. for the μLHC (HL-LHC based μ+p collider), a related machine and direct precursor of the LHμC
        concept; not an LHμC specification. Computed by the authors with the AloHEP code ('with beam size matched accordingly'). The acknowledgements
        (p.21) state the luminosity 'increased by approximately 2 times for the μTRISTAN-based option' after the survival-rate correction; v2
        is taken to be the post-erratum value (unresolved, see source registry).
    confidence: high
    assumption_id: null
  validation:
    level: P1
    methods:
    - 'analytical (verifier, 2026-10-28): L = f_coll N_mu N_p / (4 pi sigma^2) with f = 4 MHz, N_mu = 3.7e+10, N_p = 2.2e11, sigma_x = sigma_y
      = 4.3 um gives 1.40e34 cm^-2 s^-1; multiplied by the paper''s average-population factor 0.632 (1 - 1/e, p.11) gives 8.86e33 cm^-2 s^-1,
      matching the printed value to 1%'
    check_ids: []
    notes: Reproduction with a round-beam head-on formula and the decay-average factor; hourglass/pinch corrections quoted for AloHEP are evidently
      negligible at this level (sigma_z = 2 mm << beta* ~ 4-7 cm). Not an independent AloHEP run.
