      category: screening_only
      scenario: LHMUC-WS2026-FORTHOMME
      explanation: 'Implied, not stated: the slide gives L, the bunch spacing, N_mu and σ but no proton bunch population. The value follows under two conventions: H = 1 (the convention
        that reproduces the DIS2026 and μLHC tables) and a collision rate f = 1/300 ns (a proton bunch meets a muon bunch every 300 ns, i.e. the muon train fills the ring and ''peak''
        means the in-train rate).'
