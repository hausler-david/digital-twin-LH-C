  notes: 'P1 for the scenario: the Table 2 current (499 pC / 24.95 ns = 20.0 mA), the rigidities (Bρ_p 23 350 vs 23 333 T m, Bρ_e 166.8 vs 167 T m) and the arc 5→6 synchrotron scaling (E_c ∝ E^3, P ∝ E^4
    within 1 %) are reproduced in tests/scientific/test_batch7_documents.py (test_andre2022_table2_current_from_charge_and_spacing, test_andre2022_magnetic_rigidities, test_andre2022_table3_synchrotron_scaling_between_arcs);
    this extraction adds 801.58 MHz × 24.95 ns = 20.0 RF buckets, Table 3 energies = 0.5 + 8.25 n GeV (injection = dump energy 500 MeV) and 20 mA × 50 GV = 1 GW. The Table 4 luminosity is only band-checked
    (ratio ≈ 0.75 with assumed HL-LHC protons, test_andre2022_table4_luminosity_with_hl_lhc_proton_parameters_recorded_band) because the proton inputs are not in the paper. TWO READING CORRECTIONS vs the
    batch-7 brief: the Fig. 19 header gives β*_p = 10.0 cm and β*_e = 10.9 cm (subscripts p/e, not x/y; the lead ids IR_BETA_X/Y_STAR_ANDRE2022 are kept as labels only), and the Fig. 8 constant term reads
    (0.318 ± 0.02) %, not ± 0.021. Internal inconsistencies of the paper preserved as separate records: ''about 13 m'' vs 13.75 m detector length; ''five backward disks'' vs Table 1 Bwd rings 2+1+4 = 7;
    ''roughly 2 m'' magnet radius vs the 156 cm drawing label; text 500 pC / 40 MHz vs Table 2 499 pC / 24.95 ns. Status ''reported'' as instructed by the lead (every slot is a value the paper states or
    a documented derivation); electron-beam roles are LHeC roles, not LHμC muon roles. Detector records carry scenario null (detector values are not tied to the machine scenario) but are linked here for
    the G0 geometry. G8 VERIFICATION (2026-10-29): all 275 records re-checked against the page images and the text layer (no value, unit, page or quotation error found; the extractor''s three corrections
    to the brief are confirmed); four IR_SR_*_FIG19_ANDRE2022 records added that recover the absolute IR synchrotron-radiation power (≈ 30 kW reference, ≈ 16.9 kW optimised) and critical energy (≈ 300 keV
    reference, ≈ 264 keV optimised) from the Fig. 19 twin axes, so ir_sr_absolute_critical_energy / ir_sr_absolute_power left unknown_roles; physics-programme prospects of §§2.2–2.4 added in parameters/physics_programme/lhec_physics_andre2022.yaml
    and linked as roles (scenario null on those records: the paper does not tie them to the 50 GeV configuration explicitly). See research/_fragments/verify_G8_LHEC_DETECTOR_ERL.md.'
