# Scenario added by the batch-7 G8_LHEC_DETECTOR_ERL extraction (2026-10-28). Schema: schemas/machine.schema.json. No numbers here: every role references a
# parameter record in parameters/detector/lhec_detector_andre2022.yaml, parameters/acceleration/lhec_erl_andre2022.yaml or
# parameters/interaction_region/lhec_ir_andre2022.yaml; unknown_roles lists what the paper does not give (notably the proton bunch population and emittance behind
# the Table 4 luminosity). LHEC-ANDRE2022-ERL-50GEV is a related-machine comparator (machine LHEC), not an LHμC scenario.
# G8 VERIFICATION (2026-10-29): roles for the Fig. 19 absolute SR values and the §§2.2–2.4 physics prospects added; two unknown_roles resolved. See the scenario notes.
scenarios:
- scenario_id: LHEC-ANDRE2022-ERL-50GEV
  label: LHeC ERL-based ep collider as described by André et al. 2022 (50 GeV electrons on 7 TeV LHC protons at IP2), related-machine comparator
  description: 'LHeC design iteration of arXiv:2201.02436v1: 3-turn racetrack ERL (two ~900 m SRF linacs, three return arcs per side, 801.58 MHz, 20.06 MV/m, 6665 m total length) delivering 50 GeV electrons,
    499 pC bunches every 24.95 ns (20 mA, 120 mA circulating, 1 GW virtual beam power, Q0 > 1e10, 30 µm normalised emittance), head-on collisions with the 7 TeV proton beam (or 2.76 TeV/nucleon ions) at
    IP2 in a three-beam IR (Bρ 23 333 vs 167 T m, L* = 15 m, QA1 electron aperture 106 mm from the proton orbit, matched beam sizes, Fig. 19 β*_p = 10.0 cm / β*_e = 10.9 cm), luminosity goal 1e34 cm^-2
    s^-1 with 8.2e33 from the optical-matching beam-beam simulation (Table 4), SR in arc 6 of 609.3 keV / 12.17 MW (Table 3), front-to-end transmission 98.4–99.9 % and energy recovery 95.4–97.9 % for 1/5–1/3
    C_LHC (Table 6), dump at 500 MeV; updated detector (3 T solenoid + 0.17 T dipole, 13.75 m × 9 m, tracker R = 80 cm, η 5.2/−4.6) and the 15.26 m symmetrised eh/hh variant. All values are imported_related
    (LHeC), the derived ones analytical_estimate; nothing here is an LHμC value. The paper states neither the proton bunch population nor the proton emittance used for Table 4.'
  machine: LHEC
