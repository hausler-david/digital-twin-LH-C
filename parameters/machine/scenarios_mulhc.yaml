  # 2026-10-29: lowered from P1 under docs/validation_plan.md §1 rule 3 (minimum over the role records); 'P1' in the notes refers to checks of single quantities (research/_fragments/scenario_levels_lowered_2026-10-29.csv)
  validation_level: P0
  notes: sigma_x_ip/sigma_y_ip point to the single 'matched' 4.3 um of Table 3 (the paper prints one value for x and y), which does not follow
    from the Table 1 beta*/emittance (3.6 um / 1.7 um); the verifier showed it corresponds to beta*_mu = 4.37 cm in both planes (MACHINE_MU_BETA_STAR_MATCHED_IMPLIED_MULHC),
    which also reproduces xi_mu = 600e-4. Booster extraction energy printed as 960 GeV with 30 GeV linacs while Table 1 uses 1000 GeV (requires
    31.25 GeV linacs). booster_circumference is an analytical estimate (two semicircular arcs assumed), not a printed value. Booster survival
    82% reproduced by a turn-by-turn decay integral (P1). Luminosity 8.8e33 reproduced to 1% by f N_mu N_p/(4 pi sigma^2) x 0.632 (P1); not an
    independent AloHEP run.
