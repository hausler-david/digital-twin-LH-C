- scenario_id: MULHC-PTEP2026-MUTRISTAN-BOOSTER
  label: μLHC, μTRISTAN-type booster (PTEP 2026, as printed in arXiv v2; erratum status unresolved)
  description: 'HL-LHC based μ+p collider of Akturk et al.: 1 TeV μ+ from a μTRISTAN-type race-track booster (two 3 km linacs, 1 km-radius arcs,
    16 turns, 82% survival) stored in a 3 km main ring tangential to the LHC, colliding with 7 TeV protons (LHeC ERL60-upgraded proton set). Luminosity
    8.8e33 cm^-2 s^-1 from AloHEP with ''beam size matched'' to 4.3 um.'
  machine: MULHC
  design_version: PTEP 2026 033C04 (erratum status of the uploaded v2 unresolved); arXiv:2506.15445v2 Tables 1-3 (μTRISTAN-based column)
