  notes: The ERL booster circumference and arc geometry for muons are not given (LHeC arcs 'unsuitable'; cascaded vFFA arcs only proposed); the
    67% survival is reproduced by the verifier's decay integral only under an assumed circumference of ~8.4 km (65.6% for 1/3 of the LHC circumference),
    so it stays P0. Same sigma_x,y matching explanation as the μTRISTAN scenario (beta*_mu = 4.37 cm implied). Luminosity 7.2e33 reproduced to
    1% by f N_mu N_p/(4 pi sigma^2) x 0.632 (P1); not an independent AloHEP run.
