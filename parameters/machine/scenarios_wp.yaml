# Scenarios defined by the HELP4CERN White Paper working points as quoted in SRC_WS1681458_KHANPOUR_GAMMAGAMMA p.4. Schema: schemas/machine.schema.json.
# No numbers here: every role references a parameter record in parameters/machine/helpcern_wp_working_points.yaml; unknown_roles lists what the source does not give.
scenarios:
- scenario_id: LHMUC-WP-OPT1-500GEV
  label: 'HELP4CERN White Paper benchmark, option 1: 500 GeV mu+ on 7 TeV p, sqrt(s) ≃ 3.7 TeV, L_int = 250 fb^-1'
  description: 'Working point from the ''Benchmark WPs'' table on p.4 of the Khanpour two-photon-physics slides, attributed there to ''From HELP4CERN White Paper (in preparation)''. The slide gives only
    E_mu, E_p, sqrt(s) and an integrated luminosity L_int (integration period not stated); no beam, optics, IR or machine parameters. ''The first option: Eμ = 500 GeV, Ep = 7 TeV, √s ≃ 3.7 TeV, with a Lint
    = 250 fb−1.'' Used for the 500 GeV columns of the p.5 cross-section table, the 3.7 TeV rows of the p.15 τ+τ− and p.19 W+W− tables and the N_WW count.'
  machine: LHMUC
  design_version: HELP4CERN White Paper 'in preparation' as quoted on p.4 of SRC_WS1681458_KHANPOUR_GAMMAGAMMA (workshop 'Ultra-cold muons for the LHC', AGH Krakow, 24-26 Sep 2026)
  status: partially_reported
  primary_source_ids:
  - SRC_WS1681458_KHANPOUR_GAMMAGAMMA
  parameters:
    muon_beam_energy: MACHINE_MU_BEAM_ENERGY_WP_OPT1
    proton_beam_energy: PROTON_BEAM_ENERGY_WP
    sqrt_s: MACHINE_SQRT_S_WP_OPT1
    integrated_luminosity: MACHINE_INT_LUMINOSITY_WP_OPT1
  unknown_roles:
  - integrated_luminosity_per_year
  - peak_luminosity
  - average_luminosity
  - collision_rate
  - repetition_rate
  - muon_bunch_population
  - proton_bunch_population
  - muon_bunches
  - proton_bunches
  - bunch_spacing
  - sigma_x_ip
  - sigma_y_ip
  - beta_x_star_muon
  - beta_y_star_muon
  - beta_star_proton
  - muon_norm_emittance
  - proton_norm_emittance
  - muon_bunch_length
  - proton_bunch_length
  - main_ring_circumference
  - booster_circumference
  - booster_turns
  - booster_survival
  - muon_lifetime_lab
  - crossing_angle
  - muon_polarisation
  - nozzle_opening_angle
  - proton_driver_power
  geometry_fidelity: G0
  validation_level: P1
  notes: 'P1 only because sqrt(s) is reproduced by 2*sqrt(E_mu*E_p) from the stated beam energies (arithmetic recorded on the parameter records). The role ''integrated_luminosity'' is used instead of ''integrated_luminosity_per_year''
    because the slide writes only ''Lint'' without a period; ''integrated_luminosity_per_year'' is therefore listed as unknown. Source: HELP4CERN White Paper ''in preparation'' (not public, not seen); these
    working points are the slide''s quotation of it. The muon energy is half of the DIS2026 1 TeV example set; no DIS2026 Table-1-type parameters exist for 500 GeV.'
