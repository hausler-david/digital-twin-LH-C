# parameters/ion_beam/lhc_ion_beams_nucleus_options.yaml or parameters/physics_programme/lhmuc_nucleus_options_physics.yaml.
scenarios:
- scenario_id: LHMUC-NUCL-MU-PB
  label: 'LHμC nucleus option: 1 TeV μ+ on the LHC Pb beam (208Pb82+)'
  description: 'μ–Pb collisions evaluated with AloHEP in the Kraków workshop deck ''LHμC: Nucleus Options'' (p.12): 1 TeV μ+ (3.0e10 per bunch, 40 bunches, 3 km ring) on the conservative LHC Pb beam of p.10 (1.80e+08 ions per bunch, 1200 bunches, 574.0 TeV, β* = 10 cm assumed). sqrt(s) = 47.9 TeV, 3.32 TeV per nucleon, f_c = 4.0 MHz, L = 2.16e+30 cm^-2 s^-1 (4.49e+32 per nucleon), xi_A = 0.0789 > 0.01. After reducing N_mu by 8 for xi_A <= 0.01 the luminosity per nucleon is 5.69e+31 cm^-2 s^-1 (p.14). Beam parameters are explicitly not finalised (p.15).'
  machine: LHMUC
  design_version: 'Kraków workshop deck ''LHμC: Nucleus Options'' (SRC_WS1681458_DAGLI_NUCLEUS, 2026-09), p.8 μ+ table (Table 1 of the draft), p.10 ion table, p.12 AloHEP table (Table 3 of the draft), p.13-14 tune-shift-limited recalculation; μTRISTAN/LHeC-ERL based μ+ complex, post-erratum'
