# IMCC/MuCol magnet, RF, power-converter, impedance, demonstrator and CERN civil-engineering reference values from SRC_ARXIV_2510_27437
# (MuCol Milestone Report No. 7, arXiv:2510.27437v1). G7_IMCC_REFERENCE addendum extraction, 2026-10-28. All analogous. page = PDF page.
# Scope: Table 9.1 every cell plus the Appendix H headline text (6D-solenoid design limits and the B10-1 case, collider-magnet field and
# aperture limits, NbTi / Nb3Sn / ReBCO assessments, ReBCO 14-16 T / 100-140 mm if costs drop 3-4×, IR quadrupoles 20 T / 200 mm and
# 300 T/m at 4.5 K); Table 10.1 every cell; Tables I.5 (LEP2) and I.9 (TESLA) every cell; Tables I.8 (greenfield RCS) and I.10 (CERN RCS)
# 'All' column, per-ring wall-plug power and the I.8 caption assumptions; Tables J.1/J.2 headline rows (max B, acceleration time, peak
# power); impedance Tables 11.3 and K.3 and the collider chromaticity requirement; Section 14 Table 14.1 and Table 14.2 headline rows;
# Table L.2 (CTF3 demonstrator) headline rows; Table M.1 every cell (length and cross-section) with its caption and Appendix M text.
# Not extracted: per-solenoid rows of Tables H.1/H.2, Tables I.1-I.4, I.6, I.7, per-ring rows of I.8/I.10 other than wall-plug power,
# the other J.1/J.2 rows, K.1/K.2, L.1, L.3, L.4, the Table 14.2 coil-geometry rows. Units: cost-free; 'MV/m' written megavolt/meter.
# Validation: every record is P0. The extractor's P1 labels ('All' columns = sum of the per-ring cells, cryomodules = Σceil(N_cav/9),
# ARCR length = π × 200 m, ε_l = σ_zσ_E (K.3), CTF3 repetition rate 1/15.6 s) named no test and were lowered mechanically on 2026-10-29;
# the G7C verifier recomputed each check (result in validation.notes: the I.8/I.10 'All' RF section lengths are off by 1 m and the I.10
# 'All' voltage by 0.2 GV). No test under tests/ pins a value of this file.
# Discrepancies inside MR7, kept as printed and not averaged: Table I.8 total RF voltage 133.0 GV vs the 133.5 GV sum; the per-ring and
# 'All' wall-plug powers of Tables I.8/I.10 are 5-21 % below 'average RF power × 1.32 / 0.65' (the caption's own assumptions); J.1/J.2
# peak powers are 0.917 × V_ind·I_pk (= V_ind × 11 kA) in all seven columns (convention not stated); CTF3 average beam power 1.5 kW vs
# 14 GeV × 1e13 × 0.064 Hz = 1.44 kW; IR-quadrupole aperture '100 - 280' mm (Table 9.1) vs 'up to 200 mm' (Appendix H.2); 6D-cooling
# solenoids '≈ 6000' (Table 9.1) vs 3054 (H.1.1); Table I.5 column labels ('linearizer' 352 MHz, 'accelerator' 1056 MHz) vs Table I.6
# ('RLA2 acc' 352 MHz, 'RLA2 lin' 1056 MHz), hence the frequency-keyed ACC_RF_LEP2_352MHZ_* / ACC_RF_LEP2_1056MHZ_* ids; the Table I.10
# row 'Average RF power to beam during cycle' holds the cavity input power (id ACC_RF_RCS_CERN_ALL_AVG_RF_POWER_MR7). Confidence low:
# the two IR-aperture upper ends, the nine wall-plug records and the CTF3 1.5 kW average beam power.
# Costs and FTEs are not pint units and are not used here. Generated by scratchpad/g7/gen/run_g7.py; edit the YAML directly.
# Adversarially verified record by record against the rendered PDF pages by the G7C verifier on 2026-10-29
