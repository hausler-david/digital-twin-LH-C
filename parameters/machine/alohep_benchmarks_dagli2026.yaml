# AloHEP (A luminosity optimizer for High Energy Physics) software paper, Dağlı & Karaca, arXiv:2610.09839v1 (7 Oct 2026, 45 pp),
# SRC_ARXIV_2610_09839 (OFFICIAL_SOFTWARE_DOCUMENTATION, access uploaded). Batch 7, group G10_ALOHEP, 2026-10-28. Schema: schemas/provenance.schema.json.
# EVERY value here is a tool-benchmark value for HERA, EIC, ILC-125, LHC pp / Pb–Pb, RHIC Au–Au or the IMCC/MuCol 10 TeV μ+μ− collider, or a
# program/hardware fact: status analogous, applicability screening_only ('tool-benchmark value, not an LHμC design value'). NOTHING in this file
# is an LHμC design value and nothing carries reported_lhmuc. The few values computed in this extraction (μ+μ− beam energy √s/2, implied IP spot,
# L_geo/L_nom geometric factors, decay-factor ratio) are analytical_estimate with their derivation. Page numbers are the printed page numbers of
# the arXiv PDF (= PDF page index). Quotations are verbatim from the page images (tables transcribed cell by cell as 'Table N row ...: col value | ...').
# Superscripts of the pdftotext layer appear in the quotations as printed by the text layer (e.g. '5 × 104' = 5 × 10^4, '303' = 30^3, 'βy∗' = β*_y).
# Validation: P0 unless an arithmetic reproduction is named in validation.methods (P1); the lead's pinned tests are
# tests/scientific/test_batch7_documents.py::test_dagli2026_mucol_10tev_decay_factor_and_turns and ::test_decay_averaging_differs_between_mumu_and_mup.
