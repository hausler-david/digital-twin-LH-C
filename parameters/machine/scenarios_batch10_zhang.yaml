  notes: 'validation_level P0 = the minimum over the role records (docs/validation_plan.md §1 rule 3; lhmuc.registry.scenario_level_cap
    / tools/apply_scenario_levels.py). The batch-10 task asked for P1, but most roles (efficiencies, geometry, categorical and explicit-unknown
    records) point to P0 records that no registered test reproduces, so a P1 label would overclaim. P1 holds for the individual Table
    I rate records, the 3.9e-7 ionisation efficiency, the 0.586 extraction transmission and the three audit values (tests/scientific/test_batch10_documents.py::test_zhang2021_table1_rates_follow_from_efficiencies,
    ::test_zhang2021_laser_ionisation_factorises, ::test_zhang2021_internal_inconsistencies_recorded), which show that the printed numbers
    are consistent bookkeeping; they do not validate any of the simulations. Internal inconsistencies are kept as separate roles, not
    resolved: s2_surface_muon_rate (2.4e6, §5 and Table I; used by the chain) vs s2_surface_muon_rate_section2 (2.4e5, §2); muon_stopping_efficiency
    (0.467, Table I; used) vs muon_stopping_efficiency_text (0.443, §3); target_*_text (78 × 78 × 6 mm) vs target_*_fig3 (45×35 mm^2,
    8.8 mm); beam_fwhm_*_optimised (47 × 30 mm) vs beam_fwhm_*_gaussian (77 × 29 mm; relation not stated, consistent if read as two
    tuning stages); extraction_transmission 0.586 vs extraction_count_ratio 0.75 vs extraction_named_factors_product 0.666 (0.75 × 0.87
    × 0.90 = 0.587 suggests that the mesh loss is inside the simulated count, an inference only); and, outside the roles, the surface-muon
    momentum 28 MeV/c (§1, for the H-line) vs 27 MeV/c (Fig. 1 inset). None has a conflict record in research/source_conflicts.yaml
    as of 2026-10-29. laser_pulse_energy_244nm, laser_pulse_energy_355nm and aerogel_laser_ablation_pattern point to explicit-unknown
    records (value null) and are also listed in unknown_roles (convention of LHMUC-SOURCE-HYBRID-IMCC). formation_fraction_primary_source_for_this_sample:
    the 0.52 is cited to Beer et al. 2014 [8], which has no formation fraction; the value matches Bakule et al. 2013''s MuSR result
    on the 2013 non-ablated samples (origin inferred, not cited; CONF_MUONIUM_FORMATION_FRACTION), and no formation fraction is given
    for the 23.2 mg/cm^3, 8.8 mm TRIUMF sample. surface_muon_momentum_at_s2 is unknown: the 28 MeV/c of §1 is stated for the g−2/EDM
    H-line beam, and the S2 momentum distribution passed to GEANT4 is not printed; proton_beam_repetition_rate (25 Hz in other sources)
    is not stated in this paper. The laser ionisation efficiency belongs with the 244 nm values of CONF_LASER_IONISATION_EFFICIENCY
    treatment (c). The demonstration was later carried out at S2 (2026 Kraków Zhang deck: 2022 test, 0.126 Hz signal at resonance, SOURCE_IONISATION_TEST_SIGNAL_RATE_JPARC2022_WS2026_ZHANG;
    Aritome et al. 2024 used a 244 nm laser at S2, scenario JPARC-MUSE-S2-2024); those measurements belong to their own sources and
    scenarios and do not validate this simulation.'
