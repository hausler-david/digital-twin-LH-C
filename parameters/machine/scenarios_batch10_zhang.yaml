scenarios:
- scenario_id: JPARC-S2-MU-IONISATION-DEMO-ZHANG2021
  label: 'J-PARC MLF S-line S2: simulated 244 nm 1S-2S muonium laser-ionisation demonstrator at 500 kW (Zhang et al., JPS Conf. Proc.
    33, 011125, 2021)'
  description: 'Planned demonstration of muonium laser ionisation via 1S-2S two-photon excitation (244 nm) followed by 355 nm ionisation
    at the S2 area of the J-PARC MLF S-line (''still under construction'' at the time of writing), as simulated by Zhang et al. 2021
    (JPS Conf. Proc. 33, 011125; 3rd J-PARC Symposium, received 10 January 2020): G4Beamline S-line model, validated by reproducing
    the relative S1 rates with and without slits and compared with the measured S1 intensity (about 1.9e5 s^-1 per pulse at 500 kW,
    ref. [5]); GEANT4 stopping in a silica-aerogel target behind a 100 µm Kapton window and a 435 µm Al degrader; a 3-D random-walk
    diffusion model with T = 322 K and D = 870 cm^2 s^-1 (cited to Beer et al. 2014, which does not contain them); a 2 × 40 × 2 mm^3
    laser region centred 3 mm downstream of the aerogel and fired about 0.8 µs after the mean arrival of the MLF double pulse; a ''preliminary''
    optical-Bloch-equation ionisation efficiency of 3.9e-7 per vacuum muonium (8.8e-7 × about 44 %); SOA lens (20 kV), ED (5 kV), EQs
    and BM to an MCP, simulated with muSRsim. Table I chain: 2.4e6 surface μ+/s at S2 (S-line transport 0.00717) → stopping 0.467 →
    formation 0.52 → vacuum yield 0.082 → ionisation 3.9e-7 → slow-beamline transmission 0.651 → MCP 0.90 = 0.0109 s^-1 (''about 0.011/s''),
    i.e. 4.55e-9 per surface muon at S2. A simulation of a demonstrator with the 244 nm spectroscopy laser, not the 122 nm + 355 nm
    design scheme of the g−2/EDM experiment; analogous technology for the LHμC ultra-cold μ+ source, not an LHμC design.'
