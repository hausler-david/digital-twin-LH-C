  notes: 'Validation P1 only in the sense of the lead arithmetic in tests/scientific/test_mucol_m17_vffa.py: test_stage1_on_orbit_peak_field_from_closed_orbit_geometry (6.93 T reproduced to 0.1 %), test_cell_bending_angles_consistent_with_cell_count (planar θD estimate only; the eq. (2.1) value 0.006554 rad is 3.1 % higher and is the one recorded), test_dispersion_is_inverse_field_index, test_good_field_region_peak_implies_vertical_extent, test_vertical_excursion_from_scaling_law_recorded_bands (48 mm vs 50 mm band), test_kicker_example_deflection. Everything else is P0, including the D-magnet records added by the 2026-10-28 verification (γD = 0.404 rad, ρD = 171.6 m, B_D = 5.83 T < B_F = 6.94 T, hard-edge magnet lengths 2.98 m / 2.25 m; the eqs (2.1)-(2.6) geometry closes exactly and reproduces the 1.18 m drift). Comparator column records ACC_RCS1_*_MUCOLM17 are not part of this scenario. MuCol MR7 Table F.5 restates the same table (ACC_VFFA1_*_MR7, other extraction, unverified here). Stage 1 meets the stated constraints: 6.93 T < 8.3 T, excursion 0.048 m < 5 cm, drift 1.18 m > 1 m.'
