# Scenarios added by the batch-8 G11_MUCOL_M17_VFFA extraction (2026-10-28). Schema: schemas/machine.schema.json. No numbers here: every role
# references a record in parameters/acceleration/mucol_m17_vffa_design_toppmugglestone2025.yaml. Both scenarios are IMCC/MuCol comparators (machine IMCC),
# not LHμC scenarios; status 'reported' means reported by the MuCol M17 report for its own analytic design. unknown_roles lists what the report does not
# give (RF voltage/frequency/cavity count, turns, acceleration time, injection/extraction systems, magnet apertures, ...).
scenarios:
- scenario_id: MUCOL-M17-VFFA1-2025
  label: 'MuCol M17 Stage 1 vFFA: analytic vFFA FODO ring replacing RCS1 (0.06-0.3 TeV, 5990 m), IMCC comparator'
  description: 'Stage 1 vFFA of MuCol Milestone Report 17 (Topp-Mugglestone, 27 Mar 2025): a vertical-excursion FFA designed with the analytic closed-orbit/transfer-matrix formalism to match the footprint and energy range of RCS1 of the IMCC 10 TeV muon-collider chain. Table 2.2 inputs r0 = 953 m, θF = 0.01033 rad, Nc = 790, βF = 0.001564 rad, βD = 0.00118 rad, γF = 0.252 rad, m = 31.94 1/m; Table 2.3 outputs: 5990 m, 0.06→0.3 TeV, SC fixed magnets, ramp rate 0 T/s, vertical excursion 0.048 m, peak field on orbit 6.93 T (good field region 12.52 T for 25 µm), drift 1.18 m, tunes (0.382, 0.079). All values are analogous (IMCC design, not LHμC); the derived entries are audit arithmetic with named inputs. The report states the lattice is analytic only and must be verified by numerical simulation (p. 15); no RF, longitudinal or injection/extraction design exists.'
  machine: IMCC
