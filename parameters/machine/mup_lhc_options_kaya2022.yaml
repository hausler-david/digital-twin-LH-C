      page: 3
      section: 3. Main parameters of µp colliders
      table_figure_or_equation: Eq. (1)
      quotation: 'The general expression for luminosity of the LHC-based µp colliders is given by: L_μp = N_μN_p / (4π max[σ_{x_p},
        σ_{x_μ}] max[σ_{y_p}, σ_{y_μ}]) min[f_{c_p}, f_{c_μ}] (1) where N_µ and N_p are numbers of muons and protons per bunch, respectively;
        σ_{x_p} (σ_{x_μ}) and σ_{y_p} (σ_{y_μ}) are the horizontal and vertical proton (muon) beam sizes at interaction point (IP);
        f_{c_μ} and f_{c_p} are MC and LHC bunch frequencies. f_c is expressed by f_c = N_b f_rev, where N_b denotes the number of bunches
        and f_rev means revolution frequency. Some of these parameters can be rearranged in order to maximize L_µp but one should note
        that there are main limitations due to beam-beam effects that should be kept in mind.'
    derivation: null
    applicability:
      category: design_variant
      scenario: KAYA2022-HLLHC-NOMINAL-EMU0P75TEV; KAYA2022-HLLHC-NOMINAL-EMU1P5TEV; KAYA2022-HLLHC-NOMINAL-EMU3TEV; KAYA2022-HLLHC-UPGRADED-EMU0P75TEV;
        KAYA2022-HLLHC-UPGRADED-EMU1P5TEV; KAYA2022-HLLHC-UPGRADED-EMU3TEV; KAYA2022-HELHC-NOMINAL-EMU0P75TEV; KAYA2022-HELHC-NOMINAL-EMU1P5TEV;
        KAYA2022-HELHC-NOMINAL-EMU3TEV; KAYA2022-HELHC-UPGRADED-EMU0P75TEV; KAYA2022-HELHC-UPGRADED-EMU1P5TEV; KAYA2022-HELHC-UPGRADED-EMU3TEV
      explanation: 'Luminosity convention of Kaya et al. (the larger beam size per plane, the lower collision frequency; no hourglass,
        crossing-angle or decay factor), the same form as MACHINE_LUMINOSITY_FORMULA_MUIC2022 without its H_hg. Related-machine design
        variant: an earlier LHC-based μp proposal of the AloHEP group (precursor of μLHC, SRC_ARXIV_2506_15445), not the LHμC design;
        not an LHμC value.'
    confidence: medium
    assumption_id: null
  validation:
    level: P1
    methods:
    - 'Round beams: 2 max[σ_p, σ_μ]²/(σ_p² + σ_μ²) relates eq. (1) to the Gaussian overlap 1/(2π(σ_p² + σ_μ²)): 1 for matched beams,
