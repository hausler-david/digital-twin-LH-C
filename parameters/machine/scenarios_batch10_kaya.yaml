    is not discussed (CONF_LUMI_MODEL_ASSUMPTIONS). proton_beam_energy uses the Table 2 E_p, which also holds for the nominal ring (Table
    1 √s_pp = 2 E_p; one √s column in Tables 4-5). Table 2 prints no proton bunch length or number of bunches for the upgraded ring,
    so proton_bunch_length and proton_number_of_bunches are unknown (the Table 1 nominal values are not assumed). x_min_q2_* point to
