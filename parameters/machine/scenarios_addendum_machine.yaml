- scenario_id: LHMUC-WS2026-FORTHOMME
  label: LHμC beam set presented by L. Forthomme at the HELP4CERN workshop (slide 17), μ+ on HL-LHC protons
  description: 'LHμC beam-parameter set of the HELP4CERN workshop (in addition to the DIS2026 1 TeV / 2 TeV and μLHC sets): 300 ns muon bunch spacing (assumed), 40 bunches of 1e10 μ+
    in the main ring, σx,y ~ 4.3 µm for ''ultimate HL-LHC optics'' with β* = 7 cm and LHeC-like stand-alone running at IP2, peak luminosity 1e34 cm^-2 s^-1, ~3e13 μ+/s injected into
    the booster, polarisation assumed 50 %, a small crossing angle and a proton bunch population ''higher than HL-LHC''s'' (value not stated; ≈ 7e11 implied under H = 1). The slide does
    not state the muon energy, the proton energy, sqrt(s), a repetition rate, emittances, bunch lengths or the ring circumference.'
