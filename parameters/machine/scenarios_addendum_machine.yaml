- scenario_id: LHEC-WS2026-FORTHOMME
  label: LHeC baseline and IR facts as restated on Forthomme's slides 4 and 16 (comparator, related machine)
  description: 'LHeC (HL-LHC 7 TeV protons + 50 GeV ERL electrons (p.10 legend; 20 GeV ALICE 3 option also plotted), ep √s 1.2 TeV (p.2), one IP, e.g. IP2, three-beam IR): instantaneous
    L ~ 1e34 → 100 fb^-1/year → 1 ab^-1, pile-up ~0.1, radiation ≪ 1e14 n_eq/cm^2, power < 150 MW, ERL with two 20 MV/m linacs and 3 passes, 1/4 LHC circumference preferred; IR with
    head-on collision after electron bending, L* = 15 m vs 23 m with SR critical energies 94.69 vs 44.57 keV (BDSIM), Pb shielding options 0/2/10 cm, element labels Q0F/Q0D/TAS/Q1A/QX/QY/BEND_0.
    All values imported_related; the LHμC detector and IR concept adapts this baseline.'
