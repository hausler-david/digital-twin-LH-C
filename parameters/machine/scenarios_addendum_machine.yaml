# parameter record in parameters/machine/lhmuc_ws2026_forthomme_beam_set.yaml, parameters/interaction_region/lhec_ir_ws2026_forthomme.yaml,
# parameters/proton_beam/lhc_long_bunch_options_ws2026_zimmermann.yaml or parameters/machine/muic_acosta2022_machine.yaml; unknown_roles lists what the
# source does not give. LHMUC-WS2026-FORTHOMME is the only LHμC scenario (partially_reported, muon energy not stated); LHEC-WS2026-FORTHOMME,
# MUIC-ACOSTA2022-* (name collision: Acosta et al.'s 'LHmuC' is not the HELP4CERN LHμC), LHC-PR627-*, QCD-EXPLORER-EPAC2004 and
# LHC-DAMERAU-GAROBY-LONGBUNCH-EPAC2004 are related-machine comparators (machine LHEC / MUIC / OTHER). Validation levels are per scenario (P1 only where
# the notes name the reproduced quantities); geometry fidelity G0 everywhere (no geometry exists).
