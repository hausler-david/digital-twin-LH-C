- scenario_id: LHC-DAMERAU-GAROBY-LONGBUNCH-EPAC2004
  label: 'Damerau-Garoby long flat bunches in the LHC: 16 nominal bunches merged into one (EPAC 2004, CERN-2005-006)'
  description: 'RF-gymnastics scheme restated on Zimmermann''s slides 11-13: bunch rotation in the SPS (8 MV, 200 MHz, 450 GeV, 0.8 eVs), injection into 40 MHz buckets (h = 3564, 7.5
    m), merging 16 → 2 → 1 bunches with two new 1.5 MV frequency-variable 40-80 MHz systems (5 x 300 kV cavities each), acceleration to 7 TeV with 3 MV at 40 MHz, final long flat bunch
    of 28.5 eVs (4-5 m total length in the CERN-2005-006 comparison), collision mode with 0.8/0.8/0.4 MV at 40/80/120 MHz; expected luminosity gain 1.44-1.72 for 2-5 RF harmonics; procedure
    ~1 min. Related-machine (LHC upgrade) scheme; the closest documented precedent for the ''fewer, more intense LHC bunches'' that LHμC needs.'
