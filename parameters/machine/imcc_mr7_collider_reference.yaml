# Collider-level IMCC/MuCol reference parameters from SRC_ARXIV_2510_27437 (MuCol Milestone Report No. 7 'Consolidated Parameters',
# arXiv:2510.27437v1, document v1.0 Final, 30 Oct 2025). G7_IMCC_REFERENCE addendum extraction, 2026-10-28.
# Scope: Table 1.1 (10 TeV baseline) and Table A.1 (Stage 1 3 TeV / Stage 2 10 TeV) every cell; Tables 1.2 (target chain), 1.3 (estimated
# chain) and A.2 (decay-only transmission) every printed cell; Tables 6.1, 6.2 and 12.2 (collider-ring radiation-study beam parameters);
# numbers stated in the Section 1, Section 6 and Appendix A.1 text. Status analogous throughout: IMCC values are analogues for the LHμC muon
# chain, never LHμC values; the report's caveats ('ideal design specifications that each subsystem aims to achieve', 'based on best-available
# simulations', 'Lengths are approximate') are carried in applicability.explanation. page = PDF page index (printed page = PDF page − 11,
# given in 'section'). Conventions: cells printed '–' or empty and the downward arrows of Tables 1.2/1.3 get no record; populations
# printed in units of 10^12 / 10^14 are stored as plain counts; ranges 'a – b' become _MIN/_MAX records sharing an allowed_range;
# '≈'/'about'/'∼' are recorded as uncertainty {type: not_stated, note}.
# Validation (extractor, superseded by the verifier line below): P1 only where the generator recomputed the value within the tolerance written in validation.methods (2NEf_r beam power,
# sqrt(β*ε_n/γ) beam size, luminosity lifetime, hourglass factor, eq. A.9 and eq. A.5 luminosities, decay-only transmissions with KINETIC
# energies and ds/(βγcτ), running sums/products of printed columns); failed reproductions are written into validation.notes and stay P0.
# Internal MR7 inconsistencies preserved, not resolved (conflict candidates): collider circumference 11.4 km (Tables 1.1, A.1, 12.2) vs
# ≈10 km (Table 6.1, 16 T lattice) vs 10 000 m (Tables A.2, 11.3, K.3, M.1); 3 TeV luminosity 2.1e34 (Table A.1) vs 1.8e34 (Schulte deck);
# Table 1.3 cumulative estimated transmission rising from 5.0 % to 6.7 % at RLA2 (Table 1.2 target values repeated); Table 12.2 10 TeV
# decay rate reproduced only with C = 10 km; energy loss per turn ≈27.2 MeV vs 29.0 MeV computed for 16 T; Table A.2 'Total Length' is
# the running sum of lengths although the text says length × turns; Section 1 '12% linear scaling' vs 16/14 = 1.14.
# Other groups' MR7 files: Tables 5.x, E.x, F.x in parameters/acceleration/mucol_mr7_acceleration_chain.yaml; Tables 7.2, 8.x, G.x in
# parameters/interaction_region/mdi_imcc_mr7_maia_music.yaml. Outside this group's scope: Tables 7.1/7.3-7.5 (detectors), 12.1/12.3/12.4
# and 13.x (radiation shielding and protection), 11.1/11.2/K.1/K.2 (RCS impedance). Generated by scratchpad/g7/gen/run_g7.py; edit the
# YAML directly for corrections.
# VERIFIED 2026-10-29 by the G7A_MR7_COLLIDER adversarial verifier (research/_fragments/verify_G7A_MR7_COLLIDER.md): every cell of
# Tables 1.1, 1.2, 1.3, 6.1, 6.2, 12.2, A.1 and A.2 and every text quotation re-read on the rendered PDF pages; all values, units, pages,
# labels and quotations confirmed. P1 now means a pinned test in tests/scientific/test_imcc_mr7_reference.py checks the value (12 records:
# beam power, IP beam size, luminosity lifetime for both stages, hourglass 0.76, eq. A.9 18.8e34, 2.2 ab^-1/year); the generator's other
# arithmetic is recomputed in each validation.notes ('Verifier 2026-10-29: ...'), stating whether it really reproduces the printed digit.
# Confidence lowered to low for 9 records whose printed value contradicts MR7 itself (energy loss per turn, 10 TeV decay rate per metre,
# the two 22.9 eV ms targets, Table 1.3 cumulative RLA2-RCS4). Additional inconsistencies found: Table 1.2 cumulative 7.3 (8 x 0.90 = 7.2)
# and 6.1 (6.7 x 0.90 = 6.0); 22.9 eV ms vs MR7's own '64 mm = 0.0225 eVs'; Table 6.1 geometric luminosities and the A.9 estimate use the
# ~10 km lattice; Schulte 2026 L/IP 17.5e34 (10 TeV) and 1.8e34 (3 TeV) vs MR7 18e34 / 2.1e34.
