    size, Table 3 field index, detector coverage); computed records carry confidence ''medium''.'
- scenario_id: MUTRISTAN-HYBRID-TARGET-2026
  label: 'μTRISTAN hybrid target (Sakaki, Kamioka, Yoshida 2026): liquid-Li pion target inside multilayer hot-tungsten muonium
    emitters, pre-extraction ultraslow-muon yield per p–Li collision'
  description: 'Target-side benchmark of arXiv:2605.25580v1 (PHITS/JAM with a HARP-fitted angle-dependent π+ correction, ∼
    10 % hadronic systematic): 3 GeV protons on liquid lithium inside an energy-recovery internal-target ring; surrounding
    tungsten wire layers (hot W at 2000 K, D = 2e-3 cm^2/s, ℓ_diff ≈ 0.7 µm, ≈ 95 % of emission from within 3 ℓ_diff, ≈ 1/3
    of uniformly stopped near-surface muons emitted, ≈ 10 % in vacuum at the optimal laser time, muonium lost on wall collision);
    representative geometry L_x 3 m, L_z+ 10 m, L_z− 1 m, L_y ∼ 5 m, gap 10 mm, layer 0.1 mm, 500 layers; stopped-muon rms
    extents 10.9 m (z > 0), 1.3 m (z < 0), 2.7 m (x); η_REMPI = 0.73; yield 6e-4 per p–Li collision (saturating at ≈ 1e-3
    for a 5 mm gap) excluding the unquantified muon-to-muonium conversion η_conv; N_p = 2e15/s at 1 MW gives η_conv × 1.2e12
    ultraslow μ+/s before extraction (one collision per proton, idealised). The present J-PARC scheme limits are restated
    (π+ stops 1e-5 per proton, aerogel emission 1.3 % with 52 % formation, ~30 % laser overlap, 73 % ionisation, idealised
    second-stage efficiency ∼ 25 %). μTRISTAN values are imported_related, restated J-PARC values analogous; nothing here
    is an LHμC value.'
