    and the Table 5-implied H-line rate ≈ 3.0e8/s against the text''s ''∼ 1e8 per second'' (test_abe2019_hline_rate_implied_by_table5_vs_quoted_1e8,
    recorded as an internal-consistency observation, not a conflict); plus the Zhang-deck chain cross-check (test_abe2019_vs_zhang_g2_target_chain_consistency).
    Unpinned audit arithmetic lives in the record notes (γ = 3.01, R = p/eB = 333.6 mm, T_c = 7.41 ns, Table 6 quadratic sums
    39.6 and 56.1 ppb, combined 69 ppb). The 73 % ionisation efficiency is a CALCULATION; the 0.52 formation probability is
    quoted without a numbered reference; its origin is Bakule et al. 2013 (SRC_ARXIV_1306_3810, p. 3, MuSR, 0.52 ± 0.01; Abe
    et al. cite Bakule et al. as ref. [29] on p. 8); the conflict id CONF_MUONIUM_FORMATION_FRACTION is named in research/source_registry.yaml
