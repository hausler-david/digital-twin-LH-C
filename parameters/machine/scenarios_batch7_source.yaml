# Scenarios added by the batch-7 G9 extraction (2026-10-28): JPARC-G2-EDM-DESIGN-2019 (J-PARC muon g-2/EDM design, Abe et al. 2019) and
# MUTRISTAN-HYBRID-TARGET-2026 (μTRISTAN hybrid target, Sakaki et al. 2026). Schema: schemas/machine.schema.json. No numbers here: every role
# references a parameter record in parameters/source/jparc_g2_design_chain_abe2019.yaml, parameters/acceleration/jparc_g2_muon_linac_abe2019.yaml
# or parameters/source/hybrid_target_mutristan_sakaki2026.yaml; unknown_roles lists what the papers do not give. Both are related/analogous
# comparators for the LHμC ultra-cold μ+ source, not LHμC scenarios.
scenarios:
- scenario_id: JPARC-G2-EDM-DESIGN-2019
  label: 'J-PARC muon g-2/EDM experiment design (Abe et al. 2019, PTEP 053C02): 1 MW H-line surface muons → aerogel muonium
    → laser ionisation → 212 MeV muon linac → 3 T MRI-type storage solenoid'
  description: 'Design chain of arXiv:1901.03047v2 as the reference analogous technology for the LHμC ultra-cold μ+ source:
    3 GeV, 1 MW RCS protons on a 2 cm graphite target (double pulse 100 ns FWHM, 600 ns apart, 25 Hz); H-line ∼ 1e8 surface
    μ+/s at 27 MeV/c (Δp/p 5 % RMS, focus σ 31 × 14 mm); very-low-density silica aerogel muonium target (formation probability
    0.52, 3.4e-3 thermal muonium per surface muon in the 50 × 200 × 5 mm^3 laser region at ≈ 1.0 µs); 122 nm (80 GHz, 100
    µJ) + 355 nm (440 mJ) 1 ns lasers with a CALCULATED 73 % ionisation efficiency; Soa 5.6 keV → RFQ 0.34 MeV (324 MHz) →
    IH-DTL 4.5 MeV → DAW 40 MeV (1296 MHz, 5.6 MV/m) → DLS 212 MeV (≈ 20 MV/m); 300 MeV/c with 0.04 % RMS momentum spread
    and ε_n 0.33/0.21 π mm mrad; 50 % polarisation; 3 T storage field, 333 mm orbit radius, field index ∼ 1e-4; Table 4 overall
    efficiency 1.3e-5 per initial muon at production; 5.2e12 stored muons and 5.7e11 reconstructed e+ in 2.2e7 s; goals 450
    ppb (stat.) / < 70 ppb (syst.) on a_mu and 1.5e-21 / 0.36e-21 e·cm on the EDM. All values are analogous (J-PARC design),
    the recomputed ones analytical_estimate; nothing here is an LHμC value.'
  machine: JPARC_MUSE
  design_version: 'Abe et al., arXiv:1901.03047v2 (11 Mar 2019) / PTEP 2019, 053C02: Tables 1, 2, 4, 5, 6, Figs 3-7 and §§3-6,
