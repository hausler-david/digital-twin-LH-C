# Scenarios added by the G7_IMCC_REFERENCE addendum extraction (2026-10-28). Schema: schemas/machine.schema.json. No numbers here: every role
# references a parameter record, mostly in parameters/machine/imcc_mr7_collider_reference.yaml, parameters/source/imcc_mr7_proton_driver_target_
# cooling.yaml, parameters/machine/imcc_mr7_magnets_rf_power_infrastructure.yaml and parameters/machine/imcc_ws2026_schulte_parameters.yaml, plus a
# few MR7 records of the acceleration and MDI groups (named in the notes). machine IMCC; status reported for the 10 TeV baseline and
# partially_reported for the 3 TeV stage, which MR7 covers only in a few tables (the values are reported by the IMCC for the IMCC machine; for
# LHμC they are analogues); geometry fidelity G0 (no geometry exists). unknown_roles lists what the sources do not state.
# VERIFIED 2026-10-29 by the G7A_MR7_COLLIDER adversarial verifier (research/_fragments/verify_G7A_MR7_COLLIDER.md): every role resolves to a
# record holding the named quantity; the cooling-output roles now point to the MR7 chain tables (Table 1.2 targets, Table 1.3 estimates) instead
# of the alternative short-rectilinear staging of Table D.13; the decay-only role was renamed because Table A.2 stops after 1000 collider turns;
# the 3 TeV hourglass_factor now points to MR7's general β* = σ_z statement; every unknown role was re-searched in MR7 and the Schulte deck.
scenarios:
- scenario_id: IMCC-MR7-10TEV
  label: IMCC/MuCol 10 TeV muon collider, consolidated baseline (MuCol Milestone Report 7, Table 1.1 / Table A.1 Stage 2)
  description: 'Reference (analogue) muon-collider configuration for the LHμC digital twin: μ+μ− collisions at sqrt(s) = 10 TeV, 1.8e12 muons per bunch, one bunch per beam, 5 Hz, 25
    µm normalised emittance, β* = σ_z = 1.5 mm (σ = 0.9 µm), 14 T arc peak field and an 11.4 km ring, estimated luminosity 18e34 cm^-2 s^-1 (decay-averaged, all targets met, beam-beam
    included), two experiments; proton driver 5 GeV / 2 MW with 5e14 protons per bunch on a graphite target; rectilinear + final cooling to 22.5 µm. The MR7 values are ''ideal design
    specifications that each subsystem aims to achieve'' (targets), with Table 1.3 estimates of what current simulations achieve. Several lattice-level roles (Table 6.1, Section 6,
    Appendix A.1 analytic estimate) belong to the earlier ≈10 km / 16 T lattice and are marked as such. Three roles come from the Schulte workshop deck (collider dipole technology,
    full-power total and the cost-chart marker) and are attributed there.'
  machine: IMCC
  design_version: MuCol Milestone Report No. 7 'Consolidated Parameters' (arXiv:2510.27437v1; document v1.0 Final, 30 Oct 2025), 10 TeV baseline after the ESPPU update (14 T arcs)
  status: reported
