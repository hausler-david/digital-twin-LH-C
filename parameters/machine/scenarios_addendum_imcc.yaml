  validation_level: P0
  notes: 'Verified 2026-10-29 (research/_fragments/verify_G7A_MR7_COLLIDER.md). Role records pinned at P1 by tests/scientific/test_imcc_mr7_reference.py:
    beam_power (2NEf_r), sigma_x_ip / sigma_y_ip (√(β*ε_n/γ)), luminosity_lifetime_turns (γτc/2C), luminosity_analytic (eq. A.9) and integrated_luminosity_per_year;
    the scenario stays P0 because most role records are P0 (docs/validation_plan.md §1 rule 3). Reproduced by verifier arithmetic only (P0): the Table 6.1 geometric
    luminosities (C = 10 km, linearised decay factor, F_HG 0.758), hourglass_factor 0.758, injected_beam_power_per_beam, lorentz_factor, main_ring_average_bending_field
    and decay_epm_power_per_m. Not reproduced, confidence low in the records: energy_loss_per_turn (≈ 27.2 MeV printed; 29.0 MeV for the stated constant 16 T, 25.4
    MeV for 14 T), muon_decay_rate_per_m (1.8e9 /m/s needs C = 10 km, its own column says 11.4 km) and cooling_output_emittance_longitudinal (22.9 eV ms, while MR7
    itself states "64 mm = 0.0225 eVs" for the same target). Design iterations coexist and are not averaged: main_ring_circumference 11.4 km (14 T; Tables 1.1, A.1,
    1.2, 12.2) vs main_ring_circumference_16t_lattice ≈ 10 km (Table 6.1, Section 6 with B̄ ≈ 10.48 T); the geometric luminosities, the A.1 analytic estimate (B_avg 10.5 T
    ↔ C = 9.98 km), main_ring_dipole_field_lattice, energy_loss_per_turn and rf_voltage belong to the ≈10 km / 16 T lattice; Tables A.2, 11.3, K.3 and M.1 use 10 000 m.
    Cross-source conflicts (not averaged; registered 2026-10-29 as CONF_IMCC_LUMINOSITY_MR7_VS_WS2026, CONF_IMCC_MUON_CHAIN_SNAPSHOTS and
    CONF_IMCC_COLLIDER_CIRCUMFERENCE): average_luminosity 18e34 (MR7) vs L/IP 17.5e34 in the Schulte deck (slides 3, 7, 28, 38); target μ−/bunch after
    the pre-accelerator 3.6e12 (MR7 Table 1.2) vs 4.0e12, and estimated 2.5e12 vs "Achieved" 2.8e12, at the 10 TeV collider 1.4e12 vs 1.5e12 (Schulte slide 8).
    average_luminosity is the IMCC "estimated luminosity" (decay-averaged with one bunch per beam, all targets reached, beam-beam included); the instantaneous peak is
    not tabulated. MR7 states no crossing angle (the A.1 analytic estimate assumes "No crossing angle"), collision rate or revolution period (both derivable from C,
    not printed), no polarisation, no beam-beam tune shift (only "the disruption parameter is of the order of 1"), no achieved energy acceptance (Schulte slide 18:
    the lattice reaches the target beta-functions "but not yet full target energy acceptance"), and explicitly no target "operation temperature, mechanical response
    and life-time" (App. C.1). The cooling-output roles point to the Table 1.2 targets and the Table 1.3 estimates (22.5 µm; 7.7 eV ms, long-rectilinear option, the
    one Table 1.3 uses); the short-rectilinear Table D.13 output (0.0224 mm, 42.68 mm) is an alternative staging and is no longer mapped.
    decay_only_cumulative_transmission_1000_collider_turns is the Table A.2 decay-only cumulative after 1000 turns of a 10 000 m ring (11 %), not the end of the
    store. booster_injection_energy, collider_injection_energy and booster_survival point to the acceleration group''s MR7 Table 5.1 records, the nozzle roles to the
    MDI group''s MR7 records, momentum_compaction (0) to the impedance-model Table K.3 (C = 10 000 m), wall_plug_power and cost_central to Schulte slide 21 (10 TeV
    column of the full-power table; red marker of the "10 TeV Green Field" cost bar, a figure read). The full-power table names no site for its 10 TeV
    column (probably the green-field design, verify_G7D_SCHULTE_DECK.md); the cost_central record is an analytical_estimate (axis read, research/source_quality_policy.md
    §5 rule 3) at confidence low. Analogue configuration: none of these values is an LHμC value.'
- scenario_id: IMCC-MR7-3TEV
  label: IMCC/MuCol 3 TeV first-stage muon collider (MuCol Milestone Report 7, Table A.1 Stage 1)
  description: 'Reference (analogue) first-stage configuration: sqrt(s) = 3 TeV, 2.2e12 muons per bunch, one bunch per beam, 5 Hz, 25 µm, β* = σ_z = 5 mm (σ = 3 µm), 11 T arcs (Nb3Sn,
    40 mm shielding for LTS), 4.5 km ring, estimated luminosity 2.1e34 cm^-2 s^-1 and 1 ab^-1 target, same 5 GeV / 5e14 proton driver. MR7 lists this stage only in Table A.1, Table 12.2,
    the 3 TeV collider rows of Tables 1.2/1.3, the Table 6.2 caption and one Appendix A.1 sentence (''this report only considers the final product''); the lattice-level quantities
    of Table 6.1 exist only for 10 TeV.'
