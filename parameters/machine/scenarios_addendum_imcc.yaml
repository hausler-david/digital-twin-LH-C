  notes: 'Verified 2026-10-29 (research/_fragments/verify_G7A_MR7_COLLIDER.md). Pinned at P1 by tests/scientific/test_imcc_mr7_reference.py: beam_power 5.3 MW,
    sigma_x_ip / sigma_y_ip 3 µm, luminosity_lifetime_turns 1039 and hourglass_factor 0.76; the scenario stays P0 (minimum over its role records). Reproduced by
    verifier arithmetic only (P0): muon_decay_rate_per_m 4.9e9 /m/s (2Nf_r/C with C = 4.5 km) and decay_epm_power_per_m 0.411 kW/m (mean e± energy fraction 7/20,
    which MR7 does not state). hourglass_factor points to MR7''s general statement ("a factor 0.76 for round beams with the beta-function and the rms bunch length
    being equal"); Table A.1 Stage 1 has β* = σ_z = 5 mm, so it applies, but MR7 prints no 3 TeV-specific value. Conflicts preserved, not averaged (CONF_IMCC_LUMINOSITY_MR7_VS_WS2026,
    CONF_IMCC_MUON_CHAIN_SNAPSHOTS): MR7 Table A.1
    estimated luminosity 2.1e34 vs Schulte deck L/IP 1.8e34 (slides 3, 7, 28, 38); Schulte slide 8 gives "Achieved" 1.7e12 μ−/bunch at the 3 TeV collider vs MR7
    Table 1.3''s estimated 1.5e12. MR7 covers this stage only in Table A.1, Table 12.2, the 3 TeV collider rows of Tables 1.2/1.3, the Table 6.2 caption (40 mm
    shielding for low-temperature superconductor at 3 TeV) and Appendix A.1 ("For the 3 TeV parameters the disruption is higher"); the main text "only considers the
    final product" (10 TeV), hence status partially_reported. Not printed for 3 TeV (unknown_roles): geometric luminosity, energy spread (ε_l/(σ_z/c)/E gives 0.1 %,
    derivable but not printed), L*, energy loss per turn, RF voltage, integrated luminosity per year (Schulte gives only an accumulation time of 2+2.8 years for 1
    ab^-1 with two IPs), revolution period and collision rate (derivable from C, not printed), polarisation, beam-beam tune shift, wall-plug power and cost (Schulte
    slides 20-21 give only the 3.2 TeV CERN-site variant, a different configuration, not mapped). collider_dipole_technology (Nb3Sn) is from the Schulte deck slide 7;
    MR7 Appendix H states Nb3Sn is "suitable for ∼ 3 TeV machines". Analogue configuration: none of these values is an LHμC value.'
