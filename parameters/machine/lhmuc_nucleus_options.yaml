# Machine, source, acceleration and IR parameters extracted from SRC_WS1681458_DAGLI_NUCLEUS (Kraków workshop deck 'LHμC: Nucleus Options',
# Canbay/Dagli/Karaca/Kaya/Ketenoglu/Sultansoy/Zimmermann, uploaded PDF LHuC_Nucleus_Options.pdf, 16 pages). Schema: schemas/provenance.schema.json.
# Scenario ids: LHMUC-NUCL-MU-PB, LHMUC-NUCL-MU-XE, LHMUC-NUCL-MU-O, LHMUC-NUCL-MU-NE (parameters/machine/scenarios_nucleus.yaml).
# Status rules: reported_lhmuc for values the deck states for the LHμC nucleus options; imported_related where the deck itself imports
# (μTRISTAN optics, LHeC ERL booster, μTRISTAN/μLHC chain); derived_lhmuc records carry a derivation naming the input ids.
# In-deck conflict preserved: booster ramp time 'about 1 ms' (p.5) vs '≈ 1.4 ms' (p.6).
# Transcription convention for quotations: superscripts/subscripts of the slides are written in plain text
# (10^10, cm^-2 s^-1, beta*_mu, xi_A); table rows are quoted as 'Row label [unit] v_Pb v_Xe v_O v_Ne' in the
# column order Pb, Xe, O, Ne of the slide; the applicability explanation names the column used.
