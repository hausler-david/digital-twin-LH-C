# Muonium emission from laser-ablated silica aerogel extracted from SRC_ARXIV_1407_8248 (G.A. Beer et al., 'Enhancement of
# muonium emission rate from silica aerogel with a laser ablated surface', arXiv:1407.8248v1 [physics.ins-det], 31 Jul 2014;
# PTEP 2014 (9) 091C01 as cited by later papers, journal version not seen; 8 pp., PEER_REVIEWED, uploaded in batch 10,
# 2026-10-29, group G16_BEER2014). Records tagged _BEER2014; no scenario (scenario: null).
# Scope (all 8 pages): p. 1 abstract and goal; p. 2 J-PARC context (design intensities, 300 MeV/c ring), the restated ref. [7]
# results (Bakule et al. 2013 = SRC_ARXIV_1306_3810), diffusion distance, stopping extent, the ~100 µm structure motivation and
# footnote 1; p. 3 every fabrication number (laser, pattern, pitches, depth, thickness, density, diameter, mass loss) and the
# one-sided ablation; pp. 3-5 and Fig. 2 the TRIUMF M15 set-up, regions, field and the printed diffusion-length expression;
# Table 1 (every cell, statistical σ; row 'Flat (Ref. [7])' restated from Bakule 2013); p. 5 systematics and statements;
# pp. 5-6 the J-PARC projection; explicit unknowns (value null) for quantities the paper does not give but later papers
# attribute to it (formation fraction, D, T) or that a model of the measurement needs (window, ionisation inputs). The p. 1
# g−2 discrepancy (~3.5 σ), the E821 magic momentum (in the notes of the 300 MeV/c record) and the reference list are background.
# Status: 'analogous' for every value the paper states (J-PARC g−2/EDM / μTRISTAN target technology relevant to the LHμC
# ultra-cold source chain, not an LHμC value; no record is reported_lhmuc, derived_lhmuc or analytical_estimate); values
# restated from ref. [7] keep 'analogous' and name the original reference in applicability.explanation; 'unknown' (value null,
# confidence none) where the paper gives no value. Arithmetic done during extraction appears only in notes or validation.notes,
# marked 'audit arithmetic' or 'candidate check'; it creates no value.
# Quotations are verbatim from the page images; '^' marks a printed superscript and '_' a subscript, '[...]' an omission,
# '[p. N]' a page change; minus signs are U+2212 and µ is U+00B5 as printed; line-break hyphenation is joined. The arXiv v1 page
# header carries the PTEP template placeholders ('Prog. Theor. Exp. Phys. 2013, 00000', 'DOI: 10.1093/ptep/0000000000',
# '© The Author(s) 2012'), which are not used. Table 1 yields are printed per 10^3 muon stops and stored per muon stop. No curve
# is digitised from Fig. 3; Fig. 1 and Fig. 2 are used only for captions and labels.
# Validation: P1 only where tests/scientific/test_batch10_documents.py checks the arithmetic:
#   test_beer2014_enhancement_at_least_eightfold, test_beer2014_flat_sample_vs_bakule2013,
