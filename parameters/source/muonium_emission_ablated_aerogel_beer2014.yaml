      quotation: The probability that a muonium atom reaches the surface of the aerogel target layer and is emitted into vacuum depends
        on the location at which the muonium is formed inside the layer; the nearer the muonium atom is to the surface at the beginning
        of its motion in the silica aerogel, the more likely it is to be emitted from the surface. Simple planar diffusion models of
        the motion predict that this probability falls exponentially with initial distance from the surface for a decaying particle.
        The exponential has a mean distance or planar diffusion length l_d = (Dτ)^{−1/2}, where D is the diffusion parameter and τ is
        the mean lifetime. In practice, the diffusion length is small compared to both the thickness of the target and the range spread
        of muons stopping in the target.
