# IMCC design values reproduced on the slides -> analogous, citing the originals in applicability.explanation (Zhu et al. PRAB 28
# (2025) 041003 for the rectilinear A1-A4 tables; Bowring et al. PRAB 23 072001 (2020) for the RF breakdown table; the IMCC
# performance table is reproduced without a citation on the slide). Audit arithmetic -> analytical_estimate with derivation.
# Page numbers are PDF pages (= slide numbers). Tables were transcribed from the rendered PDF pages.
# Generated from a scripted transcription (scratchpad gen/gen_rogers.py); this YAML file is the single source of truth.
