# Target for Ultraslow-Muon Production in μTRISTAN', arXiv:2605.25580v1, 25 May 2026, 11 pp., ANALOGOUS_TECHNOLOGY category; uploaded in
# batch 7, 2026-10-28, group G9). Records tagged _SAKAKI2026, scenario MUTRISTAN-HYBRID-TARGET-2026. Status 'imported_related' for values
# the paper gives for its own (μTRISTAN) hybrid target, 'analogous' for present-scheme J-PARC values it restates (with the paper's own
# citation named in applicability.explanation), 'unknown' (value null) for η_conv, extraction efficiency, extracted rate and initial
# emittance, which the paper explicitly leaves unquantified. All 11 pages were read as page images; Table I cells N_layers = 500 and
# η_REMPI = 0.73 and the Eq. (6) coefficient 1.2e12 s^-1 (dropped by the text layer) were read on the images of pp. 6-7. The pre-extraction
# rate is the paper's own number (Eq. 6), not a derivation. Nothing here is an LHμC value. Generated from a scripted transcription
# (scratchpad gen/g9_*.py); this YAML file is the single source of truth.
# Verified 2026-10-29 (research/_fragments/verify_G9_JPARC_G2_AND_HYBRID_TARGET.md): Table I records re-labelled to §IV.D; the Eq. (6)
# rate carries uncertainty type order_of_magnitude (the paper calls §IV.D an order-of-magnitude estimate).
