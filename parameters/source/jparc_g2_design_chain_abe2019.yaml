    'around 10%' for dedicated 122 and 355 nm sources (SOURCE_LASER_IONISATION_EFF_PROJECTED_122_355NM_ARITOME2024); Aritome
    et al. define the efficiency relative to all emitted muonium including decay loss, so their numbers are not directly comparable
    with this 73 %. Table 4 lists the same 0.73; Sakaki et al. 2026 adopt it as η_REMPI.
