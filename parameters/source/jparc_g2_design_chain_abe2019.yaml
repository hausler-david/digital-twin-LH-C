# Scope of this file: Table 1 ('Our Experiment' column, every cell), §3 facility and H-line surface muon beam, §4 aerogel muonium target,
# diffusion simulation (Fig. 3, Fig. 4 caption) and ionisation lasers, §6 storage magnet and injection, Table 4 (every cell except the linac
# stages, which live in parameters/acceleration/jparc_g2_muon_linac_abe2019.yaml), p. 20 overall efficiency, Table 5 and Table 6 (every cell).
# Status: 'analogous' for every value the paper states (J-PARC design, not an LHμC value; the paper is a design document, not measured
# performance); 'analytical_estimate' for the recomputed Fig. 4 decomposition, the Table 4 product and the Table 5-implied H-line rate
# (derivations name the input ids; the schema reserves derived_lhmuc for values computed from reported LHμC values). ppb values are stored
# as fractions with the original in notes; e·cm is written 'elementary_charge*centimeter' for pint. Confidence 'high' only for values read
# on the page images (pp. 4, 6-14, 20-21 were read as images). Verbatim quotations; '^' marks a printed superscript.
# Generated from a scripted transcription (scratchpad gen/g9_*.py); this YAML file is the single source of truth.
# Verified 2026-10-29 (research/_fragments/verify_G9_JPARC_G2_AND_HYBRID_TARGET.md): 16 records added from pp. 4, 15 (Table 3), 16 and 17
# (dated 2026-10-29); the three computed records carry confidence 'medium' (not read from the page); §8 section titles corrected.
