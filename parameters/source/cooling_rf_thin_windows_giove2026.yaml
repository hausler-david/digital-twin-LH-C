# INFN thin-window RF cavities for the IMCC ionisation-cooling channel, extracted from SRC_IMCC2026_GIOVE_RF_SYSTEM (Dario Giove,
# INFN, 'RF System', IMCC and MuCol Annual Meeting 2026, CERN, 22-25 June 2026; 23 slides, ANALOGOUS_TECHNOLOGY; uploaded in
# batch 9, 2026-10-28, group G14_GIOVE2026_RF). Records tagged _GIOVE2026; no scenario (scenario: null).
# Relevance: IMCC cooling-channel RF engineering; matters for LHμC only via the hybrid-source option
# (SRC_WS1681458_ROGERS_HYBRID_SOURCE); the baseline laser-ionisation chain does not use it. No record is reported_lhmuc.
# Scope: slide 3 (requirements, SRF excluded, Be foils), 4 (design-parameter list), 5 (apertures, windows, 704 MHz reference),
# 6 (cell table, every cell, plus the two conductivity labels of the sketch), 7 (3-cell aperture table, every cell), 8 (LBNL
# heritage, restated from 'PAC 2001 contributions'), 9-10 (INFN status, topics), 11-12 (beryllium supply chain, aluminium
# alternative), 13 (fixing methods, flatness metrology), 14 (COMEB programme), 15 (parametric study and Be/Al property table,
# every cell), 16 (analysis method), 17 (case label only), 18 (modal design criterion), 19 (mechanical design key points).
# Slides 1-2, 20-23 carry no values (title, outline, CAD views, thanks); the slide-21 drawing scale 'A-A ( 0,12 : 1 )' and the
# clipped title-block text of its text layer are not physical parameters.
# Not digitised (policy): the slide-7 normalised |Ez| profile, the slide-17 deformation colour maps and colour-bar limits, the
# slide-18 first-mode-frequency curves; their missing numbers are explicit unknown records (value null).
# Status: 'analogous' for every value the talk states; LBNL values restated on slide 8 keep 'analogous' and name the original
# ('PAC 2001 contributions') in applicability.explanation; 'unknown' (value null, category unresolved) for the breakdown data,
# the shunt impedance, the LBNL foil pre-tension, the maximum window deformation and the first-mode frequencies.
# Quotations: verbatim from the page images and checked against the pdftotext -layout text layer (generator verify step);
# ' / ' separates consecutive lines, paragraphs or bullets joined in one quotation; '_' marks a printed subscript; '^' a printed
# superscript; '[arrow]' a drawn arrow; table headers wrapped over several lines on the slide are joined. The slides use decimal
# commas in the slide-6/7 tables ('187,8 mm' = 187.8 mm); quotations keep them. The source's spellings ('wee', 'Berillium',
# 'OHFC', 'dumping') are kept in quotations.
# Confidence: high for table cells and body-text values read from the page images; medium for printed figure annotations
# (sketch dimension labels, conductivity labels), for theta_A (angle-like symbol printed with a length unit), for the ambiguous
# '16 cm diameter' and for the 'equal' surface/axis field ratio; none for unknowns.
