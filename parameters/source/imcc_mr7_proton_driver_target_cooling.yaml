# IMCC/MuCol proton driver, pion-production target / front end and ionisation-cooling summary from SRC_ARXIV_2510_27437 (MuCol Milestone
# Report No. 7, arXiv:2510.27437v1). G7_IMCC_REFERENCE addendum extraction, 2026-10-28. All analogous (IMCC reference values for the LHμC
# muon source; not LHμC values). page = PDF page index (printed page = PDF − 11, given in 'section').
# Scope: proton driver Tables 2.1, 2.2, B.1, B.2 every cell and the Appendix B text; target Section 3 text, Tables 3.1 (baseline, with the
# 'Range' column as allowed_range), 3.2 (yields), C.1-C.8 every cell including the C.3 radial build, Appendix C text; cooling Section 4
# text, Table 4.1 every cell, Table D.5 every cell (emittances, stage and cumulative transmission), the Start and output rows of the final-
# cooling performance Tables D.13 (from B-Stage 8) and D.17 (from B-Stage 10), the D.3 text values and the pre-accelerator Table D.21.
# Deliberately NOT extracted (instruction: no per-solenoid / per-RF rows): Tables D.1-D.4 (HFOFO initial cooling), D.6-D.12, D.14-D.16,
# D.18-D.20, H.1/H.2 rows, I.1-I.4. Table 3.2 is printed in '10−2 GeV /p+'; it is stored as cell × 1e-2 per GeV per proton, the reading
# confirmed by Table C.8 ('1/GeV per p+', 0.024 / 0.018) and by the 9 % (μ−) / 12 % (μ+) front-end yields of Table 1.2.
# Validation: every record is P0. The extractor's P1 labels (beam powers N·E·f, 339 MeV/c ↔ 250 MeV, D.5 cumulative products, C.3
# r_e − r_i and layer continuity, 64 mm = 0.0225 eVs, 10 % emittance margin, accumulator injection turns with β = 1) named no test
# and were lowered mechanically on 2026-10-29; the G7B verifier recomputed each check (result in validation.notes). No test under
# tests/ pins a value of this file. Inconsistencies kept as printed (confidence low where MR7 contradicts itself):
# Table C.1 muon window 'Titanium Grade 5' vs the text 'beryllium in proton and muon windows'; Table 4.1 short-rectilinear 14.9 % omits
# the 95 % charge-separation factor applied in the long-rectilinear half (and the 6.4 % after final cooling inherits it); Table 4.1
# re-acceleration 6.4 → 5.8 % vs Table D.21's 86 % (Table 1.3: 5.6 %); Table 4.1 long-rectilinear ε_T 22.5 µm vs Table D.17's 23 µm;
# Table B.2 accumulator turns 4167 identical to the 5 GeV value although 5.0 ms / 300 m gives 5000; D.3.2 'peak magnetic field is
# kept below 42 T' vs Table D.14's −43.4 T.
# The report states that target 'operation temperature, mechanical response and life-time' are not given: they are absent, not zero.
# Generated by scratchpad/g7/gen/run_g7.py; edit the YAML directly for corrections. Adversarially verified record by record
