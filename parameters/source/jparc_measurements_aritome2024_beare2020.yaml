- parameter_id: SOURCE_MUONIUM_FORMATION_FRACTION_BEARE2020
  name: Muonium formation fraction from spin-precession amplitudes, all aerogel targets of the study combined (laser-ablated and
    flat, silica and PMSQ; 1.92 mT)
  symbol: f_Mu
  subsystem: source
  scenario: null
  value: 0.655
  unit: dimensionless
  uncertainty:
    type: gaussian_sigma
    value: 0.018
    unit: dimensionless
    note: ± as printed
  allowed_range: null
  provenance:
    status: analogous
    extraction_method: manual_text_read
    source:
      source_id: SRC_ARXIV_2006_01947
      title: Study of muonium emission from laser-ablated silica aerogel
      author_or_org: J. Beare et al. (TRIUMF, KEK, J-PARC and others)
      url: https://arxiv.org/abs/2006.01947
      date: '2020-09-01'
      version: arXiv:2006.01947v2
      page: 25
      section: 3.4.1 Muonium formation fraction
      table_figure_or_equation: Eq. (4)
      quotation: f_Mu = 2A_Mu / A_0 = 0.655 ± 0.018 . (4) The obtained muonium fraction is larger than the one obtained
        in the past study (0.52 ± 0.01) [14].
    derivation: null
    applicability:
      category: analogous
      scenario: null
      explanation: 'Measured value of Beare et al. (PTEP 2020 123C01) from the µSR data of all aerogel targets combined
        (p.23: ''All the aerogel targets (even those composed of PMSQ instead of silica) yielded the same muonium amplitudes
        ... all such data were combined''; the Fig. 11 caption on p.24 says ''sum of all data on silica aerogel targets''),
        so it is not a value specific to laser-ablated targets; analogous measurement for the LHμC aerogel-based source
        option, not an LHμC value. Abstract: ''determine a muonium formation fraction of (65.5 ± 1.8)%''. All aerogel targets
        (silica and PMSQ) gave the same amplitude within statistics. Conflicts with the 0.52 used by Zhang, Aritome and
        μTRISTAN, which is the Bakule et al. 2013 MuSR value 0.52 ± 0.01 (SRC_ARXIV_1306_3810 p.3; SOURCE_MUONIUM_FORMATION_FRACTION_MUSR_BAKULE2013),
        6.6 sigma apart with both uncertainties (CONF_MUONIUM_FORMATION_FRACTION); ''the discrepancy of the two muonium
        fractions is not understood well''.'
    confidence: medium
    assumption_id: null
  validation:
    level: P1
    methods:
    - 2 x 0.155 / 0.474 = 0.654 reproduces Eq. (4) (audit arithmetic, not pinned). (0.655 - 0.52)/sqrt(0.01^2 + 0.018^2)
      = 6.6 sigma between the Bakule et al. 2013 MuSR value 0.52 +- 0.01 and Beare et al. 2020's 0.655 +- 0.018 (tests/scientific/test_batch9_documents.py::test_bakule2013_formation_fraction_vs_beare2020_combined_significance);
      7.5 sigma with Beare's uncertainty alone (tests/scientific/test_workshop_decks.py::test_muonium_formation_fraction_two_values_are_incompatible).
      Checks the size of the discrepancy; it validates neither measurement.
    check_ids:
    - tests/scientific/test_batch9_documents.py::test_bakule2013_formation_fraction_vs_beare2020_combined_significance
    - tests/scientific/test_workshop_decks.py::test_muonium_formation_fraction_two_values_are_incompatible
    notes: ''
  dependencies:
  - SOURCE_MUONIUM_ASYMMETRY_BEARE2020
  - SOURCE_MAX_ASYMMETRY_A0_BEARE2020
  date_added: '2026-10-28'
  responsible_module: parameters/source
