# Ultra-cold mu+ source and proton-driver parameters extracted from SRC_ARXIV_2610_35154 (arXiv:2610.35154v1, DIS2026 proceedings).
# Fig. 2 labels (p.3) were read from the rendered PDF page: "proton linac (500 MeV)", "RCS (3 GeV)", "RF", "target", "laser",
# "linac 1", "linac 2", "muon ring", "beam dump", "IP", "LHC beam".
parameters:
  - parameter_id: SOURCE_MU_YIELD_FRACTION_OF_MUTRISTAN_DIS2026
    name: Assumed mu+ yield relative to the muTRISTAN proposal
    symbol: Y_mu / Y_muTRISTAN
    subsystem: source
    scenario: LHMUC-DIS2026-1TEV
    value: 0.05
    unit: dimensionless
    uncertainty: {type: not_stated, note: "described by the source as a 'rather conservative' assumption"}
    allowed_range: null
    provenance:
      status: reported_lhmuc
      extraction_method: manual_text_read
      source: {source_id: SRC_ARXIV_2610_35154, title: "LHμC: A high energy, high luminosity muon-hadron collider at CERN", author_or_org: "K. Piotrzkowski (HELP4CERN Study Group)", url: "https://arxiv.org/abs/2610.35154", date: "2026-10-26", version: "v1", page: 4, section: "2. LHμC Concept", table_figure_or_equation: "text beside Table 1", quotation: "Assuming rather conservatively the μ+ yields at a level of 5% of the ones in the μTRISTAN proposal, a 4 MW proton driver, and the possibility of an increased population of LHC proton bunches due to their smaller number (hence, lower collision rate) [24], the performance of LHμC is very compelling, as shown alongside."}
      derivation: null
      applicability: {category: direct, scenario: LHMUC-DIS2026-1TEV, explanation: "Design assumption underlying Table 1 (muon bunch population 0.07e11). The absolute μTRISTAN yield it refers to is not restated in this source; see the μLHC paper (SRC_ARXIV_2506_15445) for the μTRISTAN chain numbers."}
      confidence: high
      assumption_id: null
    validation: {level: P0, methods: ["dimensional check"], check_ids: [], notes: "Cannot be cross-checked without the μTRISTAN yield and the proton-driver duty assumptions, which this source does not give."}
    dependencies: []
    date_added: "2026-10-28"
    responsible_module: parameters/source
    notes: "The factor 0.05 is a ratio of yields, not of bunch populations; the mapping to 7.0e9 muons/bunch is not shown in the source."

