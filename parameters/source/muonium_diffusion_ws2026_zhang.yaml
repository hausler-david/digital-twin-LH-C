      date: '2026-09-24'
      version: slides (23 pp.)
      page: 6
      section: Muonium diffusion model — Inside single-layer aerogel
      table_figure_or_equation: null
      quotation: Muonium does a 3D random walk with Maxwell velocity ... Each diffusion step length l is sampled from the
        exponential distribution of displacement ... The product of mean free path lmfp and v̄ is proportional to the diffusion
        constant ... T, D are the two fitting paras in the model
    derivation: null
    applicability:
      category: analogous
      scenario: null
      explanation: 'J-PARC/TRIUMF measurement or model restated on a PRIMARY_LHMUC deck; the value belongs to the J-PARC
        g-2/EDM ultra-slow-muon source (silica-aerogel target) and is analogous technology for the LHμC ultra-cold μ+ source,
        not an LHμC design value. Model definition: v̄ = sqrt(8kT/(π m_Mu)), P(l)dl = (1/l_mfp) exp(-l/l_mfp) dl, D = π
        l_mfp v̄ / 12 (slide formulas).'
    confidence: medium
