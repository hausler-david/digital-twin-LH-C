# Muonium emission from silica aerogel extracted from SRC_ARXIV_1306_3810 (P. Bakule et al., 'Measurement of muonium emission
# from silica aerogel', arXiv:1306.3810v1, 17 Jun 2013 / PTEP 2013, 103C01; 11 pp., PEER_REVIEWED, uploaded in batch 9,
# 2026-10-28, group G12_BAKULE2013). Records tagged _BAKULE2013; no scenario (scenario: null).
# Scope: §2 samples (four hydrophobic Chiba aerogels), §3.1 MuSR (formation fractions, relaxation, field, Fig. 1 oxygen
# concentrations), §3.2.1 TRIUMF M15 set-up, §3.2.2 analysis cuts, regions and diffusion models, Table 1 (every cell), the p. 9
# density scaling (Fig. 5 text), Table 2 (every cell), §4 J-PARC scaling (eq. 1), emission depth and the ~100 µm structure
# proposal; §5 statements appear in notes. The §1 introduction (g−2 discrepancy, 1.4 MHz at 10^−4 T) is background, not extracted.
# Status: 'analogous' for every value the paper states (J-PARC/TRIUMF muonium-emission measurement relevant to the LHμC
# ultra-cold source chain, not an LHμC value; no record is reported_lhmuc); values restated from refs [13] and [20] keep
# 'analogous' and name the original reference in applicability.explanation; 'unknown' (value null) where the paper explicitly
# gives no value; 'analytical_estimate' for the one value computed here (its derivation names the input ids).
# Quotations are verbatim from the page images (all 11 pages read as images); '^' marks a printed superscript and '_' a printed
# subscript, '^{+a}_{−b}' an asymmetric uncertainty, '[...]' an omission, '[p. N]' a page change; minus signs are U+2212 as
# printed. Table 1 yields are printed per 1000 muon stops and stored per stopped muon. Fig. 1 concentrations printed
# 'mol cm^−3' are stored as molecule/centimeter**3 (reason in the records' notes). No curve is digitised from Figs. 1, 3, 4 or 5.
# Validation: P1 only where tests/scientific/test_batch9_documents.py reproduces arithmetic (four test_bakule2013_* tests).
# Generated from a scripted transcription (scratchpad gen/g12_bakule2013.py); this YAML file is the single source of truth.
# Adversarially verified (G12_BAKULE2013 verifier, 2026-10-28): every record re-read against the page images; corrections and residual
# doubts in research/_fragments/verify_G12_BAKULE2013.md.
