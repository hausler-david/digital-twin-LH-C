    methods:
    - c τ_μ = 2.998e8 m/s × 2.197e-6 s = 658.6 m ≈ 659 m; tests/scientific/test_workshop_decks.py::test_turns_per_lifetime_dudko_formula
    check_ids: []
    notes: ''
