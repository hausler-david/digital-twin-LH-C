  symbol: n_turns
  subsystem: physics_programme
  scenario: null
  value: n_turns ≃ γ cτ_μ / C, with γ = E_μ/(m_μ c²), cτ_μ = 659 m and C the circumference
  unit: dimensionless
  uncertainty:
