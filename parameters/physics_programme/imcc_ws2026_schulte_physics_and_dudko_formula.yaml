# Physics-reach records of D. Schulte, 'Muon Collider' (IMCC overview), workshop 'Ultra-cold muons for the LHC', AGH Kraków, Sept 2026
# (SRC_WS1681458_SCHULTE_IMCC, CONFERENCE_PROCEEDING -> status analogous). Scope = headline physics-reach statements only: programme goals
# (p.3), NAS physics-case quotations (p.5), luminosity scaling and its stated μp advantage (p.6), BIB challenge, 'can do the physics'
# conclusions and the IP/nozzle BIB-reduction callout (pp.10–11), and the reach-defining rows of the Key Parameters table (p.28: √s, L/IP,
# Int L, accumulation time for six site variants; 2 IPs; ramp-up 5/25/70 %). Pages = PDF pages = slide numbers.
# NOT recorded here (outside G6 scope, reported to the lead): machine rows C, B_dipole and dipole technology (pp.7, 28, 38), N and f_r
# (pp.7, 38), the p.11 BIB illustration energies (5 TeV μ+ decay example), programme-status items (p.3 roadmap 75 %, ESPPU back-up
# document 406 p / 450 signatories).
# The p.38 backup table prints 'Int L | Ab-1 | 2.2 | 1.8' where p.3/p.28 print 1 / 10 ab-1: recorded as printed with confidence low and
# category unresolved (conflict candidate; the numbers equal the bunch-population row N = 2.2 / 1.8 × 10^12 of p.7).
# Plus one categorical record from L. V. Dudko, arXiv:2607.16904v2 (SECONDARY_SOURCE): the n_turns = γ c τ / C relation with c τ = 659 m
# (p.14, eq. 2), P1 via tests/scientific/test_workshop_decks.py; Table 1 of that review is deliberately NOT extracted.
# Resume review 2026-10-29: all records re-checked against the slide images; 21 out-of-scope records removed, BIB applicability corrected,
# 2 records added (p.6 luminosity-scaling statement, p.11 IP/nozzle callout).
