  allowed_range: null
  provenance:
    status: analogous
    extraction_method: manual_text_read
    source:
      source_id: SRC_ARXIV_2607_16904
      title: 'The muon collider: expected physics, technological challenges, and the prospects for reusing the 21 km UNK tunnel'
      author_or_org: L. V. Dudko (SINP, Lomonosov Moscow State University)
      url: https://arxiv.org/abs/2607.16904
      date: '2026-10-20'
      version: arXiv:2607.16904v2 [hep-ph]; page = PDF page = printed page
      page: 14
      section: '3.5 The collider ring: turns, luminosity, and neutrino flux'
      table_figure_or_equation: Eq. (2)
      quotation: nturns ≃ γ cτµ / C, (2) where γ = Eµ /mµ c2 is the beam Lorentz factor, cτµ = 659 m, and C is the circumference.
    derivation: null
    applicability:
