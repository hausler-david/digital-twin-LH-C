  notes: 'Eq. (3) of the same page: ''nturns ≃ 0.2998 B̄ cτµ / (2π mµ c² [GeV]) ≈ 297 B̄ [T]'' (turns depend only on the circumference-averaged bending
    field); luminosity lifetime ''≈ 149 B̄[T] turns''. Worked example used by the lead''s test (illustrative 3 km ring, not an LHμC parameter): γ(1 TeV)
    × 658.6 m / 3000 m ≈ 2080 turns. Table 1 of the review (IMCC values restated) is deliberately not extracted.'
