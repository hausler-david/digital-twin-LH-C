# Cheung & Wang 2021, 'Physics potential of a muon-proton collider', arXiv:2101.10476v2 [hep-ph], 10 May 2021, 7 pp. (SRC_ARXIV_2101_10476,
# PEER_REVIEWED; published as Phys. Rev. D 103, 116009 per the source registry), uploaded in batch 9 (2026-10-28), extraction group
# G13_CHEUNG2021. Status imported_related with applicability screening_only for every value the paper states, including the comparator
# values it restates from its refs. [13], [24], [32], [37], [42], [50]-[53], [67]-[69], [70]-[73] (these keep the document's status and name
# the original reference in applicability.explanation); analytical_estimate (with derivation) for the two per-year integrated luminosities
# computed in this extraction; unknown (value null) for inputs the paper uses but does not print (Br(h -> bb), Br(Z -> bb), m_c) and for the
# mu+ p cross section that LHmuC would need. NO record is reported_lhmuc: the paper is not a PRIMARY_LHMUC source.
# THE PAPER STUDIES NEGATIVE MUONS (Table I header E_mu-; every process is p mu- -> ...). LHmuC collides mu+ p. The mu p-1 beam energies
# (7 TeV x 1 TeV) coincide with LHMUC-DIS2026-1TEV, but no cross section, efficiency, reach or luminosity here may be substituted into an
# LHmuC scenario; the 1e33 / 1e34 cm^-2 s^-1 peak luminosities are the authors' assumptions.
# Scope: all 7 pages read as page images; Tables I-IV re-read at 250-600 dpi. Every cell of Tables I, II, III and IV is a record. Table II's
# 'LHC-14' cell '4.233 [42]' is one cell printed across the WW and ZZ rows (one record). Fig. 1 and Fig. 2 curves are NOT digitised; only the
# Fig. 2 legend thresholds printed on the page are recorded (manual_figure_read). Table IV's signal column is the normalised quantity
# sigma_sig x (Lambda^2/(100 TeV^2 C_T^muc))^2, as printed in its header.
# Quotations: words verbatim from the page (including the paper's typos 'where performed', 'the the'); mathematics transcribed in linear
# form from the page image (superscripts '^', subscripts '_' or run-in as in the text layer; 'µ' and '∆' as in the text layer; λ′ for the
# primed RPV couplings, which the text layer renders as 'λ0'). Table cells are given as 'TABLE N caption. Header: ... Row ..., column ...:
# cell', text passages as "p. N text: '...'", with ' || ' between pieces and ' … ' for an omission. page = PDF page = printed page.
# Validation: P1 only where a registered test in tests/scientific/test_batch9_documents.py reproduces the value
# (test_cheung2021_table1_centre_of_mass_energies, test_cheung2021_integrated_luminosity_from_assumed_peak,
# test_cheung2021_hbb_coupling_precision, test_cheung2021_higgs_yields, test_cheung2021_cut_flow_reproduces_delta_sigma_band - the last as a
# band only, because its branching ratios are test inputs, not paper values). Everything else is P0; audit arithmetic that is not a registered
# test (e.g. the Table IV |Delta a_mu| reproduction with an external m_c) is written in validation.notes and does not raise the level.
# Scenarios CHEUNG2021-MUP1-MUMINUS-P and CHEUNG2021-MUP2-MUMINUS-P: parameters/machine/scenarios_batch9_cheung.yaml.
# Generated from a scripted transcription (session scratchpad g13/gen_cheung*.py, with an automatic in-order word check of every quotation
# against the PDF text layer); this YAML file is the single source of truth.
# Verifier pass G13 (2026-10-28, research/_fragments/verify_G13_CHEUNG2021.md): every record re-checked against the page images; 'W W'
# (text-layer artefact) restored to the printed 'WW' in 14 quotation spans; the two per-year luminosity records lowered from P1 to P0 (the cited
# test asserts only the 10-year product); attributions of refs. [42] and [69] and the Table IV background note reworded; one missed
# statement added (PHYS_G2_SMEFT_VALIDITY_SCALE_CHEUNG2021, Λ ≫ 1 TeV, p. 4). No value, unit, page or status was refuted.
