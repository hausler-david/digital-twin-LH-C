# Physics-section parameter records of Acosta et al., 'The Potential of a TeV-Scale Muon-Ion Collider', arXiv:2203.06258v3 (SRC_ARXIV_2203_06258,
# RELATED_MACHINE -> status imported_related; HERA/EIC/μ+μ−/HL-LHC and literature comparator values -> analogous; LHeC and FCC-eh values ->
# imported_related (related CERN electron-hadron designs, refs. [3], [4]); audit sums/products -> analytical_estimate with a derivation).
# Scope: introduction reach comparators, Sections 4.1–4.3: kinematic reach (Figs. 5–7), DIS cross sections (Tables 3–4, Figs. 11–12), SM production
# (Tables 5–11), Higgs production (Tables 12–15, Fig. 21) and the H -> bb sensitivity study, LQ study set-up. Machine parameters (Tables 1–2) are in
# parameters/machine/muic_acosta2022_machine.yaml (scenarios MUIC-ACOSTA2022-*); the Delphes card / Appendix A kinematics belong to the detector group.
# NAME COLLISION: the paper's 'LHmuC' (1.5 TeV μ− beam of an IMCC-type 3 TeV μ+μ− collider on a 7 TeV LHC ring) is NOT the HELP4CERN LHμC (ultra-cold μ+).
# Table cells are transcribed as 'Table N | row | column: cell' with the cell string exactly as printed; MadGraph uncertainties as relative_fraction
# {lower: −scale_down, upper: +scale_up} with the PDF⊕αs uncertainty in the note. All six E_μ × E_p rows of Tables 5–15 are recorded; the
# 1.5 × 13.5/20/50 rows have no machine design (scenario null, screening_only). '–' cells of Tables 3–4 are not recorded (no value given).
# PAGE NUMBERS ARE PDF PAGES (printed page = PDF page − 1); note that parameters/machine/muic_acosta2022_machine.yaml cites printed pages.
# P1 (arithmetic) checks: Table 12/13 CC + NC + tH = total, 19.4 pb = 1.80 + 8.93 + 8.69, 17 800 = 76.7 fb × 400 fb⁻¹ × 0.58, factors 4 and 13,
# 6.5/1.5 = 4.3, 197^(1/3) ≈ 6, 2.1e4 W -> ℓν per flavour and 1900/2500 H -> ττ/gg yields (with Standard-Model branching fractions that are
# external to the paper, named in each method), √s of the comparators. Bracket or rounding consistency alone is P0 with the arithmetic in notes.
# Resume review 2026-10-29: all 250 table cells re-transcribed independently from 300-dpi page images and compared (values, scale and PDF
# uncertainties all agree; 16 quotations had lost trailing zeros and were restored); Fig. 5 legend corrected (HERA e− not e±); 'LO' claims and
# printed-page references in notes corrected; 3 P1 labels downgraded; LQ benchmark masses split into one record per figure (3 replace 1);
# 10 further records added (reach comparators of the introduction, spin-programme inputs, pseudo-data and jet-study settings, process list, H -> cc̄).
# Verifier pass (G6_PHYSICS adversarial verification, 2026-10-29): all 250 table cells re-transcribed a second time, independently, from
# 300/400-dpi renderings (values, scale and PDF⊕αs uncertainties, encodings: no discrepancy); every text quotation re-read on its page;
# fixes: μ+p cells (Tables 3, 4, 13) were described as μ− configurations, ref. [3] is arXiv:2007.14491 (not the LHeC CDR), a Fig. 5
# caption phrase was mis-attributed to the p.6 statement, two section strings cited printed pages. See research/_fragments/verify_G6_PHYSICS.md.
