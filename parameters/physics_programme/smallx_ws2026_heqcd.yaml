# Parameter records extracted from SRC_WS1681458_HEQCD_SMALLX ('High energy QCD at LHμC', AGH University Kraków, workshop 'Ultra-cold muons
# for the LHC', 24–26 Sept 2026; PRIMARY_LHMUC; speaker not named on the slides). Pages cited are PDF page numbers (= slide numbers).
# Status rules: LHμC-specific statements -> reported_lhmuc; theory-model inputs restated from the literature (GBW saturation model, BFKL λ,
# NNPDF3.1sx / Bonvini / Bertone plots, CGC kT-factorisation condition) -> analogous with the original named in applicability.explanation;
# LHeC legend energies -> imported_related; EIC comparators -> analogous. Figure reads (manual_figure_read) carry confidence medium when a
# number is read off an axis or a curve; curve values appear only in notes, flagged 'approximate figure read'.
# P1 (arithmetic) checks: x_min = Q²/(y s) for the x_Bj ≲ 1e-7 bound; s ratios for the LHeC and FCC-eh comparisons; √s = 2√(E_μ E_p)
# for the 3742 GeV (0.5 TeV × 7 TeV) and 5.3 TeV (1 TeV × 7 TeV) panel labels. The 3.3 TeV label has no stated beam energies (P0, note).
# Resume review 2026-10-29: every record re-checked against the slide images; corrections: collider-marker positions on p.14 (one decade
# too low in the draft), EIC rapidity windows (lab vs starred), P1 claims without an arithmetic reproduction downgraded to P0,
# scenario fields restricted to scenario ids, one record added (p.9 kT-factorisation condition).
# Verifier pass (G6_PHYSICS adversarial verification, 2026-10-29): every record re-checked against the slide images and text layer; marker
# positions on pp. 14/16 re-measured in pixels (HERA, EIC were 0.2 decade off), unsupported attributions removed ('LHeC CDR', 'Kotko',
# 'muon-going hemisphere', 'deck's own' F2 comparison), trijet explanations fixed, one p.17 record added. See research/_fragments/verify_G6_PHYSICS.md.
