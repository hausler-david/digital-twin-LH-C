- parameter_id: PROTON_BUNCH_MERGING_SCALING_RELATION_WS2026_ZIMMERMANN
  name: Scaling of the longitudinal phase-space product when fewer, more intense bunches are made (rule of thumb)
  symbol: sigma_delta*sigma_z
  subsystem: proton_beam
  scenario: null
  value: sigma_delta * sigma_z ≈ 2 * n_b,0 * sigma_delta,0 * sigma_z,0
  unit: dimensionless
  uncertainty:
    type: not_stated
  allowed_range: null
  provenance:
    status: reported_lhmuc
    extraction_method: manual_text_read
    source:
      source_id: SRC_WS1681458_ZIMMERMANN_SPS_LHC
      title: Potential possibilities of modifying SPS/LHC
      author_or_org: Frank Zimmermann (CERN)
      url: https://indico.cern.ch/event/1681458/contributions/7263328/
      date: '2026-09-24'
      version: slides (14 pages), workshop 'Ultra-cold muons for the LHC', AGH Kraków, 24-26 Sept 2026
      page: 14
      section: Conclusions
      table_figure_or_equation: null
      quotation: Higher intensity is accompanied by longer bunches and/or larger energy spread – Roughly speaking σδ σz ≈ 2 n_b,0 σδ,0 σz,0
    derivation: 'Categorical/derivation record: with n_b,0 nominal bunches merged into one, σδ σz ≈ 2 n_b,0 σδ,0 σz,0. Check against LHC Project Report 627 Table 1 (slide 9): super-bunch
      5.8e-4 x 7500 cm = 4.35 cm vs 2 x 2808 x 1.1e-4 x 7.7 cm = 4.76 cm (ratio 0.91).'
    applicability:
      category: direct
      scenario: null
      explanation: 'Zimmermann''s conclusion for the LHμC request (fewer, more intense LHC bunches): the merged bunch''s energy-spread x length product is roughly twice the sum over
        the n_b,0 nominal bunches merged (σδ,0, σz,0 nominal values). A rule of thumb (''Roughly speaking''), not a design formula.'
    confidence: medium
    assumption_id: null
  validation:
    level: P0
    methods:
    - 'LHC Project Report 627 super-bunch column: σδ σz = 4.35 cm vs 2 n_b,0 σδ,0 σz,0 = 4.76 cm, ratio 0.91, consistent with ''roughly'' (inputs PROTON_LHC_PR627_ENERGY_SPREAD_UPGRADE_SUPERBUNCH_WS2026_ZIMMERMANN,
      PROTON_LHC_PR627_RMS_BUNCH_LENGTH_UPGRADE_SUPERBUNCH_WS2026_ZIMMERMANN, nominal column; extraction script)'
    - 'verifier: Damerau-Garoby Table 2 (slide 12), 16 bunches merged into one: ε_L(final) = 28.5 eVs vs 2 x 16 x ε_L,0 = 25.6 eVs (ε_L,0 = 0.8 eVs at SPS ejection) or 32 eVs (ε_L,0
      = 1.0 eVs at LHC injection), i.e. ratio 1.8-2.2 per merged bunch vs the rule''s 2 (ε_L ∝ σ_δ σ_z at fixed energy)'
    check_ids: []
    notes: 'Caveat on the Report 627 check: the super-bunch carries 1.0 A against 0.56 A for the 2808 nominal bunches, i.e. the charge of ≈ 5000 nominal bunches; with n_b,0 = 5014 the
      ratio would be 0.51 instead of 0.91. The rule is read with n_b,0 = number of nominal bunches merged, as the slide''s notation suggests; the slide does not define n_b,0.'
  dependencies:
  - PROTON_LHC_PR627_ENERGY_SPREAD_UPGRADE_SUPERBUNCH_WS2026_ZIMMERMANN
  - PROTON_LHC_PR627_RMS_BUNCH_LENGTH_UPGRADE_SUPERBUNCH_WS2026_ZIMMERMANN
  - PROTON_LHC_PR627_BUNCHES_NOMINAL_WS2026_ZIMMERMANN
  - PROTON_LHC_PR627_ENERGY_SPREAD_NOMINAL_WS2026_ZIMMERMANN
  - PROTON_LHC_PR627_RMS_BUNCH_LENGTH_NOMINAL_WS2026_ZIMMERMANN
  date_added: '2026-10-28'
  responsible_module: parameters/proton_beam
  notes: 'Bears directly on the LHμC proton bunch population assumptions (22e11 in DIS2026, PROTON_BUNCH_POPULATION_DIS2026; ≈ 7e11 implied by the Forthomme set, PROTON_BUNCH_POPULATION_IMPLIED_WS2026_FORTHOMME):
    a 3-10 x higher population per bunch comes with a correspondingly longer bunch and/or larger energy spread, which enters the hourglass factor and the IP optics. The relation is a
    rule of thumb; no LHμC-specific long-bunch study exists in the uploaded documents.'
