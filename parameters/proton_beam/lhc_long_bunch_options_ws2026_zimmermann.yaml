# analogous (AGS barrier-bucket experiment, KEK super-bunch collider concept). Scenario groups (parameters/machine/scenarios_addendum_machine.yaml):
# LHC-PR627-{NOMINAL,ULTIMATE,UPGRADE-PIWINSKI,UPGRADE-SUPERBUNCH} (LHC Project Report 627 Table 1, four columns), QCD-EXPLORER-EPAC2004 (Schulte &
# Zimmermann Table 1), LHC-DAMERAU-GAROBY-LONGBUNCH-EPAC2004 (Damerau & Garoby Tables 1-2 and RF hardware). CERN-2005-006 Table 3 is a qualitative
