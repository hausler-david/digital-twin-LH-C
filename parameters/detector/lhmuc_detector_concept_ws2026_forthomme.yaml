# slides 16-17 (LHeC baseline, LHμC beam set) are extracted by the IR and machine groups (lhec_ir_ws2026_forthomme.yaml, lhmuc_ws2026_forthomme_beam_set.yaml).
# Status rules: LHμC-concept statements → reported_lhmuc (design options, 'still a WIP'); LHeC detector values → imported_related (not LHμC values);
