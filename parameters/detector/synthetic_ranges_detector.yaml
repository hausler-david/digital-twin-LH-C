# Synthetic screening ranges for the LHmuC detector and nozzle (machine-detector interface).
# status: synthetic (CLAUDE.md 1.4). Every record here is a screening RANGE with an assumption record in
# parameters/assumptions/phase0_assumptions.yaml; 'value' is only the range midpoint (or a representative member of a
# discrete set) so that software has a number to display. None of these numbers is an LHmuC design value.
# Date: 2026-10-28. Author role: assumptions and synthetic-range author (Phase 0 evidence audit).
# Updated 2026-10-29: records whose assumption is superseded_by_evidence (parameters/assumptions/phase0_assumptions.yaml) are
# SYNTHETIC SCAN VARIABLES ONLY; their bands were re-based to bracket every documented option and no scenario slot may point to
# them. Records whose assumption stays synthetic carry updated dependencies and notes; PROTON_BUNCH_LENGTH_RMS_SYN was widened to
# a log-uniform 5-100 cm range (value = geometric midpoint).
parameters:
- parameter_id: DET_NOZZLE_OPENING_ANGLE_SYN
  name: Opening (half) angle of the decay-shielding nozzle on the incoming-muon side (synthetic scan variable; assumption superseded
    by evidence)
  symbol: theta_nozzle
  subsystem: detector
  scenario: null
  value: 7.0
  unit: degree
  uncertainty:
    type: interval
    lower: 2.0
    upper: 12.0
    unit: degree
    note: Synthetic scan band, not a measured uncertainty; see ASM_DET_NOZZLE_OPENING_ANGLE (superseded by evidence on 2026-10-29).
  allowed_range:
    min: 2.0
    max: 12.0
    unit: degree
    basis: synthetic scan band bracketing every documented cone (40, 60, 80, 100 mrad LHmuC study; 10 degree IMCC); see ASM_DET_NOZZLE_OPENING_ANGLE
      (superseded_by_evidence)
  provenance:
    status: synthetic
    extraction_method: assumption_record
    source: null
    derivation: null
    applicability:
      category: screening_only
      scenario: null
      explanation: 'Scan variable only (ASM_DET_NOZZLE_OPENING_ANGLE superseded by evidence on 2026-10-29); single-sided LHmuC nozzle.
        Baselines: DET_NOZZLE_HALF_OPENING_ANGLE_WS2026_FORTHOMME (40 mrad), DET_NOZZLE_HALF_OPENING_ANGLE_OPTION2_WS2026_FORTHOMME
        (100 mrad), DET_NOZZLE_OUTER_ANGLE_NEAR_IP_MR7 (10 degree, IMCC analogue). No scenario slot may point to this record.'
    confidence: low
    assumption_id: ASM_DET_NOZZLE_OPENING_ANGLE
  validation:
    level: P0
    methods:
    - dimensional check of the unit string
    - band brackets every evidence-backed record named in the assumption record (read in full; see range_vs_evidence)
    check_ids: []
    notes: Synthetic scan variable; it validates nothing and confers at most P1 on dependents.
  dependencies:
  - DET_NOZZLE_PRESENCE_DIS2026
  - DET_NOZZLE_PLACEMENT_MULHC
  - MACHINE_MU_BUNCH_POPULATION_DIS2026
  - DET_NOZZLE_HALF_OPENING_ANGLE_WS2026_FORTHOMME
  - DET_NOZZLE_HALF_OPENING_ANGLE_OPTION2_WS2026_FORTHOMME
  - DET_NOZZLE_OUTER_ANGLE_NEAR_IP_MR7
  date_added: '2026-10-28'
  responsible_module: parameters/detector
  notes: 'SYNTHETIC SCAN VARIABLE ONLY: ASM_DET_NOZZLE_OPENING_ANGLE is superseded by evidence (2026-10-29); this record survives only
    to scan the band 2-12 degree in screening and sensitivity studies, and no scenario slot may point to it. Baselines: DET_NOZZLE_HALF_OPENING_ANGLE_WS2026_FORTHOMME
    (40 mrad = 2.29 degree), DET_NOZZLE_HALF_OPENING_ANGLE_OPTION2_WS2026_FORTHOMME (100 mrad = 5.73 degree), DET_NOZZLE_OUTER_ANGLE_NEAR_IP_MR7
    (10 degree, IMCC). value is the arithmetic midpoint of the band and exists only so that software, plots and exports have a number
    to display; it is NOT an LHmuC design value. Phase-0 band uniform 5-20 degree (2026-10-28); re-based on 2026-10-29 to bracket every
    documented option. Any use must carry the assumption_id and the band (CLAUDE.md 1.4). The LHmuC 40 mrad baseline lay BELOW the Phase-0
    band.'
