# Synthetic screening ranges for the LHmuC detector and nozzle (machine-detector interface).
# status: synthetic (CLAUDE.md 1.4). Every record here is a screening RANGE with an assumption record in
# parameters/assumptions/phase0_assumptions.yaml; 'value' is only the range midpoint (or a representative member of a
# discrete set) so that software has a number to display. None of these numbers is an LHmuC design value.
# Date: 2026-10-28. Author role: assumptions and synthetic-range author (Phase 0 evidence audit).
parameters:
- parameter_id: DET_NOZZLE_OPENING_ANGLE_SYN
  name: Opening (half) angle of the decay-shielding nozzle on the incoming-muon side (synthetic screening range)
  symbol: theta_nozzle
  subsystem: detector
  scenario: null
  value: 12.5
  unit: degree
  uncertainty:
    type: interval
    lower: 5.0
    upper: 20.0
    unit: degree
    note: Synthetic range, not a measured uncertainty; see ASM_DET_NOZZLE_OPENING_ANGLE.
  allowed_range:
    min: 5.0
    max: 20.0
    unit: degree
    basis: synthetic screening range, see assumption record ASM_DET_NOZZLE_OPENING_ANGLE
  provenance:
    status: synthetic
    extraction_method: assumption_record
    source: null
    derivation: null
    applicability:
      category: screening_only
      scenario: null
      explanation: Screening only; applies to the single-sided LHmuC nozzle concept (DIS2026 and muLHC). Not a muon-collider two-sided
        nozzle.
    confidence: low
    assumption_id: ASM_DET_NOZZLE_OPENING_ANGLE
  validation:
    level: P0
    methods:
    - dimensional check of the unit string
    - range bracketed by the analogous-system values listed in the assumption record (snippet-level, unverified)
    check_ids: []
    notes: Unverified synthetic input; no LHmuC source gives this quantity.
  dependencies:
  - DET_NOZZLE_PRESENCE_DIS2026
  - DET_NOZZLE_PLACEMENT_MULHC
  - MACHINE_MU_BUNCH_POPULATION_DIS2026
  date_added: '2026-10-28'
  responsible_module: parameters/detector
  notes: 'SYNTHETIC: value is the arithmetic midpoint of the synthetic range and exists only so that software, plots and exports have
    a number to display; it is NOT an LHmuC design value. Any use must carry the assumption_id and the range (CLAUDE.md 1.4).'
