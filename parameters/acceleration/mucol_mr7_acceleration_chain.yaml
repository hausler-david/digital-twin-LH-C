# Acceleration-chain parameters from SRC_ARXIV_2510_27437 (MuCol Milestone Report No. 7, Consolidated Parameters, arXiv:2510.27437v1).
# Scope: main-body section 5 (Tables 5.1, 5.2 and the text), Appendix E (Tables E.1, E.2) and Appendix F (text, Tables F.1-F.5).
# All values are IMCC/MuCol muon-collider analogues (status analogous), never LHμC values. page = PDF page index; the printed page
# is given in 'section'. Conventions: a table cell printed '-' (not applicable, e.g. steady-magnet rows of a non-hybrid ring) gets no
# record; bunch lengths printed in ps are stored in ns; populations printed in units of 10^12 are stored as plain numbers; quantities
# printed in units of 10^-4 / 10^-6 are stored as plain dimensionless numbers. P1 levels mark cells reproduced by the arithmetic named
# in validation.methods (energy ratios, turns, gain per turn, gradients, revolution periods, harmonic numbers, ramp rates, currents,
# RF powers, arc lengths, transition gammas, fill ratios, scaling-law excursions). Table D.21 (pre-accelerator), Tables 1.2/1.3,
# A.2, I.8/I.10, J.1/J.2, K.2 are outside this file's scope (other groups / out of the E-F-section-5 remit).
# Verification 2026-10-29 (adversarial verifier, research/_fragments/verify_G3_ACCELERATION.md): every cell of Tables 5.1, 5.2, E.1, E.2, F.1-F.5
# re-transcribed from 200-dpi page images and compared programmatically; 25 cell transcriptions corrected (trailing zeros, '-' unit cells, the
# 'No.S̃RF' row label); P1 now requires an arithmetic reproduction (duplicates of the same number elsewhere are noted, not counted); new P1:
# straight-section lengths (C - arc length), dipole lengths (closed-orbit field integral sum L B = 2 pi Brho at injection and extraction),
# Fermilab fill ratios (field-integral bending length), LINAC+RLA1 effective gradient. Table F.2 columns RCS1/RCS2/RCS3 are the Table F.1
# rings RCS SPS/LHC1/LHC2 (confirmed by C - arc length = straight-section length).
