# MuCol Milestone Report No. 17 "Tentative design of the FFA" (M. Topp-Mugglestone, CERN, WP5 High Energy Complex, v1.0 Final,
# 27 Mar 2025, DOI 10.5281/zenodo.15054073; SRC_DOI_10_5281_ZENODO_15054073, category OFFICIAL_CERN, access uploaded, batch 8, 2026-10-28).
# Every table/text value -> status analogous (IMCC/MuCol 10 TeV chain design, NOT an LHμC design; the report itself says the analytic lattices
# still need numerical verification, p. 15). Values computed here -> analytical_estimate with the derivation and input ids named; the formulas
# are the same as in tests/scientific/test_mucol_m17_vffa.py, whose test names are cited where a P1 reproduction exists. Quotations are
# verbatim text or exact table-cell transcriptions checked against the page images (Tables 2.2 and 2.3 on p. 11; equations on pp. 6, 8, 13-14).
# Zero values (ramp rate, RCS excursion, path-length difference, momentum compaction) are PHYSICAL ZEROS, not unknowns. Nothing from the RCS
# comparator columns is an LHμC value. Scenarios: parameters/machine/scenarios_batch8_vffa.yaml (MUCOL-M17-VFFA1-2025, MUCOL-M17-VFFA4-2025).
# Not recorded because the report does not state them: RF voltage/frequency/cavity count, turns, acceleration time, injection/extraction systems,
# magnet apertures, bunch parameters, straight-section counts;
# the blank RCS cells of Table 2.3 (good-field peak, drift length, tune) and the illustrative 3-12 MeV ring of Fig. 1.1.
# Verification 2026-10-28 (research/_fragments/verify_G11_MUCOL_M17_VFFA.md): eqs (2.1)-(2.6) were transcribed from the p. 8 page image and evaluated
# for both stages (θD corrected from the planar estimate; γD, ρD, the D-magnet on-orbit field and the hard-edge magnet lengths added as analytical_estimate
# records, confidence medium, P0). The Table 2.3 stage-4 'Peak Dipole Field On Orbit' 13.59 T is reproduced by the reverse-bend D-magnet field (13.62 T), not by
# the F-magnet field (13.15 T); eq. (2.7) as printed appears to contain a typographical error (see ACC_VFFA_CLOSED_ORBIT_MODEL_ASSUMPTION_MUCOLM17 notes).
