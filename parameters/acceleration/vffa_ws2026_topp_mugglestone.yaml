# Acceleration parameters extracted from SRC_WS1681458_TOPPMUGGLESTONE_VFFA (M. Topp-Mugglestone, 'vFFA and LHμC', HELP4CERN workshop
# 'Ultra-cold muons for the LHC', AGH Kraków, 24 Sept 2026, 52 slides). page = slide number.
# LHμC statements -> reported_lhmuc (applicability direct for the requirement slide, design_variant for the preliminary parameter study);
# the MuCol RCS1-4 table reproduced on slide 9 -> analogous (one record per cell; identical values in MR7 Table 5.1, ACC_RCS*_MR7);
# audit arithmetic (energy ratios, scaling-law excursions) -> derived_lhmuc with the derivation named.
# Unknowns (no value on any slide, left out rather than invented): RF frequency, voltage and cavity count of the vFFA booster; number of
# turns and cycle time actually achieved; injection/extraction scheme; lattice cell count, circumference and footprint of the LHμC vFFA;
# magnet aperture; simulated (as opposed to analytic) LHμC lattice parameters.
# Verification 2026-10-29 (research/_fragments/verify_G3_ACCELERATION.md): all 64 cells of the slide-9 table re-read from the slide image
# (one corrected: '1.10'); quotations of slides 11, 42, 48 made verbatim; P1 kept only for arithmetic reproductions (duplicates of the same
# number in another document of the same study are noted, not counted); derived records name every input id and carry confidence medium;
# added: dispersion-suppressor phase advance 180° (slide 42) and five CBETA labels (backup slide 49). Slides 23-30, 32, 35-37, 39-43, 52
# carry the footer/date of the speaker's 13/05/2025 'Update on vFFA' talk (PDF text layer): reused material, re-presented on 24/09/2026.
