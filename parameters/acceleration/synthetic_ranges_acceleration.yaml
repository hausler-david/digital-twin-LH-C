  responsible_module: parameters/acceleration
  notes: 'SYNTHETIC: value is one representative member of the discrete candidate set in the assumption record and exists only so that
    software, plots and exports have a number to display; it is NOT an LHmuC design value. Any use must carry the assumption_id and
    the range (CLAUDE.md 1.4). Discrete set {325, 352, 400, 802, 1300} MHz; allowed_range min/max are the set bounds, not a continuous
    interval. Updated 2026-10-29: kept synthetic, set unchanged; 802 MHz now stands for the LHeC 801.58 MHz (ACC_ERL_RF_FREQUENCY_ANDRE2022),
