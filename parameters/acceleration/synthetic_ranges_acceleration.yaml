# Synthetic screening ranges for the LHmuC acceleration chain, ultra-cold source efficiencies and beam polarisation.
# status: synthetic (CLAUDE.md 1.4). Every record here is a screening RANGE with an assumption record in
# parameters/assumptions/phase0_assumptions.yaml; 'value' is only the range midpoint (or a representative member of a
# discrete set) so that software has a number to display. None of these numbers is an LHmuC design value.
# Date: 2026-10-28. Author role: assumptions and synthetic-range author (Phase 0 evidence audit).
parameters:
- parameter_id: ACC_VFFA_PEAK_FIELD_SYN
  name: Peak on-orbit magnetic field of the vFFA booster arcs (synthetic screening range)
  symbol: B_peak
  subsystem: acceleration
  scenario: null
  value: 9.5
  unit: T
  uncertainty:
    type: interval
    lower: 3.0
    upper: 16.0
    unit: T
    note: Synthetic range, not a measured uncertainty; see ASM_ACC_VFFA_PEAK_FIELD.
  allowed_range:
    min: 3.0
    max: 16.0
    unit: T
    basis: synthetic screening range, see assumption record ASM_ACC_VFFA_PEAK_FIELD
  provenance:
    status: synthetic
    extraction_method: assumption_record
    source: null
    derivation: null
    applicability:
      category: screening_only
      scenario: null
      explanation: Screening only; LHmuC vFFAG booster concept (DIS2026) and the muLHC vFFA booster option (SRC_ARXIV_2506_15445 section
        2.2.3).
    confidence: low
    assumption_id: ASM_ACC_VFFA_PEAK_FIELD
  validation:
    level: P0
    methods:
    - dimensional check of the unit string
    - range bracketed by the analogous-system values listed in the assumption record (snippet-level, unverified)
    check_ids: []
    notes: Unverified synthetic input; no LHmuC source gives this quantity.
  dependencies:
  - ACCEL_SCHEME_DIS2026
  - ACCEL_BOOSTER_CIRCUMFERENCE_DIS2026
  - ACC_BOOSTER_MAX_FIELD_MUTRISTAN_MULHC
  - ACC_BOOSTER_LATTICE_TYPE_MULHC
  date_added: '2026-10-28'
  responsible_module: parameters/acceleration
  notes: 'SYNTHETIC: value is the arithmetic midpoint of the synthetic range and exists only so that software, plots and exports have
    a number to display; it is NOT an LHmuC design value. Any use must carry the assumption_id and the range (CLAUDE.md 1.4).'
