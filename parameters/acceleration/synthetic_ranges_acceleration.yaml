# Synthetic screening ranges for the LHmuC acceleration chain, ultra-cold source efficiencies and beam polarisation.
# status: synthetic (CLAUDE.md 1.4). Every record here is a screening RANGE with an assumption record in
# parameters/assumptions/phase0_assumptions.yaml; 'value' is only the range midpoint (or a representative member of a
# discrete set) so that software has a number to display. None of these numbers is an LHmuC design value.
# Date: 2026-10-28. Author role: assumptions and synthetic-range author (Phase 0 evidence audit).
# Updated 2026-10-29: records whose assumption is superseded_by_evidence (parameters/assumptions/phase0_assumptions.yaml) are
# SYNTHETIC SCAN VARIABLES ONLY; their bands were re-based to bracket every documented option and no scenario slot may point to
# them. Records whose assumption stays synthetic carry updated dependencies and notes; PROTON_BUNCH_LENGTH_RMS_SYN was widened to
# a log-uniform 5-100 cm range (value = geometric midpoint).
parameters:
- parameter_id: ACC_VFFA_PEAK_FIELD_SYN
  name: Peak on-orbit magnetic field of the vFFA booster arcs (synthetic scan variable; assumption superseded by evidence)
  symbol: B_peak
  subsystem: acceleration
  scenario: null
  value: 9.5
  unit: T
  uncertainty:
    type: interval
    lower: 5.0
    upper: 14.0
    unit: T
    note: Synthetic scan band, not a measured uncertainty; see ASM_ACC_VFFA_PEAK_FIELD (superseded by evidence on 2026-10-29).
  allowed_range:
    min: 5.0
    max: 14.0
    unit: T
    basis: synthetic scan band bracketing every documented on-orbit peak field (6.93-13.59 T MuCol M17; 8, 10, <9 T Krakow deck); see
      ASM_ACC_VFFA_PEAK_FIELD (superseded_by_evidence)
  provenance:
    status: synthetic
    extraction_method: assumption_record
    source: null
    derivation: null
    applicability:
      category: screening_only
      scenario: null
      explanation: 'Scan variable only (ASM_ACC_VFFA_PEAK_FIELD superseded by evidence on 2026-10-29); on-orbit peak field of the 70-500
        GeV vFFA booster concept, not valid for the 1 TeV extraction option. Baselines: ACC_VFFA_PEAK_DIPOLE_FIELD_8T_WS2026_TOPPMUGGLESTONE,
        ACC_VFFA_PEAK_DIPOLE_FIELD_10T_WS2026_TOPPMUGGLESTONE, ACC_VFFA_PEAK_FIELD_RELAXED_MAX_WS2026_TOPPMUGGLESTONE (LHmuC, preliminary),
        ACC_VFFA1_PEAK_FIELD_ON_ORBIT_MUCOLM17 and ACC_VFFA4_PEAK_FIELD_ON_ORBIT_MUCOLM17 (analogous). No scenario slot may point to
        this record.'
    confidence: low
    assumption_id: ASM_ACC_VFFA_PEAK_FIELD
  validation:
    level: P0
    methods:
    - dimensional check of the unit string
    - band brackets every evidence-backed record named in the assumption record (read in full; see range_vs_evidence)
    check_ids: []
    notes: Synthetic scan variable; it validates nothing and confers at most P1 on dependents.
  dependencies:
  - ACCEL_SCHEME_DIS2026
  - ACCEL_BOOSTER_CIRCUMFERENCE_DIS2026
  - ACC_BOOSTER_MAX_FIELD_MUTRISTAN_MULHC
  - ACC_BOOSTER_LATTICE_TYPE_MULHC
  - ACC_VFFA_PEAK_DIPOLE_FIELD_8T_WS2026_TOPPMUGGLESTONE
  - ACC_VFFA_PEAK_DIPOLE_FIELD_10T_WS2026_TOPPMUGGLESTONE
  - ACC_VFFA_PEAK_FIELD_RELAXED_MAX_WS2026_TOPPMUGGLESTONE
  - ACC_VFFA1_PEAK_FIELD_ON_ORBIT_MUCOLM17
  - ACC_VFFA4_PEAK_FIELD_ON_ORBIT_MUCOLM17
  - ACC_VFFA_DESIGN_LIMIT_SC_DIPOLE_MUCOLM17
  date_added: '2026-10-28'
  responsible_module: parameters/acceleration
  notes: 'SYNTHETIC SCAN VARIABLE ONLY: ASM_ACC_VFFA_PEAK_FIELD is superseded by evidence (2026-10-29); this record survives only to
    scan the band 5-14 T (on-orbit peak field) in screening and sensitivity studies, and no scenario slot may point to it. Baselines:
    Krakow deck ~8 T, ~10 T, relaxed < 9 T (preliminary analytic study, 70 -> 500 GeV); MuCol M17 6.93 T (stage 1) and 13.59 T (stage
    4), analytic lattices. value is the arithmetic midpoint of the band and exists only so that software, plots and exports have a number
    to display; it is NOT an LHmuC design value. Phase-0 band uniform 3-16 T (2026-10-28); re-based on 2026-10-29 to bracket every documented
    option. Any use must carry the assumption_id and the band (CLAUDE.md 1.4). Scan points above 8.3 T exceed the LHC-dipole design
    limit of MuCol M17 (ACC_VFFA_DESIGN_LIMIT_SC_DIPOLE_MUCOLM17) and must be flagged.'
