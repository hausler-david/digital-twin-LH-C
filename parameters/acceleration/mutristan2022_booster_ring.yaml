# arc filling factor, main-ring lattice, IP crossing angle. Internal inconsistencies preserved, not averaged: Figure 1 2.2 nC vs text
# 2.3 nC bunch charge; 'about a half' decay loss vs the μLHC recomputation (82 %); 3 T x 1 km arcs vs 1 TeV.
# Verification 2026-10-29 (research/_fragments/verify_G3_ACCELERATION.md): geometric emittance corrected from 0.42 mm mrad to 420 nm mrad as
# printed (the old value was 1000 x too large and the two beam-size P1 checks had computed 112 µm and 54 µm against the printed 3.6/1.7 µm);
