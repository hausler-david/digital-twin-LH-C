# Phase-0 assumption records for every synthetic parameter (schema: schemas/assumption.schema.json).
# One record per synthetic parameter in parameters/*/synthetic_ranges_*.yaml. Each states what was searched, which
# sources were inspected, why no authoritative LHmuC value exists, the synthetic model (distribution and range),
# the physical basis, analogous-system values (snippet-level unless marked 'read in full'), affected outputs and the
# evidence that would replace the assumption. sensitivity_analysis is not_started for all (docs/uncertainty_policy.md 3.4).
# External source_ids are taken verbatim from research/_fragments/*_sources.yaml (to be merged into source_registry.yaml).
# Date: 2026-10-28.
# Updated 2026-10-29 (assumptions and synthetic-range updater; evidence read in full from the uploaded documents, no web access):
# ten records are status superseded_by_evidence (ASM_IR_LSTAR, ASM_DET_NOZZLE_OPENING_ANGLE, ASM_DET_NOZZLE_LENGTH,
# ASM_DET_NOZZLE_TIP_DISTANCE_FROM_IP, ASM_DET_NOZZLE_MATERIAL, ASM_DET_SOLENOID_FIELD, ASM_ACC_VFFA_PEAK_FIELD,
# ASM_SOURCE_MUONIUM_FORMATION_FRACTION, ASM_SOURCE_LASER_IONISATION_EFFICIENCY, ASM_MACHINE_MUON_POLARISATION). Their _SYN parameters
# survive only as scan variables whose bands bracket every documented option; range_vs_evidence states whether the evidence fell
# inside the Phase-0 band (it did not for the 40 mrad nozzle cone and the 244 nm ionisation efficiency). Six records stay synthetic
# with updated physical bases and analogues (ASM_PROTON_BUNCH_LENGTH_RMS, widened to log-uniform 5-100 cm; ASM_IR_CROSSING_ANGLE;
# ASM_IR_BETA_X_STAR_MUON; ASM_IR_BETA_Y_STAR_MUON; ASM_ACC_RF_FREQUENCY; ASM_ACC_RF_GRADIENT). The four separator-dipole and Q1
# records are unchanged apart from two cross-reference notes. 'snippet-level' statements that remain are Phase-0 text kept for the
# audit trail; entries added on 2026-10-29 say 'read in full'. sensitivity_analysis is still not_started everywhere.
