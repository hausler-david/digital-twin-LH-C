  reason_authoritative_value_missing: 'SRC_ARXIV_2610_35154 p.4: ''high polarisation of the mu+ beam might also be feasible [2]'' -
    no value (SOURCE_MU_POLARISATION_FEASIBILITY_DIS2026). SRC_ARXIV_2506_15445 does not discuss polarisation; SRC_WS1681458_KHANPOUR_GAMMAGAMMA
    p.17 quotes unpolarised rates. No fragment of the ultracold-source or mulhc-mutristan families quotes a polarisation value.'
  synthetic_model:
    distribution: uniform
    minimum: 0.0
    maximum: 0.8
    unit: dimensionless
  physical_basis:
  - Surface mu+ from pi+ decay at rest are fully polarised (two-body decay kinematics); formation of muonium and thermalisation partly
    depolarise the muon (hyperfine mixing in the muonium ground state leaves on average half of the muon polarisation in zero field),
    so an ultra-cold source starts below unity.
  - Spin transport through acceleration to 1 TeV (spin tune a*gamma ~ 11 at 1 TeV) and storage over ~20 ms must preserve the polarisation;
    no study exists for the LHmuC chain.
  - 0 (unpolarised) is a physical value inside the range; 0.8 is an optimistic upper bound below the surface-muon limit.
  - 'Physics impact: charged-current DIS cross sections scale as (1 +- P) for the lepton helicity, and electroweak asymmetries are proportional
    to P.'
  analogous_systems:
