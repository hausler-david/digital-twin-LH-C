  - 'The LHeC ERL that the DIS2026 chain inherits has a real-estate gradient of 8.25 GeV per pass over a 900 m linac = 9.2 MV/m (audit
    arithmetic on ACC_ERL_ENERGY_GAIN_PER_LINAC_ANDRE2022 and ACC_ERL_LINAC_LENGTH_ANDRE2022) at a cavity gradient of 20.06 MV/m (fill
    factor 0.46; implied active length 411 m, ACC_ERL_LINAC_ACTIVE_LENGTH_IMPLIED_ANDRE2022): the real-estate value lies 8 % BELOW the
    band''s 10 MV/m lower edge, the cavity value inside it. A model that reads this record as a real-estate gradient must note that
    its closest analogue lies outside the band.'
  - Cavity (active-length) gradients of beta ~ 1 linac structures in the evidence are 15 / 25 MV/m (IMCC RLA at 352 / 1056 MHz), ~20
    MV/m (J-PARC DLS) and 20.06 MV/m (LHeC ERL), with the LHeC prototype quench limit near 30 MV/m; 10-30 MV/m therefore spans these
    cavity values and the muLHC / muTRISTAN real-estate values, and the record must state which definition a model uses.
  - 'Outside the band and belonging to other stages: low-velocity structures (J-PARC DAW 5.6 MV/m, IMCC linac cryomodules 5 / 8 MV/m),
    the IMCC ''effective average gradient'' of 4.1 MV/m for LINAC + RLA1 (a real-estate value including the arcs) and the ring-average
    RCS gradients of 1.06-2.44 MV/m; the band applies only to the high-energy linac passes of the LHmuC ERL.'
  - 'Muon decay during acceleration favours high gradient: the survival fraction over a pass is exp(-L_linac/(gamma_mean c tau)), so
    lengthening the linacs at low gradient costs muons.'
