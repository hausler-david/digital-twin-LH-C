  physical_basis:
  - 'Bunch structure: 801.58 MHz = 20 x 40.079 MHz, the LHC bunch frequency (1/24.95 ns = 40.08 MHz, ACC_ERL_BUNCH_FREQUENCY_IMPLIED_ANDRE2022),
    so an LHeC-type ERL is harmonic with any muon spacing that is a whole number of 24.95 ns slots (250 ns = 10 slots, MACHINE_MU_BUNCH_SPACING_DIS2026;
    300 ns ~ 12 slots, MACHINE_MU_BUNCH_SPACING_WS2026_FORTHOMME). The LHC main RF (~400.79 MHz = 10 x; the ''Blow-up by 400 MHz RF
    system'' step of the Damerau-Garoby table, PROTON_LHC_LONGBUNCH_BLOWUP_AFTER_400MHZ_BLOWUP_WS2026_ZIMMERMANN, names it, the exact
    frequency is not in the registry) is harmonic too; 1300 MHz is NOT a harmonic of 40.079 MHz (ratio 32.44) and neither are 325 or
    352 MHz - members of the set are not equally admissible and the check must be made in any scan.'
  - The 2 mm muon bunch (MACHINE_MU_BUNCH_LENGTH_MULHC) is short compared with every candidate wavelength in the set (23-92 cm), so
    bunch length does not constrain the choice.
  - 'Front-end harmonic chains in the evidence: J-PARC 324 -> 1296 (4 x) -> 2592 MHz (8 x) and IMCC 352 -> 1056 MHz (3 x, an observation
    recorded with ACC_RLA1_RF_FREQUENCY_SECOND_MR7) followed by 1.3 GHz RCS cavities. The LHmuC ultra-cold front end (pre-acceleration
    to 1 GeV, SOURCE_PRE_ACCELERATION_TARGET_ENERGY_DIS2026) would inherit one of these chains; it is a different stage from the 70
    GeV ERL this record describes.'
  - Lower frequencies give larger apertures and lower wakefields at the cost of gradient and cryomodule length; the LHeC ERL cryomodule
    design (801.58 MHz, ACC_ERL_RF_FREQUENCY_ANDRE2022) is the natural inheritance for the DIS2026 'three-pass acceleration to 70 GeV,
    inherited from the nominal LHeC design'.
  - 'Set unchanged on 2026-10-29: 802 MHz stands for the LHeC 801.58 MHz, 352 MHz for the IMCC RLA and hybrid front end, 1300 MHz for
    the IMCC RCS, 400 MHz for the LHC main RF; 325 MHz remains an unsourced technology-class label and is NOT the J-PARC 324 MHz. Not
    in the set: 1056, 1296, 2592, 704, 88 and 264 MHz, which belong to front-end, cooling or IMCC-specific stages and need stage-specific
    records rather than members of this ERL set.'
