# Phase-0 assumption records for every synthetic parameter (schema: schemas/assumption.schema.json).
# One record per synthetic parameter in parameters/*/synthetic_ranges_*.yaml. Each states what was searched, which
# sources were inspected, why no authoritative LHmuC value exists, the synthetic model (distribution and range),
# the physical basis, analogous-system values (snippet-level unless marked 'read in full'), affected outputs and the
# evidence that would replace the assumption. sensitivity_analysis is not_started for all (docs/uncertainty_policy.md 3.4).
# External source_ids are taken verbatim from research/_fragments/*_sources.yaml (to be merged into source_registry.yaml).
# Date: 2026-10-28.
assumptions:
- assumption_id: ASM_IR_LSTAR
  parameter_id: IR_LSTAR_SYN
  status: synthetic_assumption
  reason_required: Every IR optics model (beta-function growth in the final doublet/triplet, chromaticity, aperture, separator-dipole
    requirement, nozzle length) needs L*, and no LHmuC document states it.
  search_summary:
  - Reconnaissance of 2026-10-28 by the family scouts lhmuc-primary, lhec-erl, muon-collider-mdi, vffa-acceleration, ultracold-source,
    mulhc-mutristan and lhc-hl-lhc-protons (WebSearch only); their hits, queries and snippet quotations are in research/_fragments/<family>_sources.yaml,
    <family>_search_log.csv and <family>_unresolved.md.
  - Full text was read only for the five uploads (SRC_ARXIV_2610_35154, SRC_ARXIV_2506_15445, SRC_WS1681458_DAGLI_NUCLEUS, SRC_WS1681458_KHANPOUR_GAMMAGAMMA,
    SRC_WS_LEBOHO_KUMAR_DIHIGGS). Network policy blocked arxiv.org, indico.cern.ch, cds.cern.ch, inspirehep.net, pos.sissa.it, doi.org,
    jacow.org, iopscience.iop.org, e-publishing.cern.ch and every other CERN host, so every external value cited below is snippet-level
    (source access snippet_only or blocked), may not back reported_lhmuc and is capped at confidence medium (CLAUDE.md 1.5). The assumption
    author made no new web requests and did not use WebSearch.
  - 'Searched (lhec-erl family): ''LHeC interaction region design crossing angle separator dipole mini-beta quadrupole Q1 gradient aperture
    L*'' and ''Andre Holzer interaction region LHeC 50 GeV HL-LHC optics IPAC 2021 WEPAB001 L* 15 m separator dipole field''; (muon-collider-mdi
    family): ''MuCol Milestone Report No. 5 ... nozzle ... L* 6 m 10 TeV''. No hit mentions an LHmuC L*.'
  sources_inspected:
  - SRC_ARXIV_2610_35154
  - SRC_ARXIV_2506_15445
  - SRC_WS1681458_DAGLI_NUCLEUS
  - SRC_WS1681458_KHANPOUR_GAMMAGAMMA
  - SRC_WS_LEBOHO_KUMAR_DIHIGGS
  - SRC_ARXIV_2207_02095
  - SRC_INDICO_1072533_4787015
  - SRC_ARXIV_2007_14491
  - SRC_JACOW_IPAC2021_WEPAB001
  - SRC_ARXIV_1206_2913
  - SRC_INDICO_FNAL_64493_294885
  - SRC_INDICO_DESY_45968_187027
  - SRC_ARXIV_2411_02966
  - SRC_DOI_10_5170_CERN_2004_003_V_1
  reason_authoritative_value_missing: SRC_ARXIV_2610_35154 p.4 (section 3) only lists two options - muon focusing 'in between the mini-beta
    quadrupoles of the LHC, as is proposed for electrons at the LHeC' or 'outside ... in a linear collider type style' - and selects
    neither; SRC_ARXIV_2506_15445 gives beta* but no L*; the three workshop decks give no IR geometry. The LHeC IR papers that would
    anchor the inside option (arXiv:2007.14491, arXiv:2207.02095, IPAC2021 WEPAB001) and the IMCC MDI slides were blocked.
  synthetic_model:
    distribution: uniform
    minimum: 5.0
    maximum: 20.0
    unit: m
  physical_basis:
  - beta(s) = beta* + s^2/beta* grows to ~L*^2/beta* at the first quadrupole, so L* together with beta* sets the magnet aperture and
    chromaticity; the range must be read together with IR_BETA_X_STAR_MUON_SYN / IR_BETA_Y_STAR_MUON_SYN.
  - 'Lower bound 5 m: a detector of LHeC/CMS-like size (SRC_ARXIV_2610_35154 p.5 ''most segments of the baseline LHeC detector'') plus
    the single-sided nozzle (DET_NOZZLE_LENGTH_SYN) must fit inside L*; the IMCC 10 TeV layout uses L* = 6 m with the nozzle filling
    that space.'
  - 'Upper bound 20 m: the LHeC ''inside'' option places the first proton quadrupole at L* = 15 m; a linear-collider-style ''outside''
    option would place the muon doublet beyond the LHC mini-beta quadrupoles, whose position is fixed by the existing LHC IR layout
    (to be verified in SRC_DOI_10_5170_CERN_2004_003_V_1, blocked).'
  - The muon beam is stiff (B rho = 3336 T m at 1 TeV) so the beam-separation argument that fixes L* at the LHeC (soft 60 GeV electrons)
    does not transfer directly; see ASM_IR_SEPARATOR_DIPOLE_FIELD.
  analogous_systems:
  - 'LHeC (electron-proton, 50-60 GeV e-): L* = 15 m - snippet-level, SRC_ARXIV_2207_02095 (''first superconducting proton quadrupole
    QA1 at a position of L* = 15 m'') and SRC_INDICO_1072533_4787015 (''L* = 15 m & beta* = 10 cm''); not read in full.'
  - 'IMCC 10 TeV muon collider: L* = 6 m layout - snippet-level, SRC_INDICO_FNAL_64493_294885 (relevance line) and SRC_INDICO_DESY_45968_187027
    (''increasing L* from 6 m to 10 m'', result cut off); not read in full.'
  - 'FCC-eh: L* = 23 m, beta* = 30 cm - snippet-level, SRC_INDICO_1072533_4787015; outside the adopted range and listed only to show
    the spread among e-h designs.'
  applicability: Screening only, LHMUC-DIS2026-1TEV optics models. The LHmuC IR has not been designed; the range brackets the two focusing
    options named in the DIS2026 proceedings and must be replaced before any optics result is reported.
  affected_outputs:
  - 'IR optics (beta_max, chromaticity, aperture of Q1: IR_Q1_APERTURE_RADIUS_SYN)'
  - separator-dipole integrated field needed for beam separation (IR_SEPARATOR_DIPOLE_FIELD_SYN, IR_SEPARATOR_DIPOLE_LENGTH_SYN)
  - available length for the decay-shielding nozzle (DET_NOZZLE_LENGTH_SYN)
  - beam-induced background and forward detector acceptance
  - G1 conceptual geometry of the IR in cad/
  replacement_evidence: An LHmuC IR layout from the HELP4CERN study (White Paper 'in preparation', or the IR/MDI workshop contributions
    of Indico 1681458); failing that, the LHeC 2020 IR table read in full (arXiv:2007.14491) for the inside option and an LHmuC-specific
    MAD-X/Xsuite IR study for the outside option.
  sensitivity_analysis: not_started
  date_added: '2026-10-28'
  notes: null
- assumption_id: ASM_IR_CROSSING_ANGLE
  parameter_id: IR_CROSSING_ANGLE_SYN
  status: synthetic_assumption
  reason_required: The geometric luminosity reduction, the parasitic-encounter separation and the IR magnet layout all depend on the
    crossing angle; the only LHmuC statement is qualitative ('very small').
  search_summary:
  - Reconnaissance of 2026-10-28 by the family scouts lhmuc-primary, lhec-erl, muon-collider-mdi, vffa-acceleration, ultracold-source,
    mulhc-mutristan and lhc-hl-lhc-protons (WebSearch only); their hits, queries and snippet quotations are in research/_fragments/<family>_sources.yaml,
    <family>_search_log.csv and <family>_unresolved.md.
  - Full text was read only for the five uploads (SRC_ARXIV_2610_35154, SRC_ARXIV_2506_15445, SRC_WS1681458_DAGLI_NUCLEUS, SRC_WS1681458_KHANPOUR_GAMMAGAMMA,
    SRC_WS_LEBOHO_KUMAR_DIHIGGS). Network policy blocked arxiv.org, indico.cern.ch, cds.cern.ch, inspirehep.net, pos.sissa.it, doi.org,
    jacow.org, iopscience.iop.org, e-publishing.cern.ch and every other CERN host, so every external value cited below is snippet-level
    (source access snippet_only or blocked), may not back reported_lhmuc and is capped at confidence medium (CLAUDE.md 1.5). The assumption
    author made no new web requests and did not use WebSearch.
  - 'Searched (lhec-erl family): ''LHeC interaction region design crossing angle separator dipole ...'' and ''site:indico.cern.ch LHeC
    ERL workshop 2025 Holzer interaction region Q1 gradient T/m crossing angle mrad''. No LHmuC-specific crossing angle appeared in
    any snippet.'
  sources_inspected:
  - SRC_ARXIV_2610_35154
  - SRC_ARXIV_2506_15445
  - SRC_WS1681458_DAGLI_NUCLEUS
  - SRC_WS1681458_KHANPOUR_GAMMAGAMMA
  - SRC_WS_LEBOHO_KUMAR_DIHIGGS
  - SRC_JACOW_IPAC2011_THPZ016
  - SRC_JACOW_IPAC2014_TUPRO070
  - SRC_INDICO_1072533_4787015
  - SRC_ARXIV_2503_20475
  - SRC_ARXIV_2007_14491
  reason_authoritative_value_missing: 'SRC_ARXIV_2610_35154 p.4: ''The time separation of muon bunches is large at LHmuC, therefore,
    a very small crossing angle is needed to avoid parasitic collisions of muon and proton bunches'' - no number, and a head-on scheme
    is not claimed (recorded as IR_CROSSING_ANGLE_DIS2026 = unknown). SRC_ARXIV_2506_15445 and the workshop decks are silent. LHeC values
    exist only as snippets and differ between design iterations.'
  synthetic_model:
    distribution: uniform
    minimum: 0.0
    maximum: 10.0
    unit: mrad
  physical_basis:
  - 0 mrad (head-on) is a physical value inside the range, not 'unknown'; the DIS2026 Table 1 peak luminosity is reproduced with no
    geometric reduction factor (docs/limitations.md section 5), which is consistent with a head-on or near head-on scheme.
  - 'Parasitic encounters: with 250 ns muon bunch spacing (MACHINE_MU_BUNCH_SPACING_DIS2026) the first parasitic meeting point of a
    muon bunch with the next proton bunch (25 ns LHC slots) is at c*25 ns/2 = 3.75 m from the IP, where the beams must already be separated
    by many sigma - either by angle or by the separator dipole (IR_SEPARATOR_DIPOLE_FIELD_SYN).'
  - 'Luminosity: the Piwinski parameter phi = theta_c*sigma_z/(2*sigma*) with sigma* = 4.8 um (IR_SIGMA_X_IP_MUON_DIS2026) and a proton
    bunch length of order 7.5 cm (PROTON_BUNCH_LENGTH_RMS_SYN) reaches 1 already at theta_c ~ 0.13 mrad, so any angle above ~0.1 mrad
    costs a large luminosity factor unless crab cavities are used (not mentioned in any LHmuC source).'
  - Upper bound 10 mrad brackets every LHeC proton-proton crossing angle quoted in snippets (6, 6.8, 7 mrad).
  analogous_systems:
  - 'LHeC linac-ring IR 2011: 6 mrad between the non-colliding proton beams - snippet-level, SRC_JACOW_IPAC2011_THPZ016.'
  - 'LHeC IR 2014 (reversed D1/D2 polarity): 6.8 mrad - snippet-level, SRC_JACOW_IPAC2014_TUPRO070.'
  - 'LHeC 2020/2022: ''a large crossing angle of 7 mrad for both proton beams'' - snippet-level, SRC_INDICO_1072533_4787015.'
  - 'LHeC phase-one (2025): ''head-on collisions between the proton and electron beam, so no crossing angle'' - snippet-level, SRC_ARXIV_2503_20475.'
  - These LHeC angles concern the two proton beams around the electron beam, not the colliding pair; they are listed as the spread of
    a related-machine IR, flagged as a conflict to reconcile (lhec-erl_unresolved.md).
  applicability: Screening only, LHMUC-DIS2026-1TEV. A luminosity model that uses any value other than 0 must also declare the crab-cavity
    assumption; a model using 0 must say that head-on is itself assumed.
  affected_outputs:
  - geometric luminosity reduction factor (lhmuc.analytical hourglass/crossing-angle terms)
  - parasitic beam-beam encounters and separation scheme
  - IR magnet layout (separator dipole, Q1 aperture)
  - detector forward acceptance and near-beam instrumentation (DET_GG_NEAR_BEAM_INSTRUMENTATION_WP)
  replacement_evidence: A numerical crossing angle from the HELP4CERN IR study or White Paper; until then, the LHeC IR papers read in
    full (arXiv:2007.14491, arXiv:2503.20475) to fix the related-machine value and the record IR_CROSSING_ANGLE_DIS2026 stays unknown.
  sensitivity_analysis: not_started
  date_added: '2026-10-28'
  notes: null
- assumption_id: ASM_IR_SEPARATOR_DIPOLE_FIELD
  parameter_id: IR_SEPARATOR_DIPOLE_FIELD_SYN
  status: synthetic_assumption
  reason_required: The DIS2026 proceedings prefer 'a new separator dipole' for the physical separation of the beams; a field is needed
    to place the dipole, size its aperture and compute synchrotron radiation and the separation at Q1.
  search_summary:
  - Reconnaissance of 2026-10-28 by the family scouts lhmuc-primary, lhec-erl, muon-collider-mdi, vffa-acceleration, ultracold-source,
    mulhc-mutristan and lhc-hl-lhc-protons (WebSearch only); their hits, queries and snippet quotations are in research/_fragments/<family>_sources.yaml,
    <family>_search_log.csv and <family>_unresolved.md.
  - Full text was read only for the five uploads (SRC_ARXIV_2610_35154, SRC_ARXIV_2506_15445, SRC_WS1681458_DAGLI_NUCLEUS, SRC_WS1681458_KHANPOUR_GAMMAGAMMA,
    SRC_WS_LEBOHO_KUMAR_DIHIGGS). Network policy blocked arxiv.org, indico.cern.ch, cds.cern.ch, inspirehep.net, pos.sissa.it, doi.org,
    jacow.org, iopscience.iop.org, e-publishing.cern.ch and every other CERN host, so every external value cited below is snippet-level
    (source access snippet_only or blocked), may not back reported_lhmuc and is capped at confidence medium (CLAUDE.md 1.5). The assumption
    author made no new web requests and did not use WebSearch.
  - 'Searched (lhec-erl family): ''LHeC interaction region design crossing angle separator dipole mini-beta quadrupole Q1 gradient aperture
    L*''; the 2020 separator-dipole field was not in any snippet.'
  sources_inspected:
  - SRC_ARXIV_2610_35154
  - SRC_ARXIV_2506_15445
  - SRC_WS1681458_DAGLI_NUCLEUS
  - SRC_WS1681458_KHANPOUR_GAMMAGAMMA
  - SRC_WS_LEBOHO_KUMAR_DIHIGGS
  - SRC_ARXIV_1206_2913
  - SRC_ARXIV_2007_14491
  - SRC_JACOW_IPAC2014_TUPRO070
  - SRC_DOI_10_5170_CERN_2004_003_V_1
  reason_authoritative_value_missing: SRC_ARXIV_2610_35154 p.4-5 states the preference ('the most preferred scheme is by introducing
    a new separator dipole') but gives no field, length or position (IR_BEAM_SEPARATION_SCHEME_DIS2026). No other LHmuC source mentions
    the dipole. The LHeC CDR value is snippet-level and refers to a 60 GeV electron beam.
  synthetic_model:
    distribution: uniform
    minimum: 0.1
    maximum: 1.0
    unit: T
  physical_basis:
  - Deflection angle = (B*L)/(B rho); B rho = 3336 T m for 1 TeV muons versus ~200 T m for 60 GeV electrons, so the LHeC CDR 0.3 T x
    9 m (2.7 T m, 13.5 mrad for electrons) gives only 0.8 mrad for LHmuC muons - the LHeC value is a lower anchor, not a transferable
    design.
  - SRC_ARXIV_2610_35154 p.4-5 notes that 'the problem of making high energy mu+p collisions is in general very similar to the pp case
    at the LHC', i.e. the relevant analogue is the LHC D1/D2 separation of two stiff beams (warm D1 dipoles of order 1 T; value to be
    verified in SRC_DOI_10_5170_CERN_2004_003_V_1, blocked), which motivates the 1 T upper bound.
  - 'Synchrotron radiation power scales as E^4/(m^4 rho^2): for 1 TeV muons it is ~(1000/60)^4/(206.8)^4 ~ 4e-5 of the LHeC electron
    case at equal bending radius, so radiation does not limit the field here (the LHeC CDR quotes 48 kW).'
  - Fields above 1 T (superconducting separators) are excluded from the screening range and would need a separate scenario.
  analogous_systems:
  - 'LHeC CDR 2012 IR: ''A 0.3 T field extending over 9 m allows for a beams separation of 0.07 m at the entry of Q1'' - snippet-level,
    SRC_ARXIV_1206_2913; the 2020 50 GeV / L* = 15 m separator field was not found in snippets (lhec-erl_unresolved.md).'
  - 'LHeC 2014 IR: D1 and D2 strength scalings (x3.43, x1.21) relative to the LHC - snippet-level, SRC_JACOW_IPAC2014_TUPRO070.'
  applicability: Screening only, LHMUC-DIS2026-1TEV IR layout sketches (G1). Must be replaced by an IR design before any separation
    claim.
  affected_outputs:
  - beam separation at the first quadrupole and parasitic-encounter clearance
  - IR magnet count/length budget inside L*
  - muon-decay background map near the IP (bent decay electrons)
  - G1 IR geometry in cad/
  replacement_evidence: HELP4CERN IR design (workshop Indico 1681458 or White Paper); LHeC IR papers read in full for the analogue (arXiv:2007.14491,
    arXiv:1206.2913).
  sensitivity_analysis: not_started
  date_added: '2026-10-28'
  notes: null
