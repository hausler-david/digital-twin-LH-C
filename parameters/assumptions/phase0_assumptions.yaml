    MACHINE_ALOHEP_EIC_PROTON_BUNCH_LENGTH_DAGLI2026).
  - 'LHC long-bunch upgrade options (Zimmermann slides 9-13, read in full, unrefereed slides restating LHC Project Report 627 and CERN-2005-006):
    PR627 super-bunch 75 m rms (or 10 x 7.5 m); Damerau-Garoby flat bunches of 40-50 cm, 4-5 m and 200-400 m total length.'
  - 'HL-LHC: rms bunch length in the TDR parameter table - SRC_URL_CERN_2020_010_HLLHC_TDR (blocked), not in the registry.'
  - 'muLHC muon bunch (not proton): 2 mm, SRC_ARXIV_2506_15445 Table 1 p.12 (read in full, MACHINE_MU_BUNCH_LENGTH_MULHC).'
  applicability: 'Screening only: LHMUC-DIS2026-1TEV and LHMUC-WS2026-FORTHOMME luminosity, hourglass and luminous-region models; widened
    on 2026-10-29 to cover proton bunch populations of 3-10 times HL-LHC. Not valid for the long-flat or super-bunch schemes (rms of
    order 1 m and above), which need separate scenarios. Placed in the IR file because its use is the IP model.'
  affected_outputs:
  - hourglass factor and luminosity reproduction tests
  - crossing-angle luminosity reduction
  - pile-up per crossing and vertex spread along z
