  physical_basis:
  - 'Real-estate gradient implied by the uploads: 10 GeV / 1 km = 10 MV/m (ACC_ERL_ENERGY_GAIN_PER_PASS_MULHC / ACC_ERL_LINAC_LENGTH_MULHC;
    ACCEL_BOOSTER_ENERGY_PER_LINAC_PASS_NUCL / ACCEL_BOOSTER_LINAC_LENGTH_NUCL) and 31.25 GeV / 3 km = 10.4 MV/m (ACC_BOOSTER_LINAC_ENERGY_GAIN_MUTRISTAN_MULHC
