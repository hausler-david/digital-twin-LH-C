  reason_authoritative_value_missing: 'No LHmuC source states it: SRC_ARXIV_2610_35154 Table 1 and SRC_WS1681458_FORTHOMME_DETECTOR
    p.17 have no bunch-length row, and SRC_ARXIV_2506_15445 Table 1 gives 2 mm for the muon bunch only. The nominal LHC rms length is
    now sourced (7.7 cm, LHC Project Report 627 restated by SRC_WS1681458_ZIMMERMANN_SPS_LHC p.9; the Phase-0 7.5 cm was an unsourced
    recollection), but it is not the LHmuC value: the LHmuC needs about 3 (Forthomme, implied under H = 1) to 10 (DIS2026) times the
    HL-LHC bunch population, and the long-bunch schemes reviewed by Zimmermann were worked out 20-25 years ago for the LHC, not for
    LHmuC conditions. The HL-LHC rms length is still not in the registry (TDR blocked).'
  synthetic_model:
    distribution: log_uniform
    minimum: 5.0
    maximum: 100.0
    unit: cm
  physical_basis:
  - 'Zimmermann rule of thumb (PROTON_BUNCH_MERGING_SCALING_RELATION_WS2026_ZIMMERMANN, slide 14; checked against LHC Project Report
    627 to a ratio of 0.91 in that record): merging n_b,0 bunches multiplies sigma_delta sigma_z by ~2 n_b,0. Counting n_b,0 in HL-LHC-type
    bunches of 2.2e11 (PROTON_BUNCH_POPULATION_MULHC) and taking sigma_z,0 = 7.7 cm (nominal LHC; the HL-LHC value is not in the registry),
    the Forthomme-implied 7.0e11 (n_b,0 = 3.2; PROTON_BUNCH_POPULATION_IMPLIED_WS2026_FORTHOMME, tests/scientific/test_workshop_decks.py::test_forthomme_beam_set_implied_proton_bunch_population)
    gives sigma_z = 0.19 m if the growth is shared equally between sigma_delta and sigma_z and 0.49 m if it goes entirely into length;
    the DIS2026 22e11 (n_b,0 = 10, PROTON_BUNCH_POPULATION_DIS2026) gives 0.34 m and 1.54 m. Audit arithmetic on a rule of thumb, not
    a design value.'
  - 'Long-bunch options restated by Zimmermann: Damerau-Garoby ''short and flat'' 40-50 cm total (0.12-0.14 m rms for a uniform profile,
    L/sqrt(12)), ''long and flat'' 4-5 m (1.15-1.44 m rms) and ''superbunch'' 200-400 m total (PROTON_LHC_FLATBUNCH_SHORT_FLAT_TOTAL_LENGTH_MIN_WS2026_ZIMMERMANN,
    PROTON_LHC_FLATBUNCH_LONG_FLAT_TOTAL_LENGTH_MIN_WS2026_ZIMMERMANN and their _MAX_ partners); PR627 super-bunch 75 m rms (PROTON_LHC_PR627_RMS_BUNCH_LENGTH_UPGRADE_SUPERBUNCH_WS2026_ZIMMERMANN).
    The band contains the nominal and short-flat options and excludes the long-flat and super-bunch schemes, which would change the
    IR, the detector and the luminosity model qualitatively and need their own scenarios.'
  - 'Hourglass (audit arithmetic: the head-on Gaussian model of lhmuc.analytical.hourglass_factor evaluated in 1-D form, ct-integral
    analytic; agrees with the tool to 1e-7 or better for sigma_z,p <= 0.13 m): H = 0.66 / 0.53 / 0.27 / 0.12 / 0.064 at sigma_z,p =
    5 / 7.7 / 20 / 50 / 100 cm for the muLHC-like optics of tests/scientific/test_analytical_checks.py::test_hourglass_factor_for_mulhc_like_optics
    (muon beta* 3 / 0.7 cm, proton beta* 7 cm, muon bunch 2 mm), and 0.90 / 0.82 / 0.54 / 0.28 / 0.16 for round beta* = 7 cm on both
    beams with sigma* = 4.3 um (the Forthomme set with the muon beta* assumed equal to the proton one).'
  - 'Upper bound 1 m: it covers the equal-share extrapolation for both populations and the full-length extrapolation for the Forthomme
    population; at 1 m the hourglass factor has fallen to 0.06-0.16 for the optics above, so most of the luminosity gained from a 3-10
    times higher population would be lost; the full-length DIS2026 extrapolation (1.54 m) and the long-flat option lie beyond it.'
  - 'Luminous region: for head-on Gaussian bunches the collision-point rms before hourglass weighting is sqrt(sigma_z,mu^2 + sigma_z,p^2)/2,
    i.e. 3.9 cm at 7.7 cm and 50 cm at 1 m. With the hourglass weighting 14-25 % (muLHC-like optics) or 31-50 % (round 7 cm optics)
    of the luminosity is produced at |s| > 6 cm, the documented nozzle-tip distance (DET_NOZZLE_TIP_DISTANCE_WS2026_KILIC), for sigma_z,p
    = 0.2-1 m, against 3-7 % at 7.7 cm; this record must therefore be scanned jointly with DET_NOZZLE_TIP_DISTANCE_FROM_IP_SYN.'
  - 'Lower bound 5 cm: below the nominal LHC 7.7 cm and the EIC 6 cm used by AloHEP; a higher population is expected to lengthen, not
    shorten, the bunch, so values below 7.7 cm are margin only.'
  - 'Distribution log-uniform (uniform until 2026-10-28): the band spans a factor 20 and the rule of thumb is multiplicative, with an
    unknown split of the growth between sigma_delta and sigma_z, so equal weight per factor is the defensible prior; the representative
    value is the geometric midpoint.'
  - 'The proton bunch length is set by the LHC RF systems and the longitudinal emittance, not by the LHmuC: the long-bunch schemes need
    new 40-80 MHz RF systems in the LHC (PROTON_LHC_LONGBUNCH_NEW_RF_FREQUENCY_MIN_WS2026_ZIMMERMANN, PROTON_LHC_LONGBUNCH_NEW_RF_FREQUENCY_MAX_WS2026_ZIMMERMANN),
    so any value well above the nominal implies an LHC modification.'
  analogous_systems:
  - 'Nominal LHC (2002 design, LHC Project Report 627 Table 1 restated on Zimmermann slide 9, SRC_WS1681458_ZIMMERMANN_SPS_LHC, read
    in full): rms bunch length 7.7 cm (PROTON_LHC_PR627_RMS_BUNCH_LENGTH_NOMINAL_WS2026_ZIMMERMANN); the same 7.7 cm in the AloHEP LHC
