  range_vs_evidence: 'Superseding values INSIDE; one documented option ABOVE. Phase-0 band (2026-10-28): uniform 5-20 m. No LHmuC L*
    is published even now; the superseding records are related-machine values. LHeC: L* = 15 m to the first proton quadrupole (Andre
    et al. 2022 p.16 ''At this position, L* =15 m'', IR_LSTAR_ANDRE2022; the shorter option on the Forthomme LHmuC deck p.4, IR_LSTAR_LHEC_WS2026_FORTHOMME).
    IMCC 10 TeV: L* = 6 m to the last magnet, the nozzle filling that space (MuCol MR7 Appendix G p.65, IR_LSTAR_MR7). Both lie inside
    5-20 m. The longer LHeC IR option on the same Forthomme slide, L* = 23 m (''factor 2 in critical energy levels from L*=15m to 23m'';
    IR_LSTAR_FCCEH_WS2026_FORTHOMME, whose id token does not mean the slide names FCC-eh), lies ABOVE the Phase-0 upper bound, which
    had excluded the then snippet-level 23 m. Definitional caveat: the LHeC 15 m is the PROTON L*, with the electron mini-beta quadrupoles
    Q0F/Q0D inside it (IR_ELEMENT_SEQUENCE_ANDRE2022), so for the LHmuC option of focusing the muons ''in between the mini-beta quadrupoles''
    the muon L* would be shorter than 15 m; only the IMCC 6 m is a muon L*. Scan band re-based on 2026-10-29 to uniform 4-25 m.'
  reason_required: Every IR optics model (beta-function growth in the final doublet/triplet, chromaticity, aperture, separator-dipole
