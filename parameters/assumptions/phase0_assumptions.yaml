    CONF_LHEC_CROSSING_ANGLE.'
- assumption_id: ASM_IR_SEPARATOR_DIPOLE_FIELD
  parameter_id: IR_SEPARATOR_DIPOLE_FIELD_SYN
  status: synthetic_assumption
  reason_required: The DIS2026 proceedings prefer 'a new separator dipole' for the physical separation of the beams; a field is needed
