- assumption_id: ASM_PROTON_BUNCH_LENGTH_RMS
  parameter_id: PROTON_BUNCH_LENGTH_RMS_SYN
  status: synthetic_assumption
  reason_required: The hourglass factor, the crossing-angle luminosity reduction, the luminous-region length and the pile-up / vertex
    spread depend on the proton bunch length. The LHmuC asks for about 3 to 10 times the HL-LHC proton bunch population, which by Zimmermann's
    rule of thumb lengthens the bunch and/or increases its energy spread, and no LHmuC source states the resulting bunch length.
  search_summary:
  - Reconnaissance of 2026-10-28 by the family scouts lhmuc-primary, lhec-erl, muon-collider-mdi, vffa-acceleration, ultracold-source,
    mulhc-mutristan and lhc-hl-lhc-protons (WebSearch only); their hits, queries and snippet quotations are in research/_fragments/<family>_sources.yaml,
    <family>_search_log.csv and <family>_unresolved.md.
  - Full text was read only for the five uploads (SRC_ARXIV_2610_35154, SRC_ARXIV_2506_15445, SRC_WS1681458_DAGLI_NUCLEUS, SRC_WS1681458_KHANPOUR_GAMMAGAMMA,
    SRC_WS_LEBOHO_KUMAR_DIHIGGS). Network policy blocked arxiv.org, indico.cern.ch, cds.cern.ch, inspirehep.net, pos.sissa.it, doi.org,
    jacow.org, iopscience.iop.org, e-publishing.cern.ch and every other CERN host, so every external value cited below is snippet-level
    (source access snippet_only or blocked), may not back reported_lhmuc and is capped at confidence medium (CLAUDE.md 1.5). The assumption
    author made no new web requests and did not use WebSearch.
  - 'Searched (lhc-hl-lhc-protons family): HL-LHC TDR parameter-table queries (''2.2e11 ... 2760 bunches 2.5 um 15 cm beta* 25 ns 7
    TeV parameters table''), PDG collider-parameter review queries, LHC Design Report queries; bunch length appeared in no snippet.'
  - '2026-10-29 (uploads read in full, no web access): the Zimmermann deck (SRC_WS1681458_ZIMMERMANN_SPS_LHC) restates LHC Project Report
    627 Table 1 (slide 9: rms bunch length 7.7 cm in the nominal, ultimate and 2808-bunch upgrade columns, 7500 cm for one super-bunch,
    or 10 super-bunches of 7.5 m) and the Damerau-Garoby flat-bunch comparison CERN-2005-006 Table 3 (slide 13: total lengths 40-50
    cm, 4-5 m, 200-400 m), and concludes (slide 14) ''Higher intensity is accompanied by longer bunches and/or larger energy spread
    - Roughly speaking sigma_delta sigma_z ~ 2 n_b,0 sigma_delta,0 sigma_z,0''. AloHEP (SRC_ARXIV_2610_09839) uses 7.7 cm (LHC Piwinski
    example), 8.5 cm (HERA) and 6 cm (EIC). The Forthomme LHmuC beam set (SRC_WS1681458_FORTHOMME_DETECTOR p.17) states no bunch length.
    No LHmuC proton bunch length exists.'
