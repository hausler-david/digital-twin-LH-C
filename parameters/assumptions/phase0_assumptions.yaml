    at |s| > 6 cm (both sides; on the incoming-muon side inside the nozzle) for sigma_z,p = 0.2-1 m, against 3-7 % at 7.7 cm (audit
    arithmetic quoted in ASM_PROTON_BUNCH_LENGTH_RMS); tip distance and proton bunch length must be scanned jointly.'
  - A weaker decay source at LHmuC (ASM_DET_NOZZLE_OPENING_ANGLE) would allow the tip to retreat from the IP and keep more vertex-detector
