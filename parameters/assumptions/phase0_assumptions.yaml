    reference (imported_related).
  sensitivity_analysis: not_started
  date_added: '2026-10-28'
  notes: 'Phase-0 band uniform 5-12 cm (2026-10-28) widened on 2026-10-29 to log-uniform 5-100 cm (0.05-1 m) after the Zimmermann deck.
    CAUTION for scans: lhmuc.analytical.hourglass_factor (2-D scipy dblquad) is accurate to 1e-7 or better up to sigma_z,p = 0.13 m
    but raises an IntegrationWarning from about 0.15 m and under-reports H with a 2 mm muon bunch (-0.2 % at 0.15 m; -4.5 % / -16 %
    / -24 % at 0.2 / 0.5 / 1 m for the muLHC-like optics; -10 % / -35 % / -49 % for round 7 cm optics), against the converged 1-D integral
    of the same model; do not use it above ~0.13 m until it is fixed or bounded by a registered test. CONF_LUMI_MODEL_ASSUMPTIONS refers
    to this record as ''7.5 cm''; its value was the Phase-0 band midpoint (8.5 cm) and is now the geometric midpoint (22.4 cm), never
    an estimate.'
