  reason_authoritative_value_missing: 'Phase 0 (2026-10-28): SRC_ARXIV_2610_35154 p.4 (section 3) only lists two options - muon focusing
    ''in between the mini-beta quadrupoles of the LHC, as is proposed for electrons at the LHeC'' or ''outside ... in a linear collider
    type style'' - and selects neither; SRC_ARXIV_2506_15445 gives beta* but no L*; the three workshop decks give no IR geometry. The
    LHeC IR papers that would anchor the inside option (arXiv:2007.14491, arXiv:2207.02095, IPAC2021 WEPAB001) and the IMCC MDI slides
    were blocked. Superseded on 2026-10-29: still no LHmuC L*; the LHeC (15 m, proton L*) and IMCC (6 m) values are now read in full
    and serve as evidence-backed baselines (superseded_by).'
  synthetic_model:
    distribution: uniform
    minimum: 4.0
    maximum: 25.0
    unit: m
  physical_basis:
  - beta(s) = beta* + s^2/beta* grows to ~L*^2/beta* at the first quadrupole, so L* together with beta* sets the magnet aperture and
    chromaticity; the band must be read together with IR_BETA_X_STAR_MUON_SYN and IR_BETA_Y_STAR_MUON_SYN.
  - 'Lower bound 4 m (re-based 2026-10-29): below the IMCC muon L* of 6 m (IR_LSTAR_MR7). The IMCC nozzle ends at the last magnet
    (base plane at |z| = 595 cm, DET_NOZZLE_LENGTH_MR7; MR7 p.65 states that the nozzle extends from the last magnet, L* = 6 m, to
    almost the IP). The LHmuC study puts its nozzle base 593.8 cm from the IP (DET_NOZZLE_BASE_DISTANCE_FROM_IP_IMPLIED_WS2026_KILIC)
    but does not say what lies behind it (corrected by the registry-stage verifier, 2026-10-29). An L* below ~6 m is therefore consistent
    only with a shorter nozzle; scans must impose z_tip + L_nozzle <= L* jointly with DET_NOZZLE_TIP_DISTANCE_FROM_IP_SYN and DET_NOZZLE_LENGTH_SYN.'
  - 'Upper bound 25 m: just above the longer LHeC IR option L* = 23 m (IR_LSTAR_FCCEH_WS2026_FORTHOMME), chosen there to halve the synchrotron-radiation
    critical energy of 50-60 GeV electrons, an argument that does not transfer to 1 TeV muons (ASM_IR_SEPARATOR_DIPOLE_FIELD). A ''linear
    collider type'' focusing outside the LHC mini-beta quadrupoles (SRC_ARXIV_2610_35154 p.4) would need the LHC IR layout distances,
    which are still not in the registry (SRC_DOI_10_5170_CERN_2004_003_V_1 blocked).'
  - The LHeC 15 m is a proton L* with the electron final-focus quadrupoles inside it, so the muon L* is expected below 15 m for the
    'in between the mini-beta quadrupoles' option and above it for the 'outside' option; the band spans both.
  - The muon beam is stiff (B rho = 3336 T m at 1 TeV), so the beam-separation argument that fixes L* at the LHeC (soft 50-60 GeV electrons)
    does not transfer directly; see ASM_IR_SEPARATOR_DIPOLE_FIELD.
  analogous_systems:
  - 'LHeC (read in full): proton L* = 15 m, Andre et al. 2022 p.16 (SRC_ARXIV_2201_02436, IR_LSTAR_ANDRE2022); the same 15 m and a longer
    23 m option on the LHmuC detector deck p.4 (SRC_WS1681458_FORTHOMME_DETECTOR, unrefereed slides; IR_LSTAR_LHEC_WS2026_FORTHOMME,
    IR_LSTAR_FCCEH_WS2026_FORTHOMME).'
  - 'IMCC 10 TeV (MuCol MR7 Appendix G p.65, SRC_ARXIV_2510_27437, read in full): L* = 6 m (IR_LSTAR_MR7); the same 6 m in MAIA (IR_LSTAR_MAIA).'
  - 'FCC-eh: L* = 23 m, beta* = 30 cm - snippet-level, SRC_INDICO_1072533_4787015; outside the Phase-0 band, inside the 4-25 m scan
    band of 2026-10-29; the Forthomme slide shows the same 23 m as an LHeC IR option without naming FCC-eh (IR_LSTAR_FCCEH_WS2026_FORTHOMME).'
  applicability: Scan variable only (assumption superseded by evidence on 2026-10-29). IR_LSTAR_SYN may be used only to scan L* over
