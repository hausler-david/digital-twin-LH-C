  - SRC_ARXIV_2203_06258
  - SRC_WS1681458_ZIMMERMANN_SPS_LHC
  - SRC_ARXIV_2610_09839
  reason_authoritative_value_missing: 'SRC_ARXIV_2610_35154 p.4: ''The time separation of muon bunches is large at LHmuC, therefore,
    a very small crossing angle is needed to avoid parasitic collisions of muon and proton bunches'' - no number, and a head-on scheme
    is not claimed (recorded as IR_CROSSING_ANGLE_DIS2026 = unknown). SRC_ARXIV_2506_15445 and the workshop decks are silent. LHeC values
    exist only as snippets and differ between design iterations. Status 2026-10-29: unchanged; the Forthomme beam set repeats the qualitative
    requirement (''small crossing angle'') without a number (IR_CROSSING_ANGLE_WS2026_FORTHOMME is unknown, value null).'
  synthetic_model:
    distribution: uniform
    minimum: 0.0
    maximum: 10.0
    unit: mrad
  physical_basis:
  - '0 mrad (head-on) is a physical value inside the range, not ''unknown''. The DIS2026 Table 1 peak luminosity is reproduced with
    no geometric reduction factor (docs/limitations.md section 5), and so is the Forthomme set (tests/scientific/test_workshop_decks.py::test_forthomme_beam_set_implied_proton_bunch_population):
    neither published LHmuC luminosity contains a crossing-angle reduction.'
  - 'Parasitic encounters: the first one lies at c x (proton bunch spacing)/2 from the IP - 3.75 m for the 25 ns LHC pattern (PROTON_BUNCH_SPACING_LHC_MULHC;
    the LHeC paper: ''at a distance of half a bunch spacing (25/2 ns)'', IR_PARASITIC_ENCOUNTER_HALF_SPACING_ANDRE2022), but 37.5-45
    m if the proton bunches follow the 250-300 ns muon spacing (MACHINE_MU_BUNCH_SPACING_DIS2026, MACHINE_MU_BUNCH_SPACING_WS2026_FORTHOMME),
    as the request for far fewer, more intense LHC bunches implies (''say, 1%'', PROTON_BUNCH_NUMBER_FRACTION_REQUESTED_WS2026_ZIMMERMANN).
    The LHmuC proton bunch spacing is not stated; the DIS2026 remark that the large muon bunch separation needs only ''a very small
    crossing angle'' fits the second case.'
  - 'Luminosity: for head-on-crossing Gaussian bunches without hourglass, the reduction is 1/sqrt(1 + phi^2) with phi = tan(theta_c/2)
    sqrt(sigma_z,mu^2 + sigma_z,p^2)/sqrt(sigma*_mu^2 + sigma*_p^2); for round matched 4.8 um beams (IR_SIGMA_X_IP_MUON_DIS2026), a
    2 mm muon bunch and a 7.7 cm proton bunch, phi = 1 at theta_c ~ 0.18 mrad, and at ~0.014 mrad for a 1 m proton bunch (PROTON_BUNCH_LENGTH_RMS_SYN
    now spans 5-100 cm). The Phase-0 text used the equal-bunch-length form (0.13 mrad at 7.5 cm). Any angle above a few tenths of a
    mrad costs a large luminosity factor unless crab cavities are used, which no LHmuC source mentions.'
  - Upper bound 10 mrad brackets every LHeC proton-proton crossing angle quoted in snippets (6, 6.8, 7 mrad) and the LHC Project Report
    627 values (0.3-1 mrad); the EIC 25 mrad with crab cavities lies outside and would require crab cavities.
  analogous_systems:
  - 'LHeC 2022 (SRC_ARXIV_2201_02436, read in full): head-on e-p collisions, the electron beam steered by the detector dipole B0 (IR_COLLISION_SCHEME_ANDRE2022);
    the non-colliding proton beam is separated by a horizontal offset at IP2 and a vertical crossing angle whose value is not stated
    (IR_NONCOLLIDING_BEAM_SEPARATION_ANDRE2022). The LHmuC detector deck shows the same head-on LHeC scheme (IR_COLLISION_SCHEME_LHEC_WS2026_FORTHOMME).'
  - 'LHC Project Report 627 restated by Zimmermann (SRC_WS1681458_ZIMMERMANN_SPS_LHC slide 9, read in full): full p-p crossing angles
    300 urad (nominal, ultimate), 466 urad (Piwinski upgrade), 1000 urad (super-bunch) (PROTON_LHC_PR627_CROSSING_ANGLE_NOMINAL_WS2026_ZIMMERMANN
    and its partners); AloHEP LHC Piwinski example 285 urad (MACHINE_ALOHEP_LHC_EXAMPLE_FULL_CROSSING_ANGLE_DAGLI2026).'
  - 'EIC: 25 mrad with crab cavities, quoted as context by the MuIC paper (SRC_ARXIV_2203_06258 p.8, IR_CROSSING_ANGLE_EIC_DESIGN_MUIC2022).'
  - 'LHeC linac-ring IR 2011: 6 mrad between the non-colliding proton beams - snippet-level, SRC_JACOW_IPAC2011_THPZ016.'
  - 'LHeC IR 2014 (reversed D1/D2 polarity): 6.8 mrad - snippet-level, SRC_JACOW_IPAC2014_TUPRO070.'
  - 'LHeC 2020/2022: ''a large crossing angle of 7 mrad for both proton beams'' - snippet-level, SRC_INDICO_1072533_4787015.'
  - 'LHeC phase-one (2025): ''head-on collisions between the proton and electron beam, so no crossing angle'' - snippet-level, SRC_ARXIV_2503_20475.'
  - These LHeC angles concern the two proton beams around the electron beam, not the colliding pair; they are listed as the spread of
    a related-machine IR, flagged as a conflict to reconcile (lhec-erl_unresolved.md).
  applicability: Screening only, LHMUC-DIS2026-1TEV. A luminosity model that uses any value other than 0 must also declare the crab-cavity
    assumption; a model using 0 must say that head-on is itself assumed.
  affected_outputs:
  - geometric luminosity reduction factor (lhmuc.analytical hourglass/crossing-angle terms)
  - parasitic beam-beam encounters and separation scheme
  - IR magnet layout (separator dipole, Q1 aperture)
  - detector forward acceptance and near-beam instrumentation (DET_GG_NEAR_BEAM_INSTRUMENTATION_WP)
  replacement_evidence: A numerical crossing angle from the HELP4CERN IR study or White Paper (neither the DIS2026 proceedings nor the
    Forthomme beam set give one), together with the LHmuC proton bunch spacing; until then IR_CROSSING_ANGLE_DIS2026 and IR_CROSSING_ANGLE_WS2026_FORTHOMME
    stay unknown.
  sensitivity_analysis: not_started
  date_added: '2026-10-28'
  notes: 'Updated 2026-10-29: kept synthetic, band unchanged (uniform 0-10 mrad). The parasitic-encounter and Piwinski statements of
