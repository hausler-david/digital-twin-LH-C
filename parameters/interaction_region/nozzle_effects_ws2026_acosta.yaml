# Nozzle effects on the scattered-muon measurement: D. Acosta et al., 'Near-Beam Muon Detectors', HELP4CERN workshop 'Ultra-cold muons for the LHC', AGH Kraków,
# 24 Sept 2026 (SRC_WS1681458_ACOSTA_NEAR_BEAM, PRIMARY_LHMUC; nozzle slides 10, 13-15, 22 and backup slide 28 only; the toroid spectrometer and Bhabha slides are
# extracted by other groups). Schema: schemas/provenance.schema.json. Status reported_lhmuc for the deck's own LHμC statements and estimates; analogous for the
# restated μ+μ−-collider nozzle properties (6 m, tungsten, ~2.4 < |η| < 7, central |η| < 2.4, JINST 13 P09004 drawing) and for the Collamati et al. 2021 figure
# (750 GeV beams, BIB numbers with/without nozzles). Confidence capped at medium (unrefereed slides), low for the Collamati numbers (normalisation not stated).
# P1 checks: PDG multiple-scattering formula (6 m of W, X0 = 0.3504 cm) reproduces 0.72 / 0.48 / 0.14 mrad; the Gaussian-fit mean 886.3 GeV is consistent with
# the '~10 %' peak loss; DIS lepton kinematics reproduce E = 900 GeV and η = 6 for Q2 = 20 GeV2, x = 0.8e-5. scenario is null (no scenario file assigned).
# Generated by the G4_MDI_NOZZLE addendum extraction (2026-10-28); adversarially verified 2026-10-29 (research/_fragments/verify_G4_MDI_NOZZLE.md).
