    confidence: medium
    assumption_id: null
  validation:
    level: P0
    methods: []
    check_ids: []
    notes: ''
  dependencies: []
  date_added: '2026-10-28'
  responsible_module: parameters/machine
  notes: 'ID TOKEN ''PROTON'' WAS ASSIGNED BY THE LEAD''S CANONICAL ID LIST; the paper does not attribute the 15 mm mrad to
    the proton beam. The surrounding text (p.18) describes the electron distribution after collision (Fig. 20) and says ''The
    beam-beam effect on the proton bunch remains in the shadow of the other effects and is considered as not critical'', and
    Fig. 22 plots the electron normalised emittance growth in mm mrad with a jump at the IP. Read this record as ''Δγε of
    Table 4, beam unspecified, most plausibly the electron beam''; confidence medium for that reason. Physical plausibility
    check (G8 verification, 2026-10-29): the paper''s own electron normalised emittance is 30 mm mrad (Table 2, ACC_ERL_NORM_EMITTANCE_ANDRE2022),
    so 15 mm mrad is a 50 % growth of the ELECTRON emittance across the beam-beam collision, matching the electron-emittance
    jump at the IP in Fig. 22; for the proton beam a growth of 15 mm mrad would be several times a typical LHC proton normalised
    emittance (not stated in this paper) and could not be ''in the shadow of the other effects''. The lead''s id token is
    kept unchanged. Renamed by the lead on 2026-10-29 from MACHINE_ELECTRON_EMITTANCE_GROWTH_ANDRE2022. Table 4 does not name
    the beam; §4.8 (p. 18) tracks the electron beam in a weak-strong simulation, reuses its coordinates for the deceleration,
    and says ''The beam-beam effect on the proton bunch remains in the shadow of the other effects''. The electron attribution
    is therefore an inference, kept at confidence medium.'
