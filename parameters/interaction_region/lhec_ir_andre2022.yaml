# labelled points, Table 4, Table 5 cell by cell) plus the machine-level records of this paper (proton/ion energies, luminosity goal, Table 4 luminosity,
# integrated-luminosity goals, derived √s); subsystem and responsible_module are set per record. READ THE NOTES of IR_BETA_X_STAR_ANDRE2022 /
# IR_BETA_Y_STAR_ANDRE2022 (the Fig. 19 header reads β*_p = 10.0 cm and β*_e = 10.9 cm; the X/Y id tokens come from the lead's canonical list) and of
