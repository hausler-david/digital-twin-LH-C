# Synthetic screening ranges for the LHmuC interaction region (plus the proton bunch length used in the IP model).
# status: synthetic (CLAUDE.md 1.4). Every record here is a screening RANGE with an assumption record in
# parameters/assumptions/phase0_assumptions.yaml; 'value' is only the range midpoint (or a representative member of a
# discrete set) so that software has a number to display. None of these numbers is an LHmuC design value.
# Date: 2026-10-28. Author role: assumptions and synthetic-range author (Phase 0 evidence audit).
parameters:
- parameter_id: IR_LSTAR_SYN
  name: Distance from the IP to the first final-focus magnet of the muon beam (L*)
  symbol: L*
  subsystem: interaction_region
  scenario: LHMUC-DIS2026-1TEV
  value: 12.5
  unit: m
  uncertainty:
    type: interval
    lower: 5.0
    upper: 20.0
    unit: m
    note: Synthetic range, not a measured uncertainty; see ASM_IR_LSTAR.
  allowed_range:
    min: 5.0
    max: 20.0
    unit: m
    basis: synthetic screening range, see assumption record ASM_IR_LSTAR
  provenance:
    status: synthetic
    extraction_method: assumption_record
    source: null
    derivation: null
    applicability:
      category: screening_only
      scenario: LHMUC-DIS2026-1TEV
      explanation: Screening only, LHMUC-DIS2026-1TEV optics models. The LHmuC IR has not been designed; the range brackets the two
        focusing options named in the DIS2026 proceedings and must be replaced before any optics result is reported.
    confidence: low
    assumption_id: ASM_IR_LSTAR
  validation:
    level: P0
    methods:
    - dimensional check of the unit string
    - range bracketed by the analogous-system values listed in the assumption record (snippet-level, unverified)
    check_ids: []
    notes: Unverified synthetic input; no LHmuC source gives this quantity.
  dependencies:
  - IR_MUON_FOCUSING_OPTIONS_DIS2026
  date_added: '2026-10-28'
  responsible_module: parameters/interaction_region
  notes: 'SYNTHETIC: value is the arithmetic midpoint of the synthetic range and exists only so that software, plots and exports have
    a number to display; it is NOT an LHmuC design value. Any use must carry the assumption_id and the range (CLAUDE.md 1.4).'
- parameter_id: IR_CROSSING_ANGLE_SYN
