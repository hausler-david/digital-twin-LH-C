- parameter_id: PROTON_BUNCH_LENGTH_RMS_SYN
  name: RMS proton bunch length at collision (synthetic log-uniform screening range)
  symbol: sigma_z,p
  subsystem: proton_beam
  scenario: LHMUC-DIS2026-1TEV
  value: 22.4
  unit: cm
  uncertainty:
    type: interval
    lower: 5.0
    upper: 100.0
    unit: cm
    note: Synthetic log-uniform range, not a measured uncertainty; see ASM_PROTON_BUNCH_LENGTH_RMS.
  allowed_range:
    min: 5.0
    max: 100.0
    unit: cm
    basis: synthetic log-uniform screening range (0.05-1 m), widened on 2026-10-29; see assumption record ASM_PROTON_BUNCH_LENGTH_RMS
  provenance:
    status: synthetic
    extraction_method: assumption_record
    source: null
    derivation: null
    applicability:
      category: screening_only
      scenario: LHMUC-DIS2026-1TEV
      explanation: Screening only, LHMUC-DIS2026-1TEV and LHMUC-WS2026-FORTHOMME luminosity, hourglass and luminous-region models; covers
        proton bunch populations of 3-10 times HL-LHC; not the long-flat or super-bunch schemes. Placed in the IR file because its use
        is the IP model.
    confidence: low
    assumption_id: ASM_PROTON_BUNCH_LENGTH_RMS
  validation:
    level: P0
    methods:
    - dimensional check of the unit string
