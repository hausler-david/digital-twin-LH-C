  value: 5.0
  unit: mrad
  uncertainty:
    type: interval
    lower: 0.0
    upper: 10.0
    unit: mrad
    note: Synthetic range, not a measured uncertainty; see ASM_IR_CROSSING_ANGLE.
  allowed_range:
    min: 0.0
    max: 10.0
    unit: mrad
    basis: synthetic screening range, see assumption record ASM_IR_CROSSING_ANGLE
  provenance:
    status: synthetic
    extraction_method: assumption_record
    source: null
    derivation: null
    applicability:
      category: screening_only
      scenario: LHMUC-DIS2026-1TEV
      explanation: Screening only, LHMUC-DIS2026-1TEV. A luminosity model that uses any value other than 0 must also declare the crab-cavity
        assumption; a model using 0 must say that head-on is itself assumed.
    confidence: low
    assumption_id: ASM_IR_CROSSING_ANGLE
  validation:
    level: P0
    methods:
    - dimensional check of the unit string
