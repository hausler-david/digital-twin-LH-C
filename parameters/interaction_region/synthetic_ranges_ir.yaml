  - MACHINE_MU_BUNCH_SPACING_DIS2026
  - IR_SIGMA_X_IP_MUON_DIS2026
  date_added: '2026-10-28'
  responsible_module: parameters/interaction_region
  notes: 'SYNTHETIC: value is the arithmetic midpoint of the synthetic range and exists only so that software, plots and exports have
    a number to display; it is NOT an LHmuC design value. Any use must carry the assumption_id and the range (CLAUDE.md 1.4). 0 inside
    this range means head-on, a physical value; the unknown reported value stays in IR_CROSSING_ANGLE_DIS2026.'
