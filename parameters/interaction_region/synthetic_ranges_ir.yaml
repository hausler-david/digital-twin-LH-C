# Synthetic screening ranges for the LHmuC interaction region (plus the proton bunch length used in the IP model).
# status: synthetic (CLAUDE.md 1.4). Every record here is a screening RANGE with an assumption record in
# parameters/assumptions/phase0_assumptions.yaml; 'value' is only the range midpoint (or a representative member of a
# discrete set) so that software has a number to display. None of these numbers is an LHmuC design value.
# Date: 2026-10-28. Author role: assumptions and synthetic-range author (Phase 0 evidence audit).
# Updated 2026-10-29: records whose assumption is superseded_by_evidence (parameters/assumptions/phase0_assumptions.yaml) are
# SYNTHETIC SCAN VARIABLES ONLY; their bands were re-based to bracket every documented option and no scenario slot may point to
# them. Records whose assumption stays synthetic carry updated dependencies and notes; PROTON_BUNCH_LENGTH_RMS_SYN was widened to
# a log-uniform 5-100 cm range (value = geometric midpoint).
parameters:
- parameter_id: IR_LSTAR_SYN
  name: Distance from the IP to the first final-focus magnet of the muon beam (L*) (synthetic scan variable; assumption superseded by
    evidence)
  symbol: L*
  subsystem: interaction_region
  scenario: LHMUC-DIS2026-1TEV
  value: 14.5
  unit: m
  uncertainty:
    type: interval
    lower: 4.0
    upper: 25.0
    unit: m
    note: Synthetic scan band, not a measured uncertainty; see ASM_IR_LSTAR (superseded by evidence on 2026-10-29).
  allowed_range:
    min: 4.0
    max: 25.0
    unit: m
    basis: synthetic scan band bracketing every documented L* (6 m IMCC, 15 m and 23 m LHeC options); see ASM_IR_LSTAR (superseded_by_evidence)
  provenance:
    status: synthetic
    extraction_method: assumption_record
    source: null
    derivation: null
    applicability:
      category: screening_only
      scenario: LHMUC-DIS2026-1TEV
      explanation: 'Scan variable only (ASM_IR_LSTAR superseded by evidence on 2026-10-29); LHMUC-DIS2026-1TEV-type IR sketches. No
        LHmuC L* exists; baselines are related-machine values: IR_LSTAR_ANDRE2022 and IR_LSTAR_LHEC_WS2026_FORTHOMME (LHeC proton L*
        15 m) and IR_LSTAR_MR7 (IMCC muon L* 6 m). No scenario slot may point to this record.'
    confidence: low
    assumption_id: ASM_IR_LSTAR
  validation:
    level: P0
    methods:
    - dimensional check of the unit string
    - band brackets every evidence-backed record named in the assumption record (read in full; see range_vs_evidence)
    check_ids: []
    notes: Synthetic scan variable; it validates nothing and confers at most P1 on dependents.
  dependencies:
  - IR_MUON_FOCUSING_OPTIONS_DIS2026
  - IR_LSTAR_LHEC_WS2026_FORTHOMME
  - IR_LSTAR_ANDRE2022
  - IR_LSTAR_MR7
  - IR_LSTAR_FCCEH_WS2026_FORTHOMME
  date_added: '2026-10-28'
  responsible_module: parameters/interaction_region
  notes: 'SYNTHETIC SCAN VARIABLE ONLY: ASM_IR_LSTAR is superseded by evidence (2026-10-29); this record survives only to scan the band
    4-25 m in screening and sensitivity studies, and no scenario slot may point to it. Baselines: IR_LSTAR_ANDRE2022 and IR_LSTAR_LHEC_WS2026_FORTHOMME
    (15 m, LHeC proton L*), IR_LSTAR_MR7 (6 m, IMCC muon L*); the 23 m LHeC option (IR_LSTAR_FCCEH_WS2026_FORTHOMME) lay above the Phase-0
    band. value is the arithmetic midpoint of the band and exists only so that software, plots and exports have a number to display;
    it is NOT an LHmuC design value. Phase-0 band uniform 5-20 m (2026-10-28); re-based on 2026-10-29 to bracket every documented option.
    Any use must carry the assumption_id and the band (CLAUDE.md 1.4).'
